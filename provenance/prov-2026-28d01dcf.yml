author: calebcowen@gmail.com
intent: withSession runs a function with a bearer token for the Provisio session and turns session failures into exit status 3.
constraints:
  - withSession is an unexported function with two parameters in order, ctx (a context.Context) and fn (a function taking the bearer string and returning an error), and it returns an error.
  - 'Step 1: call sessionManager, a function defined elsewhere in package main with no parameters returning a pointer to auth.Manager and an error.'
  - If sessionManager fails, withSession returns that error unchanged and does not call fn.
  - 'Step 2: call the manager''s Do method, a method of auth.Manager with a pointer receiver, taking ctx and fn and returning an error.'
  - 'Step 3: withSession returns the result of sessionError called with the error from Do.'
  - sessionError is a function defined elsewhere in package main with one parameter, an error, returning an error.
  - A nil error from Do therefore gives a nil result.
  - fn is called at most twice, as decided by Do.
  - context.Context comes from the standard-library package context.
  - auth.Manager comes from the package github.com/livecodelife/provenance/auth.
  - This unit does not change the file's imports.
affected_scope:
  - cmd/provenance/session_run.go
