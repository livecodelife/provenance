author: calebcowen@gmail.com
intent: the snapshotOwner function names the record whose version snapshot a path lies in.
constraints:
  - The function receives a pointer to a repo and a path string, in that order
  - The function returns a string
  - The repo's Config.Dir field (the records directory, a string) is converted to forward slashes and followed by "/.versions/" to form the snapshot prefix
  - The function returns the empty string when the path does not start with the snapshot prefix
  - The function returns the text between the prefix and the next slash, which is the record id
  - The function returns the empty string when nothing after the prefix is followed by a slash
  - The function returns the empty string when the text between the prefix and the next slash is empty
  - The repo parameter is a pointer to the repo struct defined in common_run.go of package main
  - The repo's Config.Dir field is a string holding the records directory relative to the repo root, without a trailing slash
  - The function adds no imports
