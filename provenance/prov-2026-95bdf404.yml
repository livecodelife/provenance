intent: the printViolations function writes the outcome of a check in human-readable form.
constraints:
  - The function receives an io.Writer out and a slice of violation, in that order, and returns nothing
  - When the slice is empty, the function writes a blank line, then the line "✓ No forbidden scope violations in staged", then a blank line, and returns
  - Otherwise the function first writes a blank line, then the line "✗ Forbidden scope violation in staged", then a blank line
  - A violation whose RecordID is empty is written at once as two spaces followed by its Message and a newline, in the order met
  - The other violations are grouped by RecordID
  - Groups are ordered by the first appearance of their RecordID
  - Within a group, violations keep their original order
  - Each group starts with the line of two spaces, the record id and " forbids changes to:"
  - Within a group, a violation with a non-empty File is written as four spaces, a middle dot, a space and the file
  - Within a group, a violation with an empty File is written as four spaces followed by its Message
  - A blank line follows each group
  - 'The output ends with the line "  Hint: If this change is intentional, revise the record to widen its scope (provenance edit --add-scope) or create a record that covers it." followed by a blank line'
  - The function adds no imports
