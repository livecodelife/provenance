intent: the deletedFromPreviousScope function reports whether a deleted file was in the scope of the record's previous version.
constraints:
  - 'The function receives, in order: a pointer to a repo, a pointer to a record.FilesStore, the base string, the tree string, a pointer to a record.Record and the path string'
  - The function returns a boolean
  - The function returns false when the record's Version is less than 2
  - The function returns false unless the path does not exist in the tree (the tree path joined with the path converted to the operating system's separator)
  - A stat error other than not-exist makes the function return false
  - 'The function returns false unless headHas (parameters: a pointer to a repo, a revision string and a path string; returns a boolean) says the path exists at the base'
  - 'The function loads the snapshot of the version one less than the record''s Version with the store''s Snapshot method (parameters: the record id string and a version integer; returns a snapshot pointer and an error)'
  - The function returns false when loading the snapshot fails
  - The function returns false when the snapshot's Content is nil
  - 'The function returns false when the path matches any pattern of the record''s ForbiddenScope using scope.Match (parameters: path and pattern strings; returns a boolean and an error)'
  - A pattern whose match returns an error counts as not matching
  - The function returns true when the path matches any pattern of the snapshot content's AffectedScope
  - The function returns false otherwise
  - The snapshot's Content is a pointer to a record whose AffectedScope is a slice of strings
  - The record's ForbiddenScope is a slice of strings
  - The repo parameter is a pointer to the repo struct defined in common_run.go of package main
  - The function adds no imports
affected_scope:
  - cmd/provenance/check_run.go
