content:
  id: prov-2026-46d084ef
  title: auth.TokenView
  type: imprint
  created_at: "2026-10-21"
  author: calebcowen@gmail.com
  intent: TokenView is a personal token as the auth service describes it, carrying the secret only when just created.
  constraints:
    - TokenView is an exported struct type.
    - Field ID is a string with JSON key id.
    - Field Name is a string with JSON key name.
    - Field Scopes is a slice of strings with JSON key scopes.
    - Field CreatedAt is a string with JSON key created_at.
    - Field LastUsedAt is a string with JSON key last_used_at.
    - Field ExpiresAt is a string with JSON key expires_at.
    - Field Token is a string with JSON key token, omitted from the JSON when empty; it holds the secret.
    - The fields are declared in the order ID, Name, Scopes, CreatedAt, LastUsedAt, ExpiresAt, Token.
    - This type does not change the file's imports.
  affected_scope:
    - auth/client.go
  implements: prov-2026-ee401a6a
  implements_version: 9
  associated_specs:
