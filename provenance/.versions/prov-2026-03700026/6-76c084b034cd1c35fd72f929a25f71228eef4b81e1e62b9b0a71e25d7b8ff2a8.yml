content:
  id: prov-2026-03700026
  title: auth.Client
  type: imprint
  created_at: "2026-10-16"
  author: calebcowen@gmail.com
  intent: Client is a struct holding the settings used to talk to the Provisio auth service.
  constraints:
    - Client is an exported struct type.
    - Field Server is a string holding the base URL of the auth service.
    - Field HTTP is a pointer to http.Client from package net/http.
    - A nil HTTP field means a default client is used.
    - Field Hostname is a string naming this machine, sent when requesting a device code.
    - An empty Hostname means none is sent.
    - Field Provider is a string holding the sign-in hint sent with the device code, such as provisio or bluesky.
    - An empty Provider means none is sent.
    - The fields are declared in the order Server, HTTP, Hostname, Provider.
    - The struct has no other fields.
    - The fields have no struct tags.
    - This type does not change the file's imports.
    - http.Client comes from package net/http.
  affected_scope:
    - auth/client.go
  forbidden_scope:
    - auth/credential.go
    - auth/store.go
    - auth/keyring_system.go
    - auth/lock.go
    - auth/session.go
  implements: prov-2026-ee401a6a
  implements_version: 6
  associated_specs:
