content:
  id: prov-2026-2eb68119
  title: 'Search eval: BM25 against embeddings and a hybrid'
  type: blueprint
  created_at: "2026-10-16"
  author: calebcowen@gmail.com
  intent: 'A re-runnable eval of whether semantic search is worth building. Queries and ground truth come from git history: tagged commit subjects map to their record, file paths map to the records whose scope covers them. Arms: the real provenance search (BM25), a local ollama embedding model, and reciprocal rank fusion of the two. Metrics are recall at 1, 3 and 5 and MRR. The index and caches stay outside every repo. docs/EVAL-SEARCH.md carries the numbers, the limits and a recommendation.'
  constraints:
    - Ground truth MUST come from git history, never from the record text being searched
    - The BM25 arm MUST run the real provenance search command
    - The embedding index and cache MUST NOT be written inside a repository; the cache directory is an argument
    - The harness MUST take the embedding model as an argument and record its name and details in the results
    - The doc MUST state its limits and recommend one course
  affected_scope:
    - evals/search/**
    - docs/EVAL-SEARCH.md
  associated_specs:
    - path: evals/search/test_metrics.py
    - path: docs/EVAL-SEARCH.md
