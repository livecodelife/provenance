content:
  id: prov-2026-0b7a4f45
  title: check --format sarif
  type: imprint
  created_at: "2026-10-16"
  author: calebcowen@gmail.com
  intent: "`check --format sarif` (blueprint 339d7e99, imprint 2; approved by provisio-mgr 01M51S4P57DB). One file: cmd/provenance/check_sarif_run.go (go package, package main), with its spec cmd/provenance/check_sarif_test.go (which validates every document against the vendored OASIS SARIF 2.1.0 schema). checkSarif handles --staged, --commit, --range and --evidence together (mirroring what the text mode checks) and prints one SARIF document whose results are the violations: lint-derived violations keep their PROV id (the \"lint PROVnnn: \" prefix of the message), a file outside or forbidden by the tagged record's scope is SCOPE001, a missing commit tag or a tag naming the wrong version is TAG001, any other record-state violation (append-only snapshot rewritten, disallowed status transition) is STATE001, an implemented record changed under a commit tag without a revise (message containing \"is implemented: run 'provenance revise\") is REVISE001, stale evidence is EVID001 and a failing latest evidence run is EVID002. Messages from --commit/--range are prefixed with the 7-character commit. The command fails (non-zero exit) when there is any finding, as the text mode does. The check command's own change (the --format flag and calling checkSarif) is in the check record. \nImports, each its own addImport, exactly these: errors, fmt, io, os, path/filepath, strings, github.com/spf13/cobra.\n\nDeclarations, in this order, each exactly one set* call whose code kwarg is the code below verbatim (gofmt-formatted, comments kept). Do not alter, reorder or add anything.\n\n  - setFunction name classifyViolation, code exactly:\n      func classifyViolation(v violation) string {\n      \tm := v.Message\n      \tswitch {\n      \tcase strings.Contains(m, \"forbids changes to\"):\n      \t\treturn \"SCOPE001\"\n      \tcase strings.HasPrefix(m, \"Commit tag required\"), strings.Contains(m, \"is at version\"):\n      \t\treturn \"TAG001\"\n\tcase strings.Contains(m, \"is implemented: run 'provenance revise\"):\n      \t\treturn \"REVISE001\"\n      \tdefault:\n      \t\treturn \"STATE001\"\n      \t}\n      }\n  - setFunction name violationFinding, code exactly:\n      func violationFinding(r *repo, v violation) sarifFinding {\n      \tf := sarifFinding{RuleID: classifyViolation(v), Level: \"error\", Message: v.Message, RecordID: v.RecordID, File: v.File}\n      \tif strings.HasPrefix(v.Message, \"lint PROV\") {\n      \t\tif id, msg, ok := strings.Cut(strings.TrimPrefix(v.Message, \"lint \"), \": \"); ok {\n      \t\t\tf.RuleID = id\n      \t\t\tf.Message = msg\n      \t\t}\n      \t}\n      \tif f.File == \"\" && v.RecordID != \"\" {\n      \t\tf.File = filepath.ToSlash(r.recordPath(v.RecordID))\n      \t}\n      \treturn f\n      }\n  - setFunction name evidenceFindings, code exactly:\n      func evidenceFindings(r *repo, rows []evidenceRow) []sarifFinding {\n      \tvar out []sarifFinding\n      \tfor _, row := range rows {\n      \t\tfile := filepath.ToSlash(r.recordPath(row.ID))\n      \t\tswitch {\n      \t\tcase row.State == \"stale\":\n      \t\t\tout = append(out, sarifFinding{RuleID: \"EVID001\", Level: \"error\", Message: fmt.Sprintf(\"%s@%d evidence is stale: %s\", row.ID, row.Version, strings.Join(row.Reasons, \", \")), File: file, RecordID: row.ID})\n      \t\tcase row.State != \"missing\" && !row.Passed:\n      \t\t\tout = append(out, sarifFinding{RuleID: \"EVID002\", Level: \"error\", Message: fmt.Sprintf(\"%s@%d latest evidence is a failing run\", row.ID, row.Version), File: file, RecordID: row.ID})\n      \t\t}\n      \t}\n      \treturn out\n      }\n  - setFunction name checkSarif, code exactly:\n      func checkSarif(out io.Writer, cmd *cobra.Command, r *repo) error {\n      \tstaged, _ := cmd.Flags().GetBool(\"staged\")\n      \tcommit, _ := cmd.Flags().GetString(\"commit\")\n      \trng, _ := cmd.Flags().GetString(\"range\")\n      \tev, _ := cmd.Flags().GetBool(\"evidence\")\n      \tif !staged && commit == \"\" && rng == \"\" && !ev {\n      \t\treturn errors.New(\"pass --staged, --commit <sha>, --range <a..b> or --evidence\")\n      \t}\n      \tvar findings []sarifFinding\n      \tif ev {\n      \t\trows, err := checkEvidence(r)\n      \t\tif err != nil {\n      \t\t\treturn err\n      \t\t}\n      \t\tfindings = append(findings, evidenceFindings(r, rows)...)\n      \t}\n      \tvar shas []string\n      \tif commit != \"\" {\n      \t\tsha, err := r.git(\"rev-parse\", \"--verify\", commit+\"^{commit}\")\n      \t\tif err != nil {\n      \t\t\treturn err\n      \t\t}\n      \t\tshas = append(shas, sha)\n      \t}\n      \tif rng != \"\" {\n      \t\tlist, err := r.git(\"rev-list\", \"--reverse\", rng)\n      \t\tif err != nil {\n      \t\t\treturn err\n      \t\t}\n      \t\tshas = append(shas, strings.Fields(list)...)\n      \t}\n      \tfor _, sha := range shas {\n      \t\tvs, err := checkCommit(r, sha)\n      \t\tif err != nil {\n      \t\t\treturn err\n      \t\t}\n      \t\tfor _, v := range vs {\n      \t\t\tf := violationFinding(r, v)\n      \t\t\tf.Message = sha[:7] + \": \" + f.Message\n      \t\t\tfindings = append(findings, f)\n      \t\t}\n      \t}\n      \tif staged {\n      \t\tmsgFile, _ := cmd.Flags().GetString(\"message-file\")\n      \t\tvar message string\n      \t\tif msgFile != \"\" {\n      \t\t\tdata, err := os.ReadFile(msgFile)\n      \t\t\tif err != nil {\n      \t\t\t\treturn err\n      \t\t\t}\n      \t\t\tmessage = strings.TrimSpace(string(data))\n      \t\t} else {\n      \t\t\tvar err error\n      \t\t\tmessage, err = r.git(\"log\", \"-1\", \"--format=%B\")\n      \t\t\tif err != nil {\n      \t\t\t\treturn err\n      \t\t\t}\n      \t\t}\n      \t\tvs, err := checkStaged(r, message)\n      \t\tif err != nil {\n      \t\t\treturn err\n      \t\t}\n      \t\tfor _, v := range vs {\n      \t\t\tfindings = append(findings, violationFinding(r, v))\n      \t\t}\n      \t}\n      \tif err := printSarif(out, buildSarif(r, findings)); err != nil {\n      \t\treturn err\n      \t}\n      \tif len(findings) > 0 {\n      \t\treturn fmt.Errorf(\"%d findings\", len(findings))\n      \t}\n      \treturn nil\n      }"
  constraints:
    - 'TestCheckStagedSarif, TestCheckCommitSarif and TestCheckEvidenceSarif pass: every document validates against the vendored SARIF 2.1.0 schema, findings keep exit code non-zero, clean input gives an empty valid document.'
  affected_scope:
    - cmd/provenance/check_sarif_run.go
    - cmd/provenance/check_sarif_test.go
  implements: prov-2026-339d7e99
  implements_version: 1
  associated_specs:
    - path: cmd/provenance/check_sarif_test.go
