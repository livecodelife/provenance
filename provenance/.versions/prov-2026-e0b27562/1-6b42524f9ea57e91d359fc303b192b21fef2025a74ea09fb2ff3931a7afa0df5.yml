  title: auth.DeviceCode
  type: imprint
  created_at: "2026-10-21"
  author: calebcowen@gmail.com
  intent: DeviceCode is the decoded response of the device-code endpoint of the auth service.
  constraints:
    - DeviceCode is an exported struct type.
    - Field DeviceCode is a string with JSON key device_code.
    - Field UserCode is a string with JSON key user_code.
    - Field VerificationURI is a string with JSON key verification_uri.
    - Field VerificationURIComplete is a string with JSON key verification_uri_complete.
    - Field ExpiresIn is an int with JSON key expires_in, in seconds.
    - Field Interval is an int with JSON key interval, in seconds.
    - The fields are declared in the order DeviceCode, UserCode, VerificationURI, VerificationURIComplete, ExpiresIn, Interval.
    - This type does not change the file's imports.
