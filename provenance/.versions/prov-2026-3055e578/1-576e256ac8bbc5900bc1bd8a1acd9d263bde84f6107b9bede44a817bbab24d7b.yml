content:
  id: prov-2026-3055e578
  title: auth.FileStore.Load
  type: imprint
  created_at: "2026-10-22"
  author: calebcowen@gmail.com
  intent: Load reads the credential from the file, refusing a file that other users can read.
  constraints:
    - Load is an exported method with a value receiver of type FileStore, taking no arguments and returning a pointer to Credential, a Source and an error.
    - It first inspects the file at the receiver Path with os.Stat.
    - If os.Stat fails with an error for which errors.Is(err, os.ErrNotExist) holds, it returns nil, an empty Source and the ErrNoSession error value itself, not wrapped.
    - If os.Stat fails with any other error, it returns nil, an empty Source and that error unchanged.
    - If the file permission bits include any group or other bit (any bit of the mask 077 in octal), it returns nil, an empty Source and a new error.
    - 'The message of that error is the path, then " is readable by other users (mode ", then the permission bits as a four-digit zero-padded octal number, then "); run: chmod 600 ", then the path.'
    - Only after the permission check passes does it read the whole file with os.ReadFile.
    - If os.ReadFile fails it returns nil, an empty Source and that error unchanged.
    - It decodes the file contents as JSON into a Credential with json.Unmarshal.
    - If decoding fails it returns nil, an empty Source and a new error whose message is the path, then " is not a valid credential file; run provenance login again".
    - That decoding error does not wrap or include the decoder error, so file contents never appear in it.
    - On success it returns a pointer to the decoded Credential, the SourceFile constant and a nil error.
    - ErrNoSession, Credential, Source and SourceFile are defined elsewhere in package auth.
    - os.Stat, os.ReadFile and os.ErrNotExist come from package os.
    - errors.Is comes from package errors.
    - fmt.Errorf comes from package fmt.
    - json.Unmarshal comes from package encoding/json.
    - This unit does not change the file's imports.
  affected_scope:
    - auth/store.go
  forbidden_scope:
    - auth/client.go
    - auth/lock.go
    - auth/session.go
  implements: prov-2026-ee401a6a
  implements_version: 9
  associated_specs:
    - path: auth/store_test.go
