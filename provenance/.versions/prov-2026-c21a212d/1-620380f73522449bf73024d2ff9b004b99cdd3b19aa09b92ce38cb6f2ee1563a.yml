content:
  id: prov-2026-c21a212d
  title: auth.Client.httpClient
  type: imprint
  created_at: "2026-10-21"
  author: calebcowen@gmail.com
  intent: httpClient returns the HTTP client the Client should use for requests.
  constraints:
    - httpClient is an unexported method with a pointer receiver of type Client, takes no parameters and returns a pointer to http.Client.
    - When the HTTP field is non-nil it returns that client unchanged.
    - When the HTTP field is nil it returns a new client whose Timeout is 30 seconds.
    - It does not store the new client back into the Client.
    - This method does not change the file's imports.
    - http.Client comes from package net/http.
    - time.Second comes from package time.
  affected_scope:
    - auth/client.go
  implements: prov-2026-ee401a6a
