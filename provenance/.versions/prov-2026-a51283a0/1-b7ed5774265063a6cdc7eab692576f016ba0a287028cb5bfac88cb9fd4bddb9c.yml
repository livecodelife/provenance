  id: prov-2026-a51283a0
  title: serverURL
  type: imprint
  created_at: "2026-10-22"
  author: calebcowen@gmail.com
  intent: serverURL gives the auth service address for a new sign-in.
  constraints:
    - serverURL is an unexported function with no parameters, and it returns a string.
    - When the environment variable named by auth.EnvServer is set and not empty, serverURL returns its value.
    - Otherwise serverURL returns auth.DefaultServer.
    - auth.EnvServer and auth.DefaultServer are string constants from the package github.com/livecodelife/provenance/auth.
    - os.Getenv comes from the standard-library package os.
    - This unit does not change the file's imports.
