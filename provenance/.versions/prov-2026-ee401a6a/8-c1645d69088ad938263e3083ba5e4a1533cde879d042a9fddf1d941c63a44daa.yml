content:
  id: prov-2026-ee401a6a
  title: Sign in, sign out, whoami, token management and session rules
  type: blueprint
  created_at: "2026-10-16"
  author: calebcowen@gmail.com
  intent: A user should be able to sign in to Provisio from the command line, sign out, see who is signed in, manage personal tokens, and have later network commands use the stored sign-in with automatic refresh, while local commands never touch credentials or the network.
  constraints:
    - The auth package has the import path github.com/livecodelife/provenance/auth, uses only the standard library plus the keyring dependency, and does not import cobra.
    - A Credential holds a server URL, an access token, its expiry, a refresh token, its expiry, a DID, a handle and an optional personal token.
    - A credential store offers load (returning the credential and its source), save and delete.
    - The source of a loaded credential is one of env, keychain or file.
    - The file store keeps the credential at ~/.provisio/credentials inside a directory with mode 0700 and the file with mode 0600.
    - The file store writes atomically through a temporary file that is renamed into place.
    - The file store refuses to read a credential file whose mode is looser than 0600 and the error says how to fix the mode.
    - The keychain store uses the operating system keychain through a small keyring interface.
    - The keychain store falls back to the file store when no keychain is available.
    - Setting PROVISIO_NO_KEYCHAIN to a non-empty value keeps credentials out of the operating system keychain.
    - The auth client talks to the auth service over HTTP at a base server URL.
    - The default server is https://auth.provisio.dev, overridden by PROVISIO_AUTH_URL or by the login --server flag.
    - The server a credential was created on is stored in the credential, and commands using a stored sign-in use that server unless PROVISIO_AUTH_URL or PROVISIO_TOKEN is set.
    - A server URL must use https, except that http is accepted for localhost, 127.0.0.1 and ::1.
    - The auth client requests a device code with POST /device/code, sending the client id, an optional hostname of at most 80 characters and an optional provider.
    - A device code answer with a missing device code or user code is an error, and a missing or non-positive interval defaults to 5 seconds.
    - Polling POST /device/token waits the server interval before each request.
    - Polling adds 5 seconds to the interval on a slow_down answer.
    - Polling continues on an authorization_pending answer.
    - Polling stops with a sign-in denied error on access_denied.
    - Polling stops with a code expired error on expired_token.
    - Polling stops when the context is cancelled.
    - The auth client refreshes with POST /auth/refresh, and an invalid_grant or 401 answer means the session has expired.
    - The auth client logs out with POST /auth/logout, sending the refresh token.
    - The auth client reads the signed-in identity with GET /session using a bearer token, and a 401 answer means the bearer was rejected.
    - Service errors on /device/* and /auth/* are OAuth-style, carrying a code, an optional description, the HTTP status and an optional Retry-After.
    - Every error that mentions a request names only the method, the path and the status.
    - No token, device code or refresh token ever appears in an error, a log or any output.
    - When PROVISIO_TOKEN is set it is used as is as the bearer, with source env, and is never refreshed.
    - When PROVISIO_TOKEN is set no credential file is read or written.
    - A 401 on a request made with PROVISIO_TOKEN is reported as a rejected personal token that names PROVISIO_TOKEN.
    - Without PROVISIO_TOKEN the stored access token is refreshed when it expires in under 60 seconds.
    - On a 401 the stored session is refreshed once and the request retried once.
    - Refreshing takes an exclusive lock on ~/.provisio/credentials.lock so that concurrent commands do not spend the rotating refresh token twice.
    - After taking the lock the process re-reads the store and skips the refresh if another process already refreshed.
    - A refresh answered with invalid_grant returns a session expired error and deletes nothing.
    - With no stored credential and no PROVISIO_TOKEN the result is a no-session error.
    - Exit status 3 is used when a session is needed or has expired.
    - With no session a command exits with status 3 and the message "This command needs a Provisio session. Run provenance login (or set PROVISIO_TOKEN in CI)."
    - With an expired session a command exits with status 3 and the message "Your Provisio session has expired. Run provenance login."
    - With a rejected personal token a command exits with status 3 and the message "The personal token was rejected (revoked or expired). Replace PROVISIO_TOKEN, or run provenance login."
    - Any other failure exits with status 1.
    - A 403 insufficient_scope answer exits with status 3 and says to sign in again with `provenance login`; every other answer is unchanged.
    - No command prompts for input in a non-interactive shell.
    - provenance login prints the verification URI and the user code, tries to open the complete verification URI unless --no-browser is given or no opener exists, polls for approval, stores the credential and prints that the user signed in as @handle with the DID.
    - provenance login --with-token reads one personal token starting with pvt_ from standard input, validates it with GET /session and stores it as a personal token credential.
    - provenance login takes --provider provisio or bluesky, defaulting to provisio, as a hint sent as the provider field of the POST /device/code body.
    - An unsupported --provider value is rejected before any request with the message "--provider must be provisio or bluesky".
    - The provider hint is not stored in the credential and whoami does not show it.
    - The --provider flag is ignored when --with-token is given.
    - provenance logout revokes the session at the server with POST /auth/logout.
    - provenance logout deletes the local credential even when the server call fails, and then says so.
    - provenance logout prints "Not signed in." and succeeds when no credential is stored.
    - provenance whoami prints the handle, the DID, the source (env, keychain or file) and the expiry, using GET /session.
    - provenance whoami exits with status 1 when signed out.
    - provenance whoami --json prints handle, did, source and expires_at, and omits every token value.
    - provenance token create, list and revoke manage the account's personal tokens through the auth service's /tokens endpoints.
    - Token commands work only with the signed-in device session; a personal token (PROVISIO_TOKEN) cannot manage tokens, and the resulting 403 is shown as exit status 3 with a message to run provenance login, never echoing the token.
    - provenance token create takes --name, defaulting to ci- followed by the name of the origin remote's repository, else the repository directory name.
    - Outside a repository provenance token create requires --name.
    - provenance token create takes a repeatable --scope that is records:read or records:write, defaulting to records:write only.
    - provenance token create takes --expires-in-days from 1 to 365, defaulting to 90.
    - provenance token create takes --json and --secret-only.
    - provenance token create validates every flag before sending any request.
    - provenance token create prints the secret once, on standard output only, with a note that it will not be shown again.
    - provenance token create --secret-only prints just the secret and a newline.
    - The token secret is never written to standard error, a log, an error or the credential store.
    - provenance token list shows id, name, scopes, created, last used and expiry, and takes --json.
    - provenance token revoke takes one token id and says if no such token exists.
    - List and revoke never show any secret.
    - Local commands never read the credential store and never touch the network, and give the same results with an empty HOME, no network and no credential.
  affected_scope:
    - auth/**
    - cmd/provenance/login_*
    - cmd/provenance/logout_*
    - cmd/provenance/whoami_*
    - cmd/provenance/session_*
    - cmd/provenance/main.go
    - go.mod
    - go.sum
    - cmd/provenance/auth_*
    - cmd/provenance/token_*
  associated_specs:
    - path: cmd/provenance/auth_secret_test.go
    - path: cmd/provenance/auth_offline_test.go
    - path: cmd/provenance/session_scope_test.go
