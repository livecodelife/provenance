  intent: |
    COMMON.md "Generate first" arrived after the library was written by hand.
    provisio-mgr (59088) grandfathered the existing code, since it is proven by
    parity and the oracle and converting it now is risk without payoff. It is
    to be listed in docs/GENERATOR_BACKLOG.md, giving per package its rough
    shape and which sedum actions could own it later, so it can become
    generator work. New library code goes through the `go` package.
  constraints:
