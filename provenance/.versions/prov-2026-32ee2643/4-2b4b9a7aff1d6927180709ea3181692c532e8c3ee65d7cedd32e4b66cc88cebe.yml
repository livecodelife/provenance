content:
  id: prov-2026-32ee2643
  title: 'Canonical encoder: boolean support'
  type: blueprint
  created_at: "2026-10-15"
  author: calebcowen@gmail.com
  intent: record.Canonical (docs/HASHING.md section 5) accepts boolean values and writes them as the JSON literals true and false, so a tool that hashes a structured object can use the library's encoder instead of its own. Strings, null, lists and maps encode as before; every existing gen_hash, content_hash and code_hash is unchanged. The record hash projections still contain no booleans. The TS encoder and the corpus gain the same support.
  constraints:
    - 'Existing inputs hash identically: every case in corpus v3 passes unchanged in Go and TS.'
    - A boolean is written as the bare literal true or false; no other number or type is added (ints, floats, dates stay rejected, panicking in Go).
    - 'docs/HASHING.md states the rule in section 5 and keeps section 1 true: record projections contain no booleans.'
    - The corpus gains canonical cases (bool in a map, in a list, key ordering around bools) written before the code; corpus_version becomes 4 and is additive. Python reference, Go and TS all pass.
  affected_scope:
    - record/hash.go
    - record/canonical_test.go
    - docs/HASHING.md
    - conformance/hashing/cases.json
    - conformance/hashing/tools/case_defs.py
    - conformance/hashing/tools/reference.py
    - ts/src/hashing.ts
    - ts/test/canonical.test.ts
    - record/conformance_test.go
    - ts/test/conformance.test.ts
    - generators/go/**
    - record/canonical_bool.go
    - generators/go.mod
  associated_specs:
    - path: record/canonical_test.go
    - path: ts/test/canonical.test.ts
  tags:
    - hashing
