content:
  id: prov-2026-8276db5d
  title: remote.PublishPlan.Empty
  type: imprint
  created_at: "2026-10-22"
  author: calebcowen@gmail.com
  intent: The Empty method reports whether a publish plan writes nothing.
  constraints:
    - Empty is an exported method with a pointer receiver of type PublishPlan.
    - Empty takes no parameters and returns a bool.
    - Empty returns true when the receiver's Items field has no entry, and false otherwise.
    - The fields UpToDate, Problems and Skipped do not change the result.
    - PublishPlan is a struct type defined elsewhere in package remote with the field Items, a slice of PublishItem.
    - This unit adds no imports to the file.
  affected_scope:
