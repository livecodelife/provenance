content:
  id: prov-2026-b071f42a
  title: token list command wiring
  type: imprint
  created_at: "2026-10-22"
  author: calebcowen@gmail.com
  intent: The token list command is a cobra command that lists the account's personal tokens, never their secrets, by calling runTokenList.
  constraints:
    - The function newTokenListCmd takes no arguments.
    - The function newTokenListCmd returns a pointer to a cobra command.
    - The command use text is "list".
    - The command short text is "List personal tokens (never their secrets)".
    - The command accepts no positional arguments.
    - The command defines no subcommands.
    - The command has a flag named json.
    - The flag json is a boolean flag.
    - The default of the flag json is false.
    - The usage text of the flag json is "Print as JSON".
    - The flag json has no short form.
    - The flag json is local to the command.
    - newTokenListCmd is added as a subcommand by newTokenCmd, not registered in main.go.
    - The file imports github.com/spf13/cobra as a value.
    - The file adds no other imports.
    - runTokenList is defined elsewhere in package main.
    - 'runTokenList takes parameters in order: an io.Writer, a pointer to a cobra command, and a slice of strings.'
    - runTokenList returns an error.
    - The command's run function is the command's RunE field.
    - The command's run function returns the result of calling runTokenList with the writer returned by the command's OutOrStdout method, the command and the arguments.
  affected_scope:
    - cmd/provenance/token_list_cmd.go
    - cmd/provenance/token_cmd.go
  implements: prov-2026-ee401a6a
  implements_version: 9
  associated_specs:
    - path: cmd/provenance/token_test.go
