content:
  id: prov-2026-70c7ab3b
  title: 'provenance CLI, part 3: stale, repin, check, reconcile, sync, shared repos'
  type: blueprint
  created_at: "2026-10-15"
  author: calebcowen@gmail.com
  intent: |-
    Part 3 of the provenance CLI: staleness, evidence, write locks and shared
    repos, on the library packages prov-lib landed (stale, evidence, scope,
    lint). Same method as parts 1 and 2: one imprint per command, cobra wiring
    and go logic, a hand-written gate per command, and no
    new hand-written *_run.go (the two bridge files are converted first).

    Commands
    - stale [--json] [--exit-code]: stale.Find over the store. Lists each child
      whose implements_version is behind its parent, direct or transitive, and
      unknown pins (cross-repo or dangling), as <id>@<version> pinned to
      <parent>@<current>. --exit-code fails when anything is direct or
      transitive.
    - repin <id> --reason "..." [--to N]: stale.Repin with stale.FilePinLog. It
      moves only implements_version (no snapshot, no version bump, no manifest
      change), appends the reason to .versions/<id>/pins.jsonl, and prints the
      tag to commit with. history lists a record's pins after its versions.
    - check (without --staged): repo health. --commit <sha> and --range a..b
      port linespec's commit and range scope checks onto ParseCommitTags /
      ResolveTag. --evidence reports, per implemented record, evidence.Check
      against the record's present content_hash, spec hashes and code_hash
      (fresh, stale with reasons, unknown, missing), with Current.Behind set from
      stale.Find; it fails on stale or failing evidence and not on unknown.
      The code hash is not known to provenance: it stays unknown and does not fail the check.
    - complete records evidence: after its specs pass it appends
      evidence.New(...) to the evidence store (.evidence/<id>/), with runner
      "provenance complete".
    - reconcile [--dry-run]: file-write restriction, ported unchanged from
      linespec's reconcile (default-deny; provisio-mgr 01M51E7FP6BE). Every
      git-tracked file is read-only unless an open allowlist record's
      affected_scope covers it or it is always writable: exclude_paths, the
      provenance dir, .provenance.yml (and .linespec.yml), .provenance/, and
      every record's associated_spec paths. No records yet: skipped (cold
      start). write_restriction: false unlocks everything. A glob or regex scope
      unlocks its literal base directory, and an exact not-yet-existing path its
      parent, so the file can be created. State inside the provenance dir: the
      snapshot files <dir>/.versions/<id>/*.yml stay 0444 always (reconcile
      never makes them writable; only the store creates them); pins.jsonl,
      <dir>/.evidence/ and .provenance/versions.jsonl are writable tool state.
      open, complete, deprecate, revise and edit run it after a status or scope
      change, best effort (no git or a failure is not an error).
    - sync: linespec's sync, unchanged. It clones or pulls each shared repo into
      ~/.linespec/cache/<sha256(url)>/provenance.
    - hooks install also writes a pre-push hook that, for every commit in the
      pushed range, checks it out into a temp directory with git archive and runs
      the config key pre_push_command (default: none, so the hook is a no-op).
      This repository sets it to `go build ./...`, so a half-landed commit cannot
      be pushed (prov-lib's finding on 486ff85).

    Shared repos (lint, check, status)
    - They load each configured shared repo's records from the cache path above
      (walked recursively for prov-*.yml/.yaml, decoded with record.Decode) and
      pass them as lint.Options.Shared, plus the repo names as SharedRepos.
      Without this, lint reports false "implements references unknown record"
      errors for parents in shared repos. Remote records are read-only. lint
      prints id-less issues, and the cache TTL warning when a cache is stale.

    Fixes carried from earlier findings
    - revise and edit judge change by the content_hash against the latest
      snapshot, never by comparing file bytes. That fixes revise saying
      "unchanged" for a hand-edited draft or record that lint reports as
      drifted, and makes a change to a spec file's content alone a content
      change that needs a reason.
    - edit --refresh-specs: record that the associated specs' content changed on
      disk, as a new version (with --reason).
    - open refuses a draft whose associated spec is a file the open itself
      rewrites (.provenance/versions.jsonl, the record's own files or
      snapshots), naming the file and saying to pick another proof: such a spec
      can never be hashed consistently.
    - Every pushed commit builds, via the pre-push hook above.
  constraints:
    - 'Order: (1) convert migrate_run.go and common_run.go into go-package regions with provenance revise on their imprints, (2) the fixes, (3) stale, repin, check and evidence, (4) reconcile, (5) sync and shared repos, (6) the pre-push hook. Each step is one or more imprints.'
    - Tests that run git follow the isolation in cmd/provenance/common_test.go; reconcile tests only chmod files under t.TempDir().
    - 'No edits to record, migrate, lint, scope, stale or evidence (prov-lib owns them); a library gap is raised in #provisio.'
    - 'Done when these hold; the Go tests prove them and cmd/provenance/testdata/e2e.sh does not cover any of them (it covers migrate, hooks, tag checks, revise, complete and lint): a parent bump lists its children in stale and --exit-code fails (TestStaleListsAndExitCode); repin clears a pin without a version (TestRepinClearsWithoutVersion, TestRepinSharedChild); check --evidence reports stale evidence after a code or spec change (TestCheckEvidence, TestEvidenceRefreshAfterCodeMoved); reconcile locks and unlocks by record status (TestReconcileDefaultDeny, TestReconcileDryRunAndOptOut, TestReconcileColdStartAndGlobDirs); lint on a repo with shared_repos resolves the cached parents and says why before sync (TestSyncAndSharedLint, TestStaleJudgesSharedParent). Byte-for-byte parity with linespec on the cached parents is not tested.'
    - 'check --commit and --range apply the same rule as check --staged for a configuration file below the git top level: paths are matched against scope and exemptions relative to the configuration''s directory.'
    - check --commit and --range do not govern files outside the configuration's directory, the same as check --staged.
    - A .linespec.yml counts as a config only when it has a top-level provenance key.
    - 'The nested-config warning applies when a command runs without -c/--config, no config file exists at the git top level, and git tracks at least one config file in a subdirectory: a .provenance.yml, or a .linespec.yml with a top-level provenance key.'
    - The warning is one line printed to standard error.
    - The warning names the first five tracked nested configs, sorted, as paths relative to the git top level, followed by three dots when there are more than five.
    - The warning says to pass -c with the path of the config to use.
    - The warning does not change the root, the default settings, standard output or the exit status of the command.
    - No nested-config warning is printed when -c/--config is given.
    - No nested-config warning is printed when a config file is found at the git top level.
    - No nested-config warning is printed when the directory is not a git repository.
    - No nested-config warning is printed when git tracks no config file in a subdirectory.
    - Tests are hand-written and are the gate
  affected_scope:
    - cmd/provenance/**
  forbidden_scope:
    - record/**
    - migrate/**
    - lint/**
    - scope/**
    - stale/**
    - evidence/**
  related:
