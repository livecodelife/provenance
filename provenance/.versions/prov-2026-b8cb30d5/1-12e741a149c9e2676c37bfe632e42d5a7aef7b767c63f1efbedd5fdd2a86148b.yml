content:
  id: prov-2026-b8cb30d5
  title: repoURL
  type: imprint
  created_at: "2026-10-22"
  author: calebcowen@gmail.com
  intent: repoURL turns a git remote URL into the https URL of its repository, or the empty string when the remote is not a host, owner and name remote.
  constraints:
    - repoURL is an unexported function with one parameter, remote (a string), and it returns a string.
    - 'Step 1: remove white space from both ends of remote with strings.TrimSpace.'
    - 'Step 2: when the text contains ://, parse it with url.Parse; if that fails, repoURL returns the empty string.'
    - The host is then the Hostname of the parsed URL, which has no port and no credentials, and the path is the Path of the parsed URL.
    - 'Step 3: otherwise, split the text at its first colon with strings.Cut; when there is a colon and the part before it contains an at sign, the host is the part before the colon after its last at sign, and the path is the part after the colon.'
    - When the text has neither ://, nor a colon preceded by a part with an at sign, the host and the path stay empty, as for a local path.
    - 'Step 4: remove leading and trailing slashes from the path with strings.Trim, then remove a trailing .git with strings.TrimSuffix.'
    - 'Step 5: when the host is empty or the path is empty, repoURL returns the empty string.'
    - 'Step 6: otherwise repoURL returns https://, the host, a slash and the path.'
    - For example, git@github.com:acme/widgets.git gives https://github.com/acme/widgets.
    - For example, https://token@github.com/acme/widgets gives https://github.com/acme/widgets.
    - For example, ssh://git@host.example:2222/acme/widgets.git/ gives https://host.example/acme/widgets.
    - For example, /home/me/repos/widgets, ../widgets, the empty string and https://github.com give the empty string.
    - strings.TrimSpace, strings.Cut, strings.Contains, strings.LastIndex, strings.Trim and strings.TrimSuffix come from the standard-library package strings.
    - url.Parse comes from the standard-library package net/url.
    - This unit imports, each as a value, the packages net/url and strings.
    - This unit adds no other imports to the file.
  affected_scope:
    - cmd/provenance/publish_run.go
