content:
  id: prov-2026-f97fd932
  title: remote.ValidServerID
  type: imprint
  created_at: "2026-10-22"
  author: calebcowen@gmail.com
  intent: ValidServerID reports whether the record service accepts a record id.
  constraints:
    - ValidServerID is an exported function with one parameter, id (a string), and it returns a bool.
    - ValidServerID returns true when the id matches the server id pattern, and false otherwise.
    - The match is made with the MatchString method of serverID, a pointer to regexp.Regexp defined elsewhere in package remote, which takes a string and returns a bool.
    - The empty string is not valid.
    - This unit adds no imports to the file.
  affected_scope:
