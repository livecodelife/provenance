content:
  id: prov-2026-47a53069
  title: auth.KeyringStore
  type: imprint
  created_at: "2026-10-22"
  author: calebcowen@gmail.com
  intent: KeyringStore keeps the credential in the keychain and falls back to another store.
  constraints:
    - KeyringStore is an exported struct type with two exported fields, declared in the order Keyring, Fallback.
    - Field Keyring has the type Keyring.
    - Field Fallback has the type Store.
    - KeyringStore is used as a plain value, not through a pointer; its methods are defined on the value type.
    - It prefers the keychain and uses Fallback whenever the keychain is missing or fails, as a headless machine has no keychain.
    - Keyring and Store are interface types defined elsewhere in package auth.
    - This unit does not change the file's imports.
  affected_scope:
    - auth/store.go
  forbidden_scope:
    - auth/client.go
    - auth/lock.go
    - auth/session.go
  implements: prov-2026-ee401a6a
  implements_version: 9
  associated_specs:
    - path: auth/store_test.go
