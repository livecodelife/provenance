content:
  id: prov-2026-4ccf3cb6
  title: tokenScopes
  type: imprint
  created_at: "2026-10-22"
  author: calebcowen@gmail.com
  intent: tokenScopes is the set of scopes the service accepts when a personal token is created.
  constraints:
    - tokenScopes is an unexported package-level variable in package main.
    - tokenScopes is a map from string to bool.
    - tokenScopes has exactly two entries.
    - One entry of tokenScopes is records:read, with the value true.
    - One entry of tokenScopes is records:write, with the value true.
    - Any other scope string is absent from tokenScopes, so looking it up gives false.
    - This unit adds no imports to the file.
  affected_scope:
    - cmd/provenance/token_run.go
