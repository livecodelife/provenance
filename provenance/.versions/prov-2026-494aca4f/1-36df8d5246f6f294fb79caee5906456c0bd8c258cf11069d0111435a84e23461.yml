  intent: refreshMargin is how long before expiry an access token stops being used and is refreshed instead.
  constraints:
    - refreshMargin is an unexported constant declared on its own, not inside a group.
    - refreshMargin is a time.Duration of one minute, written as time.Minute.
    - time.Minute comes from the standard-library package time.
    - This unit declares only this constant.
    - This unit does not change the file's imports.
