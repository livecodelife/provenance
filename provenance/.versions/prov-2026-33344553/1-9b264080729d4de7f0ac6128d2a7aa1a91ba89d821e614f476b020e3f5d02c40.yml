  title: 'go: record/canonical_bool.go, the boolean writer for Canonical'
  type: imprint
  created_at: "2026-10-15"
  author: calebcowen@gmail.com
  intent: |-
    The Go logic of record/canonical_bool.go (go package, package record): how the canonical encoder writes a boolean (docs/HASHING.md section 5). Imports, each its own addImport, exactly: bytes.

    Declarations, each exactly one set* call whose code kwarg is the code below verbatim (gofmt-formatted, comments kept). Do not alter, reorder or add anything.

      - setFunction name writeBool, code exactly:
          // writeBool writes a boolean as the bare JSON literal true or false
          // (docs/HASHING.md section 5). It is the one value type writeCanonical
          // accepts beyond strings, null, lists and maps.
          func writeBool(b *bytes.Buffer, v bool) {
          	if v {
          		b.WriteString("true")
          		return
          	}
          	b.WriteString("false")
          }
