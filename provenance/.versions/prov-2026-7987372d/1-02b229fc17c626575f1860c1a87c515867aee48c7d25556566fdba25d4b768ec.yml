content:
  id: prov-2026-7987372d
  title: remote.Client.once
  type: imprint
  created_at: "2026-10-22"
  author: calebcowen@gmail.com
  intent: The once method sends one request to the record server with a bearer token and turns the answer into a decoded result or a typed error.
  constraints:
    - once is an unexported method with a pointer receiver of type Client.
    - 'once has six parameters in order: ctx (a context.Context), method, path and bearer (strings), in and out (any), and it returns an error.'
    - 'Step 1: when in is not nil, encode it with json.Marshal.'
    - If json.Marshal fails, once returns that error unchanged.
    - The request body is then a reader over the encoded bytes made with bytes.NewReader; when in is nil there is no body.
    - 'Step 2: the request URL is the receiver''s Base field with its trailing slashes removed by strings.TrimRight, followed by the path.'
    - Build the request with http.NewRequestWithContext using ctx, the method, that URL and the body.
    - If building the request fails, once returns a new error made with fmt.Errorf whose text is the method, a space, the path, a colon, a space and the words bad request, without the URL and without the failure.
    - 'Step 3: set the header Accept to application/json.'
    - Set the header Authorization to the word Bearer, a space and the bearer.
    - When in is not nil, set the header Content-Type to application/json.
    - 'Step 4: send the request with the Do method of the client returned by the receiver''s httpClient method, which takes no parameters and returns a pointer to http.Client.'
    - If sending fails and ctx.Err() is not nil, once returns ctx.Err().
    - If sending fails otherwise, and the failure matches a pointer to url.Error according to errors.As, the failure is replaced by that url.Error's inner Err field.
    - If sending fails otherwise, once returns an error made with fmt.Errorf whose text is the method, a space, the path, a colon, a space and the text of the failure, wrapping the failure.
    - 'Step 5: close the response body when once returns.'
    - Read at most 8388608 bytes of the response body with io.LimitReader and io.ReadAll, ignoring any read error.
    - 'Step 6: when the HTTP status divided by 100 equals 2, once returns nil if out is nil.'
    - When out is not nil, the body is decoded into out with json.Unmarshal.
    - If json.Unmarshal fails, once returns a new error made with fmt.Errorf whose text is the method, a space, the path, a colon, a space and the words unreadable response.
    - When decoding succeeds, once returns nil.
    - 'Step 7: when the HTTP status is 401, once returns the variable auth.ErrUnauthorized itself and ignores the body.'
    - 'Step 8: for any other status, decode the body as a JSON object with the member error, an object holding the strings code, message and requestId and the member details, an object holding the member head, a Head; a decoding failure is ignored and leaves those values empty.'
    - 'Step 9: build an APIError whose Status is the HTTP status, whose Code and Message are the decoded code and message, and whose RequestID is the result of requestID called with the value of the response header X-Request-Id.'
    - When that RequestID is empty, it is the result of requestID called with the decoded requestId.
    - When the Code is empty, it becomes the text http_ followed by the HTTP status in decimal.
    - 'Step 10: when the HTTP status is 409, once returns a pointer to a ConflictError holding that APIError and, as Head, the decoded head, which is nil when the answer had none.'
    - For every other status, once returns a pointer to the APIError.
    - requestID is a function defined elsewhere in package remote with one parameter, a string, returning a string.
    - APIError, ConflictError and Head are struct types defined elsewhere in package remote; ConflictError has the embedded APIError and the field Head, a pointer to Head.
    - Neither the bearer nor the request body appears in any error once returns.
    - http.NewRequestWithContext and http.StatusUnauthorized come from the standard-library package net/http, already imported by another unit.
    - errors.As comes from the standard-library package errors, and fmt.Errorf from fmt, both already imported by other units.
    - auth.ErrUnauthorized comes from the package github.com/livecodelife/provenance/auth, already imported by another unit.
    - bytes.NewReader comes from the standard-library package bytes.
    - json.Marshal and json.Unmarshal come from the standard-library package encoding/json.
    - io.Reader, io.LimitReader and io.ReadAll come from the standard-library package io.
    - url.Error comes from the standard-library package net/url.
    - strings.TrimRight comes from the standard-library package strings.
    - This unit imports, each as a value, the packages bytes, encoding/json, io, net/url and strings.
    - This unit adds no other imports to the file.
  affected_scope:
    - remote/client.go
  implements: prov-2026-fe19dbf4
