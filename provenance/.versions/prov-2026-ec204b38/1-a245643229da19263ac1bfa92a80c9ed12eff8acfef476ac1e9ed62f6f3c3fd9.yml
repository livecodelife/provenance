content:
  id: prov-2026-ec204b38
  title: remote.PutHeadRequest
  type: imprint
  created_at: "2026-10-22"
  author: calebcowen@gmail.com
  intent: PutHeadRequest is the JSON body of the request that updates a record's head on the server without writing a version.
  constraints:
    - PutHeadRequest is an exported struct type with five exported fields, declared in the order given below.
    - Field ExpectedHeadCid is a string with the JSON name expectedHeadCid, always written.
    - Field Version is an int with the JSON name version, always written.
    - Field Status is a string with the JSON name status, left out when empty.
    - Field Source is a pointer to record.PublishedSource with the JSON name source, left out when nil.
    - Field Project is a string with the JSON name project, left out when empty.
    - This unit declares only the type and defines no methods.
    - record.PublishedSource comes from the package github.com/livecodelife/provenance/record, used without importing the package by name in this unit.
    - This unit adds no imports to the file.
  affected_scope:
    - remote/client.go
