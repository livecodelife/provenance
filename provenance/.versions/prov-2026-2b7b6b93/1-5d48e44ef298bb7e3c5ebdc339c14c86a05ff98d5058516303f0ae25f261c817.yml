content:
  id: prov-2026-2b7b6b93
  title: Change type
  type: imprint
  created_at: "2026-10-26"
  author: calebcowen@gmail.com
  intent: The Change type describes one record whose intent or constraints the edited document changed.
  constraints:
    - The type is exported from package document and needs no imports.
    - Change has the fields ID and Title, both strings, holding the record id and the record's title.
    - Change has the fields AnchoredVersion and CurrentVersion, both ints.
    - Change has the fields IntentChanged and ConstraintsChanged, both bools.
    - Change has the field Intent, a string, holding the section's new intent text.
    - Change has the field Constraints, a slice of strings, holding the section's new constraints.
