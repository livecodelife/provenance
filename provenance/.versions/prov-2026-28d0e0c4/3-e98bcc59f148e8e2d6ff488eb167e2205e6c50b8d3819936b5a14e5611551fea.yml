content:
  id: prov-2026-28d0e0c4
  title: stagedTree
  type: imprint
  created_at: "2026-10-21"
  author: calebcowen@gmail.com
  intent: the stagedTree function writes the staged files under the config's directory to a temporary directory and returns the path of the config's directory inside it, so it can be read as a tree.
  constraints:
    - The function receives a pointer to a repo (defined in common_run.go of package main) as its only argument
    - 'The function returns three values in order: the path of the config''s directory inside the temporary directory as a string, a cleanup function taking no arguments and returning nothing, and an error'
    - The function creates a temporary directory in the system temporary location
    - The temporary directory name starts with "provenance-staged-"
    - When the temporary directory cannot be created, the function returns an empty path, a nil cleanup function and the error
    - 'The function runs the repo''s git method (parameters: a variadic list of string arguments; returns the trimmed standard output as a string and an error)'
    - 'The git arguments of the checkout, in order, are: checkout-index, the all-files flag -a, and the prefix option --prefix= followed by the temporary directory path and a slash'
    - The checkout runs in the repo root, so git checks out only the index files under the repo root.
    - Git writes each checked-out file under the temporary directory at its path relative to the git top level.
    - When the checkout fails, the function removes the temporary directory
    - When the checkout fails, the function returns an empty path, a nil cleanup function and the error
    - After a successful checkout the function runs the repo's git method with rev-parse and --show-prefix
    - That command returns the repo root relative to the git top level with a trailing slash, or an empty string at the git top level
    - When that command fails, the function removes the temporary directory and returns an empty path, a nil cleanup function and the error
    - The prefix has its slashes replaced by the operating system's path separator with strings.ReplaceAll and os.PathSeparator, as deletedFromPreviousScope does
    - The returned path is the temporary directory joined with the converted prefix
    - With an empty prefix the returned path is the temporary directory itself
    - The function creates the returned path, with its parent directories, with os.MkdirAll and permission 0o755, because git writes nothing when the repo root has no staged files
    - When creating the returned path fails, the function removes the temporary directory and returns an empty path, a nil cleanup function and the error
    - On success the function returns the path, the cleanup function and a nil error
    - The cleanup function removes the whole temporary directory and everything under it, not only the returned path
    - The function adds no imports; it uses os and strings from the imports of the file
  affected_scope:
    - cmd/provenance/check_run.go
