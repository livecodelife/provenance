content:
  id: prov-2026-28d0e0c4
  title: stagedTree
  type: imprint
  created_at: "2026-10-21"
  author: calebcowen@gmail.com
  intent: the stagedTree function writes the staged files under the config's directory to a temporary directory and returns the path of the config's directory inside it, so it can be read as a tree.
  constraints:
    - The function receives a pointer to a repo (defined in common_run.go of package main) as its only argument
    - 'The function returns three values in order: the directory path as a string, a cleanup function taking no arguments and returning nothing, and an error'
    - The function creates a temporary directory in the system temporary location
    - The temporary directory name starts with "provenance-staged-"
    - When the temporary directory cannot be created, the function returns an empty path, a nil cleanup function and the error
    - 'The function runs the repo''s git method (parameters: a variadic list of string arguments; returns the trimmed standard output as a string and an error)'
    - 'The git arguments, in order, are: checkout-index, the all-files flag -a, and the prefix option --prefix= followed by the directory path and a slash'
    - When the checkout fails, the function removes the temporary directory
    - When the checkout fails, the function returns an empty path, a nil cleanup function and the error
    - The function adds no imports
    - git checkout-index run in the repo root checks out only the index files under the repo root, each at its path relative to the git top level, so they land under the temporary directory at the config directory's own prefix.
    - After a successful checkout the function runs the repo's git method with rev-parse and --show-prefix, which returns the config's directory relative to the git top level with a trailing slash, or an empty string at the git top level.
    - When rev-parse --show-prefix fails, the function removes the temporary directory and returns an empty path, a nil cleanup function and the error.
    - On success the function returns the temporary directory joined with the prefix, converted to the operating system's path separators, so with an empty prefix it returns the temporary directory itself.
    - On success the function also returns the cleanup function and a nil error.
    - The cleanup function removes the whole temporary directory and everything under it, not only the returned path.
  affected_scope:
    - cmd/provenance/check_run.go
