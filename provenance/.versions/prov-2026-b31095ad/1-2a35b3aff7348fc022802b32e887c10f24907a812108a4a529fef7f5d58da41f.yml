  intent: Version is a published version together with the server's uri and cid.
  constraints:
    - Version is an exported struct type.
    - Version embeds record.PublishedVersion as its first field, without a field name.
    - Version has two further exported string fields, declared in the order URI, CID.
    - The JSON name of field URI is uri.
    - The JSON name of field CID is cid.
    - The embedded field carries no struct tag.
    - This unit declares only the type and defines no methods.
    - record.PublishedVersion comes from the package github.com/livecodelife/provenance/record, used without importing the package by name in this unit.
    - This unit adds no imports to the file.
