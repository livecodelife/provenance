content:
  id: prov-2026-adabd65f
  title: provenance version command
  type: imprint
  created_at: "2026-10-19"
  author: calebcowen@gmail.com
  intent: |-
    The provenance version command (blueprint prov-2026-c8efa14f, section 1), in two files.

    Wiring, cmd/provenance/version_cmd.go (cobra package): a top-level command, use "version", short "Print the provenance version", arity none. No flags.

    Behaviour is fixed by cmd/provenance/version_test.go (prints exactly version.Version and a newline; an argument is refused).

    Logic, cmd/provenance/version_run.go:

    File cmd/provenance/version_run.go (go package, package main). Imports, each its own addImport, exactly these: fmt, io, github.com/spf13/cobra, github.com/livecodelife/provenance/version.

    Declarations, in this order, each exactly one set* call (file kwarg cmd/provenance/version_run.go) whose code kwarg is the code below verbatim (gofmt-formatted, comments kept). Do not alter, reorder or add anything. A const or var group is one setConst or setVar named after its first name; setMethod takes receiver and name separately.

      - setFunction name runVersion, code exactly:
          func runVersion(out io.Writer, cmd *cobra.Command, args []string) error {
          	_, err := fmt.Fprintln(out, version.Version)
          	return err
          }
  affected_scope:
    - cmd/provenance/version_cmd.go
    - cmd/provenance/version_run.go
    - cmd/provenance/main.go
  implements: prov-2026-c8efa14f
  implements_version: 1
  associated_specs:
    - path: cmd/provenance/version_test.go
