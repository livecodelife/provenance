content:
  id: prov-2026-32011bf9
  title: violation type
  type: imprint
  created_at: "2026-10-21"
  author: calebcowen@gmail.com
  intent: the violation type is one finding of the check, recorded against a record and optionally a file.
  constraints:
    - The type is an unexported struct named violation
    - The struct has a string field RecordID, empty when the finding belongs to no record
    - The struct has a string field File, empty when the finding is not about one file
    - The struct has a string field Message holding the human-readable text of the finding
    - The struct has no other fields
    - The type adds no imports
