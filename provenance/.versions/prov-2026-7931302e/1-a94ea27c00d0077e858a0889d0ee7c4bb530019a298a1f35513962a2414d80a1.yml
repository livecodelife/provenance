content:
  id: prov-2026-7931302e
  title: 'provenance document, command part 1: command wiring'
  type: blueprint
  created_at: "2026-10-24"
  author: calebcowen@gmail.com
  intent: The document command is a cobra command that prints the behaviour document of the repository, or plans and applies an edited document, by calling runDocument.
  constraints:
    - The document command is a top-level provenance command that takes no positional arguments.
    - The command has a repeatable scope flag that keeps only the records whose affected_scope covers a path.
    - The command has a format flag that accepts only md.
    - The command has an out flag, with the short form o, that writes the document to a file instead of standard output.
    - The command has an ids switch that shows record ids in the headings.
    - The command has an apply flag that names an edited document file to plan.
    - The command has a write switch that applies the plan to the records.
    - The command has a reason flag that gives the reason for the revisions.
    - The command has a skip-conflicts switch that skips conflicting sections when writing.
    - The command's run function delegates to runDocument with the command's output writer, the command and the arguments, and returns its error.
  affected_scope:
    - cmd/provenance/document_cmd.go
    - cmd/provenance/main.go
    - cmd/provenance/document_test.go
    - cmd/provenance/document_helpers_test.go
