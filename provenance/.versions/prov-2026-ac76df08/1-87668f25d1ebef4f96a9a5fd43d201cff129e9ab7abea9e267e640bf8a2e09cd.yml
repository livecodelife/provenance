content:
  id: prov-2026-ac76df08
  title: remote.Client.do
  type: imprint
  created_at: "2026-10-22"
  author: calebcowen@gmail.com
  intent: The do method checks the API base and runs one request through the authentication function.
  constraints:
    - do is an unexported method with a pointer receiver of type Client.
    - 'do has five parameters in order: ctx (a context.Context), method (a string), path (a string), in (any) and out (any), and it returns an error.'
    - 'Step 1: call auth.CheckServer with the receiver''s Base field, which takes a string and returns an error.'
    - If CheckServer fails, do returns that error unchanged, before the Auth function is called and before any request is made.
    - 'Step 2: call the receiver''s Auth field with ctx and a function that takes a bearer string and returns the result of the receiver''s once method called with ctx, method, path, the bearer, in and out.'
    - once is a method of Client defined elsewhere in package remote with parameters ctx (a context.Context), method, path and bearer (strings), in and out (any), returning an error.
    - do returns the result of the Auth function unchanged.
    - auth.CheckServer comes from the package github.com/livecodelife/provenance/auth.
    - This unit imports the package github.com/livecodelife/provenance/auth as a value.
    - This unit adds no other imports to the file.
  affected_scope:
    - remote/client.go
  implements: prov-2026-fe19dbf4
  implements_version: 9
  associated_specs:
    - path: remote/client_test.go
