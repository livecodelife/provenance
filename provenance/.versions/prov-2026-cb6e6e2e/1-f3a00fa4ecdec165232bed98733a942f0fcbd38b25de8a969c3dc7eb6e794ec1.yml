content:
  id: prov-2026-cb6e6e2e
  title: auth.EnvToken
  type: imprint
  created_at: "2026-10-22"
  author: calebcowen@gmail.com
  intent: The EnvToken group declares the environment variable names, default server and client id used by sign-in.
  constraints:
    - The unit is one exported constant group declaring five untyped string constants.
    - EnvToken has the value "PROVISIO_TOKEN".
    - EnvToken names the environment variable holding a personal token, which wins over any stored credential.
    - EnvServer has the value "PROVISIO_AUTH_URL".
    - EnvServer names the environment variable that overrides the auth service base URL at login.
    - EnvNoKeychain has the value "PROVISIO_NO_KEYCHAIN".
    - EnvNoKeychain names the environment variable which, when set to a non-empty value, keeps credentials out of the OS keychain.
    - DefaultServer has the value "https://auth.provisio.dev".
    - DefaultServer is the auth service used when nothing else is configured.
    - ClientID has the value "provenance-cli".
    - ClientID is what the CLI sends as client_id.
    - The constants are declared in the order EnvToken, EnvServer, EnvNoKeychain, DefaultServer, ClientID.
    - This unit does not change the file's imports.
  affected_scope:
    - auth/credential.go
  forbidden_scope:
    - auth/client.go
    - auth/lock.go
    - auth/session.go
  implements: prov-2026-ee401a6a
  implements_version: 9
  associated_specs:
    - path: auth/store_test.go
