content:
  id: prov-2026-4a667d7d
  title: auth.Manager.now
  type: imprint
  created_at: "2026-10-22"
  author: calebcowen@gmail.com
  intent: The now method returns the current time as the manager sees it.
  constraints:
    - now is an unexported method with a pointer receiver of type Manager.
    - now takes no parameters and returns a time.Time.
    - When the receiver's Now field is not nil, now returns the result of calling it.
    - When the receiver's Now field is nil, now returns the result of time.Now().
    - time.Now and time.Time come from the standard-library package time.
    - This unit does not change the file's imports.
  affected_scope:
    - auth/session.go
  forbidden_scope:
    - auth/credential.go
    - auth/store.go
    - auth/keyring_system.go
    - auth/client.go
