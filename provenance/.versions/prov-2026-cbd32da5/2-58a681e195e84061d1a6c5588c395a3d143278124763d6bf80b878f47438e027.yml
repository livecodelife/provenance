content:
  id: prov-2026-cbd32da5
  title: stagedPaths
  type: imprint
  created_at: "2026-10-21"
  author: calebcowen@gmail.com
  intent: the stagedPaths function lists the paths changed in the index, leaving out paths that only came from a merge.
  constraints:
    - The function receives a pointer to a repo as its only argument
    - The function returns a slice of strings and an error
    - When git fails, the function returns a nil slice and the error
    - The output is split on newline characters
    - Empty lines are dropped
    - The order of the paths is the order git printed them
    - 'The function passes the paths through mergeFiltered (defined in this file; parameters in order: a pointer to a repo and a slice of strings; returns a slice of strings)'
    - The function returns mergeFiltered's result as the paths
    - The function returns a nil error on success
    - The repo parameter is a pointer to the repo struct defined in common_run.go of package main
    - The repo's git method takes a variadic list of string arguments, runs git in the repo root and returns the trimmed standard output as a string and an error
    - The function adds no imports
    - The function runs the repo's git method (variadic string arguments; returns trimmed standard output and an error) with diff, --cached, --name-only, --no-renames and --relative.
    - The --relative argument makes git print each path relative to the directory git runs in, which is the repo root, namely the config's directory.
    - The --relative argument makes git leave out every changed path outside that directory.
    - When the config's directory is the git top level, the paths are the same as without --relative.
  affected_scope:
    - cmd/provenance/check_run.go
  implements: prov-2026-409e803e
  implements_version: 1
