content:
  id: prov-2026-17d5965a
  title: remote.PublishItem
  type: imprint
  created_at: "2026-10-16"
  author: calebcowen@gmail.com
  intent: PublishItem describes what publishing one record would write.
  constraints:
    - PublishItem is an exported struct type with ten exported fields, declared in the order given below.
    - Field ID is a string, the record id.
    - Field Title is a string, the record title.
    - Field Snaps is a slice of pointers to record.Snapshot, the versions to write, oldest first.
    - Field Status is a string, the local status; the last written version carries it.
    - Field HeadCID is a string, the cid of the remote head, empty when the record is unpublished.
    - Field HeadVersion is an int, the version of the remote head, 0 when the record is unpublished.
    - Field HeadStatus is a string, set when only the head needs a new status and no version is written.
    - Field Source is a pointer to record.PublishedSource, where the record lives in git; every write carries it when it is set.
    - Field SetProject is a string, the project to set on the head when the record has nothing new to write; empty otherwise.
    - Field SetSource is a pointer to record.PublishedSource, the source to set on the head when the record has nothing new to write; nil otherwise.
    - The fields carry no struct tags.
    - This unit declares only the type and defines no methods.
    - record.Snapshot and record.PublishedSource come from the package github.com/livecodelife/provenance/record.
    - This unit imports the package github.com/livecodelife/provenance/record as a value.
    - This unit adds no other imports to the file.
  affected_scope:
    - remote/publish.go
  implements: prov-2026-fe19dbf4
  implements_version: 9
  associated_specs:
    - path: remote/publish_test.go
