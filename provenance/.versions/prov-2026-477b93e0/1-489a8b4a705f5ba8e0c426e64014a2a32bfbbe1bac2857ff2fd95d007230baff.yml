  title: RenderOptions type
  type: imprint
  created_at: "2026-10-26"
  author: calebcowen@gmail.com
  intent: The RenderOptions type holds the options of the Render function.
  constraints:
    - The type is exported from package document of the module github.com/livecodelife/provenance and needs no imports.
    - RenderOptions has the field Scopes, a slice of strings holding repo-relative paths.
    - RenderOptions has the field IDs, a bool.
    - The zero value of RenderOptions means no scope filter and no ids in the headings.
