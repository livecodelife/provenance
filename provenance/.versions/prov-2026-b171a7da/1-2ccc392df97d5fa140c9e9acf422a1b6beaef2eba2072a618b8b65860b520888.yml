content:
  id: prov-2026-b171a7da
  title: sedumMissing
  type: imprint
  created_at: "2026-10-22"
  author: calebcowen@gmail.com
  intent: the sedumMissing function reports whether the sedum program cannot be found.
  constraints:
    - The function takes no arguments
    - The function returns a boolean
    - The sedum program is the value of the SEDUM_BIN environment variable when it is non-empty
    - When SEDUM_BIN is empty or unset, the program is the command "sedum"
    - The program is resolved with exec.LookPath from the os/exec package, passing the program as its only argument
    - The function returns true when exec.LookPath returns an error
    - The function returns false when exec.LookPath returns no error
    - The function never runs the program
    - A program value containing a path separator is checked as a file path
    - A program value without a path separator is searched for on the executable search path
    - The function adds no imports
  affected_scope:
