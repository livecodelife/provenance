  id: prov-2026-6eeaa2bc
  title: Plan type
  type: imprint
  created_at: "2026-10-26"
  author: calebcowen@gmail.com
  intent: The Plan type holds the result of comparing an edited document with the records.
  constraints:
    - The type is exported from package document and needs no imports.
    - Plan has the field Changes, a slice of Change.
    - Plan has the field Conflicts, a slice of Problem.
    - Plan has the field Problems, a slice of Problem.
    - Plan has the field Unchanged, a slice of strings holding record ids.
