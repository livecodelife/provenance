content:
  id: prov-2026-a8ec3e30
  title: token revoke command wiring
  type: imprint
  created_at: "2026-10-22"
  author: calebcowen@gmail.com
  intent: The token revoke command is a cobra command that revokes a personal token by calling runTokenRevoke.
  constraints:
    - The function newTokenRevokeCmd takes no arguments.
    - The function newTokenRevokeCmd returns a pointer to a cobra command.
    - The command use text is "revoke <id>".
    - The command short text is "Revoke a personal token".
    - The command requires exactly one positional argument.
    - The command defines no flags of its own.
    - The command defines no subcommands.
    - newTokenRevokeCmd is added as a subcommand by newTokenCmd, not registered in main.go.
    - The file imports github.com/spf13/cobra as a value.
    - The file adds no other imports.
    - runTokenRevoke is defined elsewhere in package main.
    - 'runTokenRevoke takes parameters in order: an io.Writer, a pointer to a cobra command, and a slice of strings.'
    - runTokenRevoke returns an error.
    - The command's run function is the command's RunE field.
    - The command's run function returns the result of calling runTokenRevoke with the writer returned by the command's OutOrStdout method, the command and the arguments.
  affected_scope:
    - cmd/provenance/token_revoke_cmd.go
  implements: prov-2026-ee401a6a
  implements_version: 9
  associated_specs:
    - path: cmd/provenance/token_test.go
