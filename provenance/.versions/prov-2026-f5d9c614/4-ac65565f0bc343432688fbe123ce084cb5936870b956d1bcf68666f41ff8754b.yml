content:
  id: prov-2026-f5d9c614
  title: 'go: version constant'
  type: imprint
  created_at: "2026-10-19"
  author: calebcowen@gmail.com
  intent: The Version constant in package version holds the program's release version as a bare semantic version string.
  constraints:
    - The file declares package version
    - The file exports a constant named Version
    - Version has type string
    - Version is made of three dot-separated non-negative integers
    - Version has no v prefix
    - Version has no pre-release or build suffix
    - Version is declared as a constant, not a variable
    - Version is not set at build time
    - go build and go run report the same value of Version
    - Version has a doc comment saying it is the release version of the program
    - The file adds no imports
    - The version package test decides whether the value is correct
    - The value of Version is the string 3.0.1
  affected_scope:
    - version/version.go
  implements: prov-2026-c8efa14f
  implements_version: 7
  associated_specs:
    - path: version/version_test.go
