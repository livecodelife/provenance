content:
  id: prov-2026-438a44bc
  title: auth.Credential.Secrets
  type: imprint
  created_at: "2026-10-22"
  author: calebcowen@gmail.com
  intent: Secrets returns every secret string held by a credential, so tests can check that none leaks.
  constraints:
    - Secrets is an exported method with a pointer receiver of type Credential, taking no arguments and returning a slice of strings.
    - The result lists the AccessToken, then the RefreshToken, then the PersonalToken, in that order.
    - A token that is the empty string is left out of the result.
    - The result holds no other field of the credential.
    - When all three tokens are empty the result is a nil slice.
    - Secrets does not modify the credential.
    - The method uses only built-in types and adds no imports.
  affected_scope:
    - auth/credential.go
  forbidden_scope:
    - auth/client.go
    - auth/lock.go
    - auth/session.go
  implements: prov-2026-ee401a6a
  implements_version: 9
  associated_specs:
    - path: auth/store_test.go
