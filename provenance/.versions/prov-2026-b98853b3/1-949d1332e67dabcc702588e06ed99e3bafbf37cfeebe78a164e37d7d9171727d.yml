content:
  id: prov-2026-b98853b3
  title: Section type
  type: imprint
  created_at: "2026-10-26"
  author: calebcowen@gmail.com
  intent: The Section type holds one parsed section of a behaviour document.
  constraints:
    - The type is exported from package document and needs no imports.
    - Section has the field Heading, a string, holding the heading text.
    - Section has the field Level, an int, holding 2 or 3.
    - Section has the field Line, an int, holding the one-based line number of the heading.
    - Section has the field ID, a string, holding the anchored record id.
    - Section has the field Version, an int, holding the anchored version.
    - Section has the field Anchored, a bool.
    - Section has the field Intent, a string.
    - Section has the field Constraints, a slice of strings.
    - Section has the field HasConstraints, a bool that is true when the section has a constraints marker.
  affected_scope:
    - document/render.go
