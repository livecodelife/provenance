content:
  id: prov-2026-7f96263a
  title: token command wiring
  type: imprint
  created_at: "2026-10-21"
  author: calebcowen@gmail.com
  intent: The token command is a cobra command that groups the commands managing the account's personal tokens.
  constraints:
    - The function newTokenCmd takes no arguments.
    - The function newTokenCmd returns a pointer to a cobra command.
    - The command use text is "token".
    - The command short text is "Manage Provisio personal tokens".
    - The command accepts no positional arguments.
    - The command defines no flags of its own.
    - The command has no run function of its own.
    - 'The command has three subcommands, added in this order: the results of newTokenCreateCmd, newTokenListCmd and newTokenRevokeCmd.'
    - Each of newTokenCreateCmd, newTokenListCmd and newTokenRevokeCmd takes no arguments and returns a pointer to a cobra command.
    - Each of newTokenCreateCmd, newTokenListCmd and newTokenRevokeCmd is defined in package main.
    - The subcommands are added by calling the command's AddCommand method.
    - newTokenCmd is registered on the root command in main.go, by calling the root command's AddCommand with the result of newTokenCmd().
    - The file imports github.com/spf13/cobra as a value.
    - The file adds no other imports.
  affected_scope:
    - cmd/provenance/main.go
    - cmd/provenance/token_cmd.go
    - cmd/provenance/token_test.go
  implements: prov-2026-ee401a6a
  implements_version: 9
  associated_specs:
    - path: cmd/provenance/token_test.go
