content:
  id: prov-2026-1692f078
  title: remote.ImportPlan
  type: imprint
  created_at: "2026-10-22"
  author: calebcowen@gmail.com
  intent: ImportPlan lists what an import would bring in and what it refuses.
  constraints:
    - ImportPlan is an exported struct type.
    - ImportPlan has two exported fields, declared in the order Items, Refused.
    - Field Items is a slice of ImportItem values, not pointers.
    - Field Refused is a slice of strings, one message for each record that cannot be imported.
    - The fields carry no struct tags.
    - This unit declares only the type and defines no methods.
    - ImportItem is a struct type defined elsewhere in package remote.
    - This unit adds no imports to the file.
  affected_scope:
    - remote/import.go
  implements: prov-2026-fe19dbf4
