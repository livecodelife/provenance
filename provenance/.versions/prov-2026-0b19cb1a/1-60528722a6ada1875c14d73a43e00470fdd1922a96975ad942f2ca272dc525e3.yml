content:
  id: prov-2026-0b19cb1a
  title: remote.Client.PutVersion
  type: imprint
  created_at: "2026-10-22"
  author: calebcowen@gmail.com
  intent: The PutVersion method appends one version to a record on the server and returns the new head and version.
  constraints:
    - PutVersion is an exported method with a pointer receiver of type Client.
    - 'PutVersion takes three parameters in order: ctx (a context.Context), id (a string) and req (a PutVersionRequest value), and returns a pointer to Head, a pointer to Version and an error.'
    - 'Step 1: call the receiver''s do method with ctx, the method http.MethodPut, the path /records/ followed by the id escaped with url.PathEscape and then /versions, req as the request body and a pointer to the value to decode into.'
    - do is a method of Client defined elsewhere in package remote with parameters ctx (a context.Context), method and path (strings), in and out (any), returning an error.
    - The value to decode into is a struct with two exported fields.
    - Field Head is a Head with the JSON name head.
    - Field Version is a Version with the JSON name version.
    - If do fails, PutVersion returns nil, nil and that error unchanged.
    - 'Step 2: on success the head''s ID field is set to the id parameter, and PutVersion returns a pointer to the head, a pointer to the version and a nil error.'
    - PutVersionRequest, Head and Version are struct types defined elsewhere in package remote; Head has the string field ID.
    - http.MethodPut comes from the standard-library package net/http, already imported by another unit.
    - url.PathEscape comes from the standard-library package net/url, already imported by another unit.
    - This unit adds no imports to the file.
  affected_scope:
    - remote/client.go
  implements: prov-2026-fe19dbf4
  implements_version: 9
  associated_specs:
    - path: remote/client_test.go
