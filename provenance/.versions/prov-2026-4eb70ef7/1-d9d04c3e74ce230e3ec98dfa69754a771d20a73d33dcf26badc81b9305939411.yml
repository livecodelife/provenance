content:
  id: prov-2026-4eb70ef7
  title: provenance search
  type: imprint
  created_at: "2026-10-16"
  author: calebcowen@gmail.com
  intent: "The provenance search command (blueprint 73518c0e, approved by provisio-mgr 01M51X6T68T3), in two files.\n\nWiring, cmd/provenance/search_cmd.go (cobra package): a top-level command, use \"search [query]\", short \"Search records by words (offline, lexical)\", arity max_one. Flags, none with a short form or default (the code applies the default limit of 5):\n- query (string): \"Search words (alternative to the argument)\"\n- limit (int): \"Maximum results (default 5, at most 50)\"\n- status (string): \"Only records with this status (draft|open|implemented|deprecated)\"\n- type (string): \"Only records of this tier (brief|blueprint|imprint)\"\n- format (string): \"Output format (human|json)\"\n\nLogic, cmd/provenance/search_run.go (go package, package main). Offline and deterministic: terms are lowercase letters and digits runs of at least 2 characters minus a fixed stop-word list; records (and cached shared-repo records, marked shared) are scored with BM25 (k1 1.2, b 0.75) over weighted fields id and aliases 5, title 4, tags 3, scope paths 2, intent 1, constraints 1, version reasons 1; ties break by id; score 0 is not listed; deprecated records only with --status deprecated. The JSON carries \"backend\": \"lexical\" so a semantic backend can be added later without breaking readers, and is documented in the README. Record text is data: the human output strips control characters and caps excerpts (120) and titles (100). \nImports, each its own addImport, exactly these: encoding/json, fmt, io, math, sort, strings, unicode, github.com/spf13/cobra, github.com/livecodelife/provenance/record.\n\nDeclarations, in this order, each exactly one set* call whose code kwarg is the code below verbatim (gofmt-formatted, comments kept). Do not alter, reorder or add anything.\n\n  - setType name searchHit, code exactly:\n      type searchHit struct {\n      \tID      string   `json:\"id\"`\n      \tVersion int      `json:\"version\"`\n      \tStatus  string   `json:\"status\"`\n      \tType    string   `json:\"type\"`\n      \tTitle   string   `json:\"title\"`\n      \tScore   float64  `json:\"score\"`\n      \tShared  bool     `json:\"shared,omitempty\"`\n      \tMatched []string `json:\"matched\"`\n      \tExcerpt string   `json:\"excerpt\"`\n      }\n  - setType name searchResult, code exactly:\n      type searchResult struct {\n      \tQuery   string      `json:\"query\"`\n      \tBackend string      `json:\"backend\"`\n      \tResults []searchHit `json:\"results\"`\n      }\n  - setType name searchField, code exactly:\n      type searchField struct {\n      \tName   string\n      \tWeight float64\n      \tText   string\n      }\n  - setType name searchEntry, code exactly:\n      type searchEntry struct {\n      \tRec    *record.Record\n      \tShared bool\n      \tFields []searchField\n      \tTF     map[string]float64\n      \tLen    float64\n      }\n  - setVar name searchStop, code exactly:\n      var searchStop = map[string]bool{\"a\": true, \"an\": true, \"and\": true, \"are\": true, \"as\": true, \"at\": true, \"be\": true, \"by\": true, \"for\": true, \"from\": true, \"has\": true, \"in\": true, \"is\": true, \"it\": true, \"its\": true, \"of\": true, \"on\": true, \"or\": true, \"that\": true, \"the\": true, \"this\": true, \"to\": true, \"was\": true, \"with\": true}\n  - setFunction name searchTerms, code exactly:\n      func searchTerms(s string) []string {\n      \tvar terms []string\n      \tfor _, w := range strings.FieldsFunc(strings.ToLower(s), func(c rune) bool { return !unicode.IsLetter(c) && !unicode.IsDigit(c) }) {\n      \t\tif len([]rune(w)) >= 2 && !searchStop[w] {\n      \t\t\tterms = append(terms, w)\n      \t\t}\n      \t}\n      \treturn terms\n      }\n  - setFunction name searchEntryOf, code exactly:\n      func searchEntryOf(r *repo, rec *record.Record, shared bool) *searchEntry {\n      \te := &searchEntry{Rec: rec, Shared: shared, TF: map[string]float64{}}\n      \treasons := \"\"\n      \tif !shared {\n      \t\tif versions, err := r.Store.Versions(rec.ID); err == nil {\n      \t\t\tfor _, v := range versions {\n      \t\t\t\tif snap, err := r.Store.Snapshot(rec.ID, v); err == nil {\n      \t\t\t\t\treasons += snap.Reason + \"\\n\"\n      \t\t\t\t}\n      \t\t\t}\n      \t\t}\n      \t}\n      \te.Fields = []searchField{\n      \t\t{\"id\", 5, rec.ID + \" \" + strings.Join(rec.Aliases, \" \")},\n      \t\t{\"title\", 4, rec.Title},\n      \t\t{\"tags\", 3, strings.Join(rec.Tags, \" \")},\n      \t\t{\"scope\", 2, strings.Join(rec.AffectedScope, \" \")},\n      \t\t{\"intent\", 1, rec.Intent},\n      \t\t{\"constraints\", 1, strings.Join(rec.Constraints, \"\\n\")},\n      \t\t{\"reasons\", 1, reasons},\n      \t}\n      \tfor _, f := range e.Fields {\n      \t\tfor _, t := range searchTerms(f.Text) {\n      \t\t\te.TF[t] += f.Weight\n      \t\t\te.Len += f.Weight\n      \t\t}\n      \t}\n      \treturn e\n      }\n  - setFunction name searchExcerpt, code exactly:\n      func searchExcerpt(e *searchEntry, query []string) (string, []string) {\n      \twant := map[string]bool{}\n      \tfor _, q := range query {\n      \t\twant[q] = true\n      \t}\n      \tvar matched []string\n      \tbestWeight, best := 0.0, \"\"\n      \tfor _, f := range e.Fields {\n      \t\thits := 0\n      \t\tfor _, t := range searchTerms(f.Text) {\n      \t\t\tif want[t] {\n      \t\t\t\thits++\n      \t\t\t}\n      \t\t}\n      \t\tif hits == 0 {\n      \t\t\tcontinue\n      \t\t}\n      \t\tmatched = append(matched, f.Name)\n      \t\tif w := f.Weight * float64(hits); w > bestWeight {\n      \t\t\tbestWeight = w\n      \t\t\tbest = f.Text\n      \t\t\tfor _, line := range strings.Split(f.Text, \"\\n\") {\n      \t\t\t\tfor _, t := range searchTerms(line) {\n      \t\t\t\t\tif want[t] {\n      \t\t\t\t\t\tbest = line\n      \t\t\t\t\t\tbreak\n      \t\t\t\t\t}\n      \t\t\t\t}\n      \t\t\t\tif best == line {\n      \t\t\t\t\tbreak\n      \t\t\t\t}\n      \t\t\t}\n      \t\t}\n      \t}\n      \treturn ctxClean(strings.TrimSpace(best), 120), matched\n      }\n  - setFunction name searchRecords, code exactly:\n      func searchRecords(r *repo, query []string, status, typ string) ([]searchHit, error) {\n      \tids, err := r.Store.List()\n      \tif err != nil {\n      \t\treturn nil, err\n      \t}\n      \tvar entries []*searchEntry\n      \tlocalIDs := map[string]bool{}\n      \tfor _, id := range ids {\n      \t\tlocalIDs[id] = true\n      \t\trec, _, err := r.Store.Load(id)\n      \t\tif err != nil {\n      \t\t\treturn nil, err\n      \t\t}\n      \t\tentries = append(entries, searchEntryOf(r, rec, false))\n      \t}\n      \tshared, _ := loadShared(r)\n      \tfor id, rec := range shared {\n      \t\tif !localIDs[id] {\n      \t\t\tentries = append(entries, searchEntryOf(r, rec, true))\n      \t\t}\n      \t}\n      \tvar pool []*searchEntry\n      \tfor _, e := range entries {\n      \t\tif status != \"\" && string(e.Rec.Status) != status {\n      \t\t\tcontinue\n      \t\t}\n      \t\tif status == \"\" && e.Rec.Status == record.StatusDeprecated {\n      \t\t\tcontinue\n      \t\t}\n      \t\tif typ != \"\" && string(e.Rec.EffectiveType()) != typ {\n      \t\t\tcontinue\n      \t\t}\n      \t\tpool = append(pool, e)\n      \t}\n      \tn := float64(len(pool))\n      \ttotal := 0.0\n      \tdf := map[string]float64{}\n      \tfor _, e := range pool {\n      \t\ttotal += e.Len\n      \t\tfor t := range e.TF {\n      \t\t\tdf[t]++\n      \t\t}\n      \t}\n      \tavg := 1.0\n      \tif n > 0 && total > 0 {\n      \t\tavg = total / n\n      \t}\n      \tconst k1, b = 1.2, 0.75\n      \tvar hits []searchHit\n      \tfor _, e := range pool {\n      \t\tscore := 0.0\n      \t\tfor _, q := range query {\n      \t\t\ttf := e.TF[q]\n      \t\t\tif tf == 0 {\n      \t\t\t\tcontinue\n      \t\t\t}\n      \t\t\tidf := math.Log(1 + (n-df[q]+0.5)/(df[q]+0.5))\n      \t\t\tscore += idf * tf * (k1 + 1) / (tf + k1*(1-b+b*e.Len/avg))\n      \t\t}\n      \t\tif score <= 0 {\n      \t\t\tcontinue\n      \t\t}\n      \t\texcerpt, matched := searchExcerpt(e, query)\n      \t\thits = append(hits, searchHit{ID: e.Rec.ID, Version: e.Rec.Version, Status: string(e.Rec.Status), Type: string(e.Rec.EffectiveType()), Title: e.Rec.Title, Score: math.Round(score*1000) / 1000, Shared: e.Shared, Matched: matched, Excerpt: excerpt})\n      \t}\n      \tsort.SliceStable(hits, func(i, j int) bool {\n      \t\tif hits[i].Score != hits[j].Score {\n      \t\t\treturn hits[i].Score > hits[j].Score\n      \t\t}\n      \t\treturn hits[i].ID < hits[j].ID\n      \t})\n      \treturn hits, nil\n      }\n  - setFunction name runSearch, code exactly:\n      func runSearch(out io.Writer, cmd *cobra.Command, args []string) error {\n      \tr, err := openRepo(cmd)\n      \tif err != nil {\n      \t\treturn err\n      \t}\n      \ttext, _ := cmd.Flags().GetString(\"query\")\n      \tif text == \"\" && len(args) > 0 {\n      \t\ttext = args[0]\n      \t}\n      \tlimit, _ := cmd.Flags().GetInt(\"limit\")\n      \tstatus, _ := cmd.Flags().GetString(\"status\")\n      \ttyp, _ := cmd.Flags().GetString(\"type\")\n      \tformat, _ := cmd.Flags().GetString(\"format\")\n      \tif format != \"\" && format != \"human\" && format != \"json\" {\n      \t\treturn fmt.Errorf(\"unknown format %q (human|json)\", format)\n      \t}\n      \tswitch status {\n      \tcase \"\", \"draft\", \"open\", \"implemented\", \"deprecated\":\n      \tdefault:\n      \t\treturn fmt.Errorf(\"unknown status %q (draft|open|implemented|deprecated)\", status)\n      \t}\n      \tswitch typ {\n      \tcase \"\", \"brief\", \"blueprint\", \"imprint\":\n      \tdefault:\n      \t\treturn fmt.Errorf(\"unknown type %q (brief|blueprint|imprint)\", typ)\n      \t}\n      \tif limit == 0 {\n      \t\tlimit = 5\n      \t}\n      \tif limit < 1 || limit > 50 {\n      \t\treturn fmt.Errorf(\"--limit must be between 1 and 50\")\n      \t}\n      \tquery := searchTerms(text)\n      \tif len(query) == 0 {\n      \t\treturn fmt.Errorf(\"empty query: give search words (letters and digits, at least 2 characters, not only common words)\")\n      \t}\n      \thits, err := searchRecords(r, nameQuery(query), status, typ)\n      \tif err != nil {\n      \t\treturn err\n      \t}\n      \tif len(hits) > limit {\n      \t\thits = hits[:limit]\n      \t}\n      \tif hits == nil {\n      \t\thits = []searchHit{}\n      \t}\n      \tif format == \"json\" {\n      \t\tenc := json.NewEncoder(out)\n      \t\tenc.SetIndent(\"\", \"  \")\n      \t\treturn enc.Encode(searchResult{Query: text, Backend: \"lexical\", Results: hits})\n      \t}\n      \tfmt.Fprintf(out, \"\\nSEARCH: %s (lexical)\\n\\n\", ctxClean(text, 200))\n      \tif len(hits) == 0 {\n      \t\tfmt.Fprint(out, \"  no matching records\\n\\n\")\n      \t\treturn nil\n      \t}\n      \tfor _, h := range hits {\n      \t\tmark := \"\"\n      \t\tif h.Shared {\n      \t\t\tmark = \"  (shared)\"\n      \t\t}\n      \t\tfmt.Fprintf(out, \"  %s@%d  %s  %s  %s  (score %.3f)%s\\n\", h.ID, h.Version, h.Status, h.Type, ctxClean(h.Title, 100), h.Score, mark)\n      \t\tif h.Excerpt != \"\" {\n      \t\t\tfmt.Fprintf(out, \"      %s\\n\", h.Excerpt)\n      \t\t}\n      \t}\n      \tfmt.Fprint(out, \"\\n\")\n      \treturn nil\n      }\n  - setFunction name nameQuery, code exactly:\n      func nameQuery(terms []string) []string {\n      \tseen := map[string]bool{}\n      \tvar out []string\n      \tfor _, t := range terms {\n      \t\tif !seen[t] {\n      \t\t\tseen[t] = true\n      \t\t\tout = append(out, t)\n      \t\t}\n      \t}\n      \treturn out\n      }"
  constraints:
    - 'TestSearchRanksAndFilters, TestSearchIDQueryAndErrors and TestSearchTextIsDataAndSharedRecords pass: BM25 ranking, filters, limits, errors, backend lexical in the JSON, shared records searched, record text cleaned and capped in the human output.'
  affected_scope:
