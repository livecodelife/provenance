  id: prov-2026-3ab144df
  title: auth.TokenRequest
  type: imprint
  created_at: "2026-10-21"
  author: calebcowen@gmail.com
  intent: TokenRequest is the JSON body sent to the endpoint that creates a personal token.
  constraints:
    - TokenRequest is an exported struct type.
    - Field Name is a string with JSON key name.
    - Field Scopes is a slice of strings with JSON key scopes.
    - Field ExpiresInDays is an int with JSON key expires_in_days, omitted from the JSON when zero.
    - The fields are declared in the order Name, Scopes, ExpiresInDays.
    - This type does not change the file's imports.
