  intent: serverID is the compiled form of the server id pattern.
  constraints:
    - serverID is an unexported package-level variable.
    - serverID is a pointer to regexp.Regexp.
    - serverID is the result of regexp.MustCompile called with ServerIDPattern.
    - ServerIDPattern is a string constant defined elsewhere in package remote.
    - regexp.Regexp and regexp.MustCompile come from the standard-library package regexp.
    - This unit imports the package regexp as a value.
    - This unit adds no other imports to the file.
