content:
  id: prov-2026-e95b8b0f
  title: remote.HeadWant
  type: imprint
  created_at: "2026-10-22"
  author: calebcowen@gmail.com
  intent: HeadWant is what the caller wants the published heads to carry besides content.
  constraints:
    - HeadWant is an exported struct type with two exported fields, declared in the order Project, Source.
    - Field Project is a string, the project at-uri; the empty string leaves the heads' project alone.
    - Field Source is a function with one parameter, id (a string), returning a pointer to record.PublishedSource; nil leaves the heads' source alone.
    - The fields carry no struct tags.
    - The zero value of HeadWant wants nothing.
    - This unit declares only the type and defines no methods.
    - record.PublishedSource comes from the package github.com/livecodelife/provenance/record, used without importing the package by name in this unit.
    - This unit adds no imports to the file.
  affected_scope:
    - remote/publish.go
  implements: prov-2026-fe19dbf4
  implements_version: 9
  associated_specs:
    - path: remote/publish_test.go
