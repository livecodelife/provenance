    - Field Project is a string with the JSON name project, left out when empty.
    - Field Origin is a string with the JSON name origin, left out when empty.
    - Field BaseVersion is an int with the JSON name baseVersion, left out when 0.
    - Field BaseContentHash is a string with the JSON name baseContentHash, left out when empty.
