content:
  id: prov-2026-c90585a6
  title: auth.OAuthError
  type: imprint
  created_at: "2026-10-21"
  author: calebcowen@gmail.com
  intent: OAuthError is an error describing an HTTP failure reported by the auth service, never carrying a request body or token.
  constraints:
    - OAuthError is an exported struct type.
    - Field Code is a string holding the OAuth error code.
    - Field Description is a string holding the human-readable description.
    - Field Status is an int holding the HTTP status code.
    - Field RetryAfter is a time.Duration from package time holding the server-requested wait, zero when none.
    - The fields are declared in the order Code, Description, Status, RetryAfter.
    - The fields have no struct tags.
    - The struct holds no request body.
    - The struct holds no token.
    - The struct holds no secret.
    - This type does not change the file's imports.
    - time.Duration comes from package time.
  affected_scope:
    - auth/client.go
  implements: prov-2026-ee401a6a
  implements_version: 9
  associated_specs:
