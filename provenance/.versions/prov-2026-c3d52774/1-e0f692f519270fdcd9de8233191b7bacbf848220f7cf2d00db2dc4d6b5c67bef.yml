content:
  id: prov-2026-c3d52774
  title: unescapeLine function
  type: imprint
  created_at: "2026-10-26"
  author: calebcowen@gmail.com
  intent: The unescapeLine function undoes the backslash that escapeLine adds to a line of intent text.
  constraints:
    - The function is in package document and adds no imports; it uses strings from the imports of the file.
    - unescapeLine takes a line string and returns a string.
    - unescapeLine returns the line with one leading backslash removed when the line begins with a backslash and, after removing all its leading backslashes, is a marker line according to isMarkerLine.
    - unescapeLine returns the line unchanged otherwise.
    - isMarkerLine, defined in the same package, takes a line string and returns a bool that is true when the line, after removing leading whitespace, starts with two number signs and a space, starts with three number signs and a space, or starts with <!-- provenance:, or when the line, after removing surrounding whitespace, equals **Constraints**.
