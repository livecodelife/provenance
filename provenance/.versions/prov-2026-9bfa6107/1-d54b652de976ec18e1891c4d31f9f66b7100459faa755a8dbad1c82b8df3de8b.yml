  id: prov-2026-9bfa6107
  title: provenance repin command
  type: imprint
  created_at: "2026-10-15"
  author: calebcowen@gmail.com
  intent: |-
    The provenance repin command, in two files.

    Wiring, cmd/provenance/repin_cmd.go (cobra package): a top-level command, use "repin [id]", short "Confirm a record against a newer parent version without a new version", arity max_one. Flags, none with a short form or default:
    - record (string): "Record to repin (or give it as the argument)"
    - reason (string): "Why the record is still correct against the parent (required)"
    - to (int): "Parent version to pin to (default: the parent's current version)"

    Logic, cmd/provenance/repin_run.go (go package, package main). Imports, each its own addImport, exactly these: fmt, io, time, github.com/spf13/cobra, github.com/livecodelife/provenance/stale. Declaration, exactly one setFunction whose code kwarg is the code below verbatim (recordArg already exists in package main):

      - setFunction name runRepin, code exactly:
          func runRepin(out io.Writer, cmd *cobra.Command, args []string) error {
          	r, err := openRepo(cmd)
          	if err != nil {
          		return err
          	}
          	id, err := recordArg(cmd, args)
          	if err != nil {
          		return err
          	}
          	rec, _, err := r.resolve(id)
          	if err != nil {
          		return err
          	}
          	reason, _ := cmd.Flags().GetString("reason")
          	to, _ := cmd.Flags().GetInt("to")
          	log := stale.FilePinLog{Root: r.Root, Dir: r.Config.Dir}
          	pin, err := stale.Repin(r.Store, log, rec.ID, to, reason, r.author(), time.Now().UTC())
          	if err != nil {
          		r.fail("Cannot repin %s: %v", rec.ID, err)
          		return err
          	}
          	fmt.Fprintf(out, "\n✓ %s now pinned to %s@%d (was %d)\n\n  No new version was written. Commit with the tag %s\n\n", rec.ID, pin.Parent, pin.To, pin.From, tag(rec.ID, rec.Version))
          	return nil
          }
  constraints:
    - TestStaleListsAndExitCode / TestRepinClearsWithoutVersion pass; a second grow makes no model call.
  affected_scope:
    - cmd/provenance/repin_cmd.go
    - cmd/provenance/repin_run.go
    - cmd/provenance/main.go
    - cmd/provenance/repin_test.go
