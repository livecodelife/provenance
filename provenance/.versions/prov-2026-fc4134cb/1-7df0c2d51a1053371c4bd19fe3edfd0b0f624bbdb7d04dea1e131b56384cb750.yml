content:
  id: prov-2026-fc4134cb
  title: remote.Store.ctx
  type: imprint
  created_at: "2026-10-22"
  author: calebcowen@gmail.com
  intent: The ctx method returns the context a Store uses for its requests.
  constraints:
    - ctx is an unexported method with a pointer receiver of type Store.
    - ctx takes no parameters and returns a context.Context.
    - When the receiver's Ctx field is not nil, ctx returns it.
    - When the receiver's Ctx field is nil, ctx returns the result of context.Background.
    - context.Context and context.Background come from the standard-library package context.
    - This unit adds no imports to the file.
  affected_scope:
