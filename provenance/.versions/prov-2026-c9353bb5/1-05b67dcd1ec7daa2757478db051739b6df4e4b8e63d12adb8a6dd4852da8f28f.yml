content:
  id: prov-2026-c9353bb5
  title: writePlan
  type: imprint
  created_at: "2026-10-22"
  author: calebcowen@gmail.com
  intent: writePlan prints a publish plan as one line per record followed by totals; it is what publish with the plan flag shows.
  constraints:
    - 'writePlan is an unexported function with two parameters in order: out (an io.Writer) and plan (a pointer to remote.PublishPlan), and it returns nothing.'
    - writePlan writes only to out, asks nothing and writes nothing to the server.
    - remote.PublishPlan has the field Items, a slice of remote.PublishItem, the field UpToDate, a slice of strings, the field Problems, a slice of remote.PublishProblem, and the field Skipped, a slice of strings.
    - remote.PublishItem has the string fields ID and Title, the int field HeadVersion and the field Snaps, a slice.
    - remote.PublishProblem has the string fields ID, Kind and Reason.
    - In every line below the label is padded with spaces on the right to a width of 12 characters, a label of 12 or more characters is not cut, and one space follows the padded label.
    - 'Step 1: for each Problem whose Kind is invalid id, in order, write a line of two spaces, the label not publishable, the ID, a colon, a space and the Reason, and count it as not publishable.'
    - 'Step 2: for each Item, in order, the description is the result of headUpdate called with the item.'
    - headUpdate is a function defined elsewhere in package main with one parameter, a remote.PublishItem, returning a string.
    - When the item has exactly one Snaps entry the description is 1 version instead.
    - When the item has more than one Snaps entry the description is the number of entries in decimal, converted with strconv.Itoa, a space and the word versions instead.
    - The label is unpublished when the item's HeadVersion is 0, and the item is counted as unpublished.
    - The label is local ahead when the item's HeadVersion is not 0, and the item is counted as local ahead.
    - The line is two spaces, the padded label, the ID, two spaces, the Title, a space and the description in parentheses.
    - 'Step 3: for each id of UpToDate, in order, write a line of two spaces, the padded label up to date and the id.'
    - 'Step 4: for each Problem whose Kind is not invalid id, in order, count it as server ahead when its Kind is server ahead and as diverged otherwise, and write a line of two spaces, the padded Kind, the ID, a colon, a space and the Reason.'
    - 'Step 5: for each entry of Skipped, in order, write a line of two spaces, the padded label skipped and the entry.'
    - 'Step 6: write a blank line, then one line of the seven counts, then a blank line.'
    - 'The totals line is seven counts, each followed by a space and its label, separated by a comma and a space, in this order: the unpublished count and unpublished, the local ahead count and local ahead, the number of UpToDate entries and up to date, the server ahead count and server ahead, the diverged count and diverged, the not publishable count and not publishable, the number of Skipped entries and skipped.'
    - For example the totals line can read 1 unpublished, 0 local ahead, 0 up to date, 1 server ahead, 0 diverged, 0 not publishable, 0 skipped.
    - The lines for not publishable come first, then the items, then the up to date records, then the other problems, then the skipped records, then the totals.
    - io.Writer comes from the standard-library package io, already imported by another unit.
    - fmt.Fprintf and strconv.Itoa come from the standard-library packages fmt and strconv, already imported by another unit.
    - This unit adds no imports to the file.
  affected_scope:
    - cmd/provenance/publish_run.go
