  title: provenance whoami command
  type: imprint
  created_at: "2026-10-16"
  author: calebcowen@gmail.com
  intent: |-
    The provenance whoami command (blueprint prov-2026-ee401a6a, sections 2 and 4), in two files.

    Wiring, cmd/provenance/whoami_cmd.go (cobra package): a top-level command, use "whoami", short "Show the signed-in Provisio account", arity none. Flags, none with a short form or default:
    - json (bool): "Print as JSON"

    Behaviour is fixed by cmd/provenance/whoami_test.go and the no-secret test cmd/provenance/auth_secret_test.go (no token string reaches stdout, stderr or an error in any login, whoami or logout path): handle, DID, source (env, keychain or file) and expiry; --json omits every token value; logged out prints "Not signed in." and exits 1; an expired or revoked session exits 3.

    Logic, cmd/provenance/whoami_run.go:

    File cmd/provenance/whoami_run.go (go package, package main). Imports, each its own addImport, exactly these: encoding/json, errors, fmt, io, github.com/spf13/cobra, github.com/livecodelife/provenance/auth.

    Declarations, in this order, each exactly one set* call (file kwarg cmd/provenance/whoami_run.go) whose code kwarg is the code below verbatim (gofmt-formatted, comments kept). Do not alter, reorder or add anything. A const or var group is one setConst or setVar named after its first name; setMethod takes receiver and name separately.

      - setFunction name runWhoami, code exactly:
          func runWhoami(out io.Writer, cmd *cobra.Command, args []string) error {
          	asJSON, _ := cmd.Flags().GetBool("json")
          	m, err := sessionManager()
          	if err != nil {
          		return err
          	}
          	ctx := cmd.Context()
          	tok, err := m.Token(ctx)
          	if errors.Is(err, auth.ErrNoSession) {
          		fmt.Fprintln(out, "Not signed in.")
          		return errors.New("not signed in")
          	}
          	if err != nil {
          		return sessionError(err)
          	}
          	var info *auth.SessionInfo
          	err = m.Do(ctx, func(bearer string) error {
          		var err error
          		info, err = m.Client.Session(ctx, bearer)
          		return err
          	})
          	if err != nil {
          		return sessionError(err)
          	}
          	expires := ""
          	if t := info.Expiry(); !t.IsZero() {
          		expires = t.UTC().Format("2006-01-02T15:04:05Z")
          	}
          	if asJSON {
          		view := map[string]any{"handle": info.Handle, "did": info.DID, "source": string(tok.Source), "expires_at": expires}
          		if info.Token != nil {
          			view["token"] = map[string]any{"id": info.Token.ID, "name": info.Token.Name, "scopes": info.Token.Scopes}
          		}
          		enc := json.NewEncoder(out)
          		enc.SetIndent("", "  ")
          		return enc.Encode(view)
          	}
          	fmt.Fprintf(out, "Handle:  @%s\nDID:     %s\nSource:  %s\n", info.Handle, info.DID, tok.Source)
          	if expires != "" {
          		fmt.Fprintf(out, "Expires: %s\n", expires)
          	}
          	return nil
          }
