  title: whoami command wiring
  type: imprint
  created_at: "2026-10-16"
  author: calebcowen@gmail.com
  intent: the whoami command is a cobra command that shows the signed-in Provisio account by calling runWhoami.
  constraints:
    - The function newWhoamiCmd takes no arguments.
    - The function newWhoamiCmd returns a pointer to a cobra command.
    - The command use text is "whoami".
    - The command short text is "Show the signed-in Provisio account".
    - The command accepts no positional arguments.
    - The flag json is local to the command and has no short form.
    - The command defines no subcommands.
    - newWhoamiCmd is registered on the root command in main.go, by calling the root command's AddCommand with the result of newWhoamiCmd().
    - The file imports github.com/spf13/cobra as a value.
    - The file adds no other imports.
    - 'runWhoami is defined in whoami_run.go in package main with parameters in order: an io.Writer, a pointer to a cobra command, and a slice of strings; it returns an error.'
    - The command's run function returns the result of calling runWhoami with the writer returned by the command's OutOrStdout method, the command and the arguments.
    - The command has a boolean flag json.
    - The default of the flag json is false.
    - The usage text of the flag json is "Print as JSON".
  affected_scope:
    - cmd/provenance/whoami_cmd.go
    - cmd/provenance/main.go
