content:
  id: prov-2026-213e080d
  title: afterApply function
  type: imprint
  created_at: "2026-10-26"
  author: calebcowen@gmail.com
  intent: The afterApply function brings the version manifest up to date after records were revised.
  constraints:
    - The function is in package main and adds no imports.
    - afterApply takes, in order, a pointer to a repo, a slice of fileState values and a slice of document Revised values.
    - afterApply returns an error.
    - The repo's writeManifest method takes no arguments and returns an error.
    - restoreFiles, defined in package main, takes a slice of fileState values and returns nothing.
    - reconcileQuietly, defined in package main, takes a pointer to a repo and returns nothing.
    - When the slice of Revised is not empty, afterApply calls the repo's writeManifest.
    - When writeManifest fails, afterApply calls restoreFiles with the given file states.
    - When writeManifest fails, afterApply returns the writeManifest error.
    - When writeManifest fails, afterApply does not call reconcileQuietly.
    - When writeManifest fails, the records and version snapshots that were already written stay as saved.
    - When writeManifest succeeds, afterApply calls reconcileQuietly with the repo and returns nil.
    - When the slice of Revised is empty, afterApply returns nil without calling writeManifest or reconcileQuietly.
  affected_scope:
    - cmd/provenance/document_run.go
  implements: prov-2026-65888774
  implements_version: 1
