content:
  id: prov-2026-fd7c2130
  title: regionMarker type
  type: imprint
  created_at: "2026-10-21"
  author: calebcowen@gmail.com
  intent: the regionMarker type holds the identity and text data of one sedum region's opening line, body and closing line.
  constraints:
    - The type is an unexported struct named regionMarker
    - The struct has a string field Tier
    - The struct has a string field Record
    - The struct has a string field Gen
    - The struct has a string field Pkg holding the opening line's pkg value
    - The struct has a string field Prefix holding the opening line's text before the opening brace of its JSON object, including indentation, leader, action name and the space
    - The struct has a string field Body holding the region's body lines, each followed by a newline character
    - A region with no body lines has an empty Body
    - A region with one empty body line has a Body of one newline character
    - The struct has a string field Close holding the closing line's text unchanged
    - The struct is comparable with the equality operator
    - The type adds no imports
  affected_scope:
    - cmd/provenance/regen_run.go
  implements: prov-2026-409e803e
  implements_version: 10
