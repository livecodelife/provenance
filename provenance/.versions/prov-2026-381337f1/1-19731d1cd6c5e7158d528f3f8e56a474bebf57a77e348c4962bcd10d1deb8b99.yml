content:
  id: prov-2026-381337f1
  title: remote.ErrNotPublished and remote.ErrUnsupported
  type: imprint
  created_at: "2026-10-22"
  author: calebcowen@gmail.com
  intent: ErrNotPublished and ErrUnsupported are the two sentinel errors of the remote package.
  constraints:
    - ErrNotPublished and ErrUnsupported are exported package-level variables declared together in one var block.
    - ErrNotPublished is an error created with errors.New.
    - The text of ErrNotPublished is record is not published.
    - ErrNotPublished means the server has no such record in the caller's repository.
    - ErrUnsupported is an error created with errors.New.
    - 'The text of ErrUnsupported is not supported by the Provisio store: a remote record changes only by a new version.'
    - ErrUnsupported is returned by the Store methods that a remote record has no meaning for.
    - errors.New comes from the standard-library package errors.
    - This unit imports the package errors as a value.
    - This unit adds no other imports to the file.
  affected_scope:
    - remote/client.go
  implements: prov-2026-fe19dbf4
  implements_version: 9
  associated_specs:
    - path: remote/client_test.go
