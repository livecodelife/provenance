content:
  id: prov-2026-dd5cb132
  title: remote.Store.Remove
  type: imprint
  created_at: "2026-10-22"
  author: calebcowen@gmail.com
  intent: The Remove method refuses to remove a record, because a remote record changes only by a new version.
  constraints:
    - Remove is an exported method with a pointer receiver of type Store.
    - Remove takes one unnamed parameter, a string, and returns an error.
    - Remove always returns the variable ErrUnsupported itself.
    - Remove does not call the server and does not use its receiver.
    - ErrUnsupported is an error variable defined elsewhere in package remote.
    - This unit adds no imports to the file.
  affected_scope:
    - remote/store.go
  implements: prov-2026-fe19dbf4
