content:
  id: prov-2026-342fc2b3
  title: regionsAgree
  type: imprint
  created_at: "2026-10-21"
  author: calebcowen@gmail.com
  intent: the regionsAgree function reports whether two versions of a file differ only inside their sedum regions.
  constraints:
    - The function receives the base content and the staged content, both strings, in that order
    - The function returns a boolean
    - 'The function splits each content with splitRegions (parameter: a string; returns the outside text string, a slice of regionMarker and a boolean that is false when malformed)'
    - The function returns false when either content is malformed
    - The function returns false when the base content has no region
    - The function returns false when the outside texts differ in any byte
    - The function returns false when the two marker slices differ in length
    - The function returns false when any pair of markers at the same position differs in Tier, Record or Gen
    - Only Tier, Record and Gen are compared; everything else in the opening line is ignored
    - Region bodies are ignored
    - Otherwise the function returns true
    - The function adds no imports
  affected_scope:
