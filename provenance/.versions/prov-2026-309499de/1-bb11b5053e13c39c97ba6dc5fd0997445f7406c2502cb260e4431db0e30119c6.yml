content:
  id: prov-2026-309499de
  title: auth.Keyring
  type: imprint
  created_at: "2026-10-22"
  author: calebcowen@gmail.com
  intent: Keyring is the OS keychain behind an interface, so that it is optional at runtime.
  constraints:
    - Keyring is an exported interface type with three methods.
    - Method Get takes service and user, both strings, and returns a string and an error.
    - Method Set takes service, user and value, all strings, and returns an error.
    - Method Delete takes service and user, both strings, and returns an error.
    - Get returns the ErrKeyNotFound error value, defined elsewhere in package auth, for a missing entry.
    - This unit does not change the file's imports.
  affected_scope:
    - auth/store.go
  forbidden_scope:
    - auth/client.go
    - auth/lock.go
    - auth/session.go
  implements: prov-2026-ee401a6a
  implements_version: 9
  associated_specs:
    - path: auth/store_test.go
