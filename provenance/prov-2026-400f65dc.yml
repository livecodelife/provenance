intent: The isMarkerLine function reports whether a line of document text would be read as structure rather than as intent text.
constraints:
  - The function is in package document and adds no imports; it uses strings from the imports of the file.
  - isMarkerLine takes a line string and returns a bool.
  - isMarkerLine is true when the line, after removing leading whitespace, starts with two number signs and a space.
  - isMarkerLine is true when the line, after removing leading whitespace, starts with three number signs and a space.
  - isMarkerLine is true when the line, after removing leading whitespace, starts with <!-- provenance:.
  - isMarkerLine is true when the line, after removing surrounding whitespace, equals **Constraints**.
  - isMarkerLine is false for every other line.
