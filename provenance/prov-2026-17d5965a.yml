intent: |-
  Publish planning and applying (blueprint prov-2026-fe19dbf4, section 3), remote/publish.go. Behaviour is fixed by remote/publish_test.go: a new record plans all its local versions; a published one plans only the versions beyond the server's head, after checking the head's contentHash equals the local snapshot of the same number (else a Problem of kind "diverged" naming import or revise, the record skipped); a server ahead of the local record is reported as a Problem (kind "server ahead") naming import, and the record is skipped while the others are still planned; a record with no snapshot is skipped with a message; with nothing new but a local status further along the lifecycle (draft < open < implemented < deprecated) the plan holds a head-only status update; an in-sync record plans nothing and is listed in UpToDate, and an empty plan sends no request; only a failed request is an error. Every write carries the item's Source when it has one: the versions and the head-only update. ApplyPublish writes versions oldest first, each with expectedHeadCid taken from the previous response (omitted for version 1, JSON null), the last version carrying the local status; a head-only item uses PutHead with the head cid and version; a 409 surfaces as *ConflictError wrapped with the record id and version.

  File remote/publish.go (go package, package remote). Imports, each its own addImport, exactly these: context, errors, fmt, github.com/livecodelife/provenance/record.

  Declarations, in this order, each exactly one set* call (file kwarg remote/publish.go) whose code kwarg is the code below verbatim (gofmt-formatted, comments kept). Do not alter, reorder or add anything. A const or var group is one setConst or setVar named after its first name; setMethod takes receiver and name separately.

    - setFunction name statusRank, code exactly:
        // statusRank orders the lifecycle: a head status may only move forward.
        func statusRank(s string) int {
        	switch s {
        	case "draft":
        		return 0
        	case "open":
        		return 1
        	case "implemented":
        		return 2
        	case "deprecated":
        		return 3
        	}
        	return -1
        }
    - setType name PublishItem, code exactly:
        // PublishItem is what publishing one record would write.
        type PublishItem struct {
        	ID    string
        	Title string
        	// Snaps are the versions to write, oldest first.
        	Snaps []*record.Snapshot
        	// Status is the local status; the last written version carries it.
        	Status string
        	// HeadCID and HeadVersion describe the remote head, empty and 0 when unpublished.
        	HeadCID     string
        	HeadVersion int
        	// HeadStatus is set when only the head needs updating (no new version).
        	HeadStatus string
        	// Source is where the record lives in git; every write carries it when set.
        	Source *record.PublishedSource
        }
