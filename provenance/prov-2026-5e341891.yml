intent: The escapeLine function protects a line of intent text that looks like document structure by prefixing a backslash.
constraints:
  - The function is in package document and adds no imports; it uses strings from the imports of the file.
  - escapeLine takes a line string and returns a string.
  - escapeLine returns the line with one leading backslash added when, after removing all of its leading backslashes, the line is a marker line according to isMarkerLine.
  - escapeLine returns the line unchanged otherwise.
  - isMarkerLine, defined in the same package, takes a line string and returns a bool.
