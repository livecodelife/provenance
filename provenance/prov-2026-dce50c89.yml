    - setFunction name sedumRegions, code exactly:
        // /sedum:setType
        // sedum:setFunction {"tier":"owned","record":"prov-2026-dce50c89","gen":"sha256:b6d25ad8c4f9ce771570ea4cf6baa2ce4c798ca8b461a87c008566a5eba3f77c","pkg":"sha256:6589611adfb6618a7920e43f951a79901428192ea95c1084fde9f222aecd9537","kwargs":{"code":"func sedumRegions(r *repo, id string) ([]evidence.Region, bool) {\n\tgen := filepath.Join(r.Root, \"generators\")\n\tif _, err := os.Stat(gen); err != nil {\n\t\treturn nil, false\n\t}\n\tbin := os.Getenv(\"SEDUM_BIN\")\n\tif bin == \"\" {\n\t\tbin = \"sedum\"\n\t}\n\tc := exec.Command(bin, \"regions\", \"--json\", \"--generators\", gen, \"--records\", filepath.Join(r.Root, r.Config.Dir), \"--record\", id)\n\tc.Dir = r.Root\n\tout, err := c.Output()\n\tif err != nil {\n\t\treturn nil, false\n\t}\n\tvar doc struct {\n\t\tRegions []evidence.Region `json:\"regions\"`\n\t}\n\tif json.Unmarshal(out, &doc) != nil {\n\t\treturn nil, false\n\t}\n\treturn doc.Regions, true\n}","file":"cmd/provenance/evidence_run.go","name":"sedumRegions"}}
        func sedumRegions(r *repo, id string) ([]evidence.Region, bool) {
        	gen := filepath.Join(r.Root, "generators")
        	if _, err := os.Stat(gen); err != nil {
        		empty, err := os.MkdirTemp("", "provenance-nogenerators-")
        		if err != nil {
        			return nil, false
        		}
        		defer os.RemoveAll(empty)
        		gen = empty
        	}
        	bin := os.Getenv("SEDUM_BIN")
        	if bin == "" {
        		bin = "sedum"
        	}
        	c := exec.Command(bin, "regions", "--json", "--generators", gen, "--records", filepath.Join(r.Root, r.Config.Dir), "--record", id)
        	c.Dir = r.Root
        	out, err := c.Output()
        	if err != nil {
        		return nil, false
        	}
        	var doc struct {
        		Regions []evidence.Region `json:"regions"`
        	}
        	if json.Unmarshal(out, &doc) != nil {
        		return nil, false
        	}
        	return doc.Regions, true
        }
    - setFunction name behindSet, code exactly:
        // /sedum:setFunction
        // sedum:setFunction {"tier":"owned","record":"prov-2026-dce50c89","gen":"sha256:b6d25ad8c4f9ce771570ea4cf6baa2ce4c798ca8b461a87c008566a5eba3f77c","pkg":"sha256:6589611adfb6618a7920e43f951a79901428192ea95c1084fde9f222aecd9537","kwargs":{"code":"func behindSet(r *repo) map[string]bool {\n\tset := map[string]bool{}\n\tfound, err := stale.Find(r.Store)\n\tif err != nil {\n\t\treturn set\n\t}\n\tfor _, f := range found {\n\t\tif f.Kind != stale.Unknown {\n\t\t\tset[f.ID] = true\n\t\t}\n\t}\n\treturn set\n}","file":"cmd/provenance/evidence_run.go","name":"behindSet"}}
        func behindSet(r *repo) map[string]bool {
        	set := map[string]bool{}
        	found, err := stale.Find(r.Store)
        	if err != nil {
        		return set
        	}
        	for _, f := range found {
        		if f.Kind != stale.Unknown {
        			set[f.ID] = true
        		}
        	}
        	return set
        }
    - setFunction name currentEvidence, code exactly:
        // /sedum:setFunction
        // sedum:setFunction {"tier":"owned","record":"prov-2026-dce50c89","gen":"sha256:b6d25ad8c4f9ce771570ea4cf6baa2ce4c798ca8b461a87c008566a5eba3f77c","pkg":"sha256:6589611adfb6618a7920e43f951a79901428192ea95c1084fde9f222aecd9537","kwargs":{"code":"func currentEvidence(r *repo, rec *record.Record, behind map[string]bool) evidence.Current {\n\tregions, ok := sedumRegions(r, rec.ID)\n\tcur := evidence.CurrentFor(rec, r.Store.Specs(), regions)\n\tif !ok {\n\t\tcur.CodeHash = \"\"\n\t}\n\tcur.Behind = behind[rec.ID]\n\treturn cur\n}","file":"cmd/provenance/evidence_run.go","name":"currentEvidence"}}
        func currentEvidence(r *repo, rec *record.Record, behind map[string]bool) evidence.Current {
        	regions, ok := sedumRegions(r, rec.ID)
        	cur := evidence.CurrentFor(rec, r.Store.Specs(), regions)
        	if !ok {
        		cur.CodeHash = ""
        	}
        	cur.Behind = behind[rec.ID]
        	return cur
        }
    - setFunction name evidenceFiles, code exactly:
        // /sedum:setFunction
        // sedum:setFunction {"tier":"owned","record":"prov-2026-dce50c89","gen":"sha256:b6d25ad8c4f9ce771570ea4cf6baa2ce4c798ca8b461a87c008566a5eba3f77c","pkg":"sha256:6589611adfb6618a7920e43f951a79901428192ea95c1084fde9f222aecd9537","kwargs":{"code":"func evidenceFiles(r *repo, id string) map[string]bool {\n\tm := map[string]bool{}\n\tfiles, _ := filepath.Glob(filepath.Join(r.Root, r.Config.Dir, \".evidence\", id, \"*\"))\n\tfor _, f := range files {\n\t\tm[f] = true\n\t}\n\treturn m\n}","file":"cmd/provenance/evidence_run.go","name":"evidenceFiles"}}
        func evidenceFiles(r *repo, id string) map[string]bool {
        	m := map[string]bool{}
        	files, _ := filepath.Glob(filepath.Join(r.Root, r.Config.Dir, ".evidence", id, "*"))
        	for _, f := range files {
