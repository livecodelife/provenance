intent: |-
  Evidence helpers and check --evidence: Logic, cmd/provenance/evidence_run.go (go package, package main). The code hash is never obtained: it stays unknown and does not fail the check. The human check --evidence output has no hint or summary lines about unknown code hashes; the JSON and SARIF outputs do not change. Imports, each its own addImport, exactly these: encoding/json, fmt, io, path/filepath, time, github.com/spf13/cobra, github.com/livecodelife/provenance/evidence, github.com/livecodelife/provenance/record, github.com/livecodelife/provenance/stale.

  Declarations, in this order, each exactly one set* call whose code kwarg is the code below verbatim (gofmt-formatted, comments kept). Do not alter, reorder or add anything.

    - setType name evidenceRow, code exactly:
        type evidenceRow struct {
        	ID      string   `json:"id"`
        	Version int      `json:"version"`
        	State   string   `json:"state"`
        	Passed  bool     `json:"passed"`
        	Reasons []string `json:"reasons,omitempty"`
        }
    - setFunction name behindSet, code exactly:
        func behindSet(r *repo) map[string]bool {
        	set := map[string]bool{}
        	shared, _ := loadShared(r)
        	found, err := stale.FindShared(r.Store, shared)
        	if err != nil {
        		return set
        	}
        	for _, f := range found {
        		if f.Kind != stale.Unknown {
        			set[f.ID] = true
        		}
        	}
        	return set
        }
    - setFunction name currentEvidence, code exactly:
        func currentEvidence(r *repo, rec *record.Record, behind map[string]bool) evidence.Current {
        	cur := evidence.CurrentFor(rec, r.Store.Specs(), nil)
        	cur.CodeHash = ""
        	cur.Behind = behind[rec.ID]
        	return cur
        }
    - setFunction name evidenceFiles, code exactly:
        func evidenceFiles(r *repo, id string) map[string]bool {
        	m := map[string]bool{}
        	files, _ := filepath.Glob(filepath.Join(r.Root, r.Config.Dir, ".evidence", id, "*"))
        	for _, f := range files {
        		m[f] = true
        	}
        	return m
        }
    - setFunction name recordEvidence, code exactly:
        func recordEvidence(r *repo, rec *record.Record, passed bool) ([]string, error) {
        	before := evidenceFiles(r, rec.ID)
        	cur := currentEvidence(r, rec, behindSet(r))
        	e := evidence.New(rec, cur, passed, time.Now().UTC().Format(time.RFC3339), "provenance complete")
        	if err := (&evidence.Store{Root: r.Root, Dir: r.Config.Dir}).Append(e); err != nil {
        		return nil, err
        	}
        	var added []string
        	for f := range evidenceFiles(r, rec.ID) {
        		if !before[f] {
        			added = append(added, f)
        		}
        	}
        	return added, nil
        }
    - setFunction name checkEvidence, code exactly:
        func checkEvidence(r *repo) ([]evidenceRow, error) {
        	ids, err := r.Store.List()
        	if err != nil {
        		return nil, err
        	}
        	behind := behindSet(r)
        	store := &evidence.Store{Root: r.Root, Dir: r.Config.Dir}
        	rows := []evidenceRow{}
        	for _, id := range ids {
        		rec, _, err := r.Store.Load(id)
        		if err != nil {
        			return nil, err
        		}
        		if rec.Status != record.StatusImplemented {
        			continue
        		}
        		v, err := store.Status(rec, currentEvidence(r, rec, behind))
        		if err != nil {
        			return nil, err
        		}
        		rows = append(rows, evidenceRow{ID: rec.ID, Version: rec.Version, State: string(v.State), Passed: v.Passed, Reasons: v.Reasons})
        	}
        	return rows, nil
        }
    - setFunction name evidenceFailing, code exactly:
        func evidenceFailing(row evidenceRow) bool {
        	return row.State == string(evidence.Stale) || (row.State != string(evidence.Missing) && !row.Passed)
        }
    - setFunction name printEvidence, code exactly:
        func printEvidence(out io.Writer, rows []evidenceRow) {
        	fmt.Fprint(out, "\nEVIDENCE\n\n")
        	counts := map[string]int{}
        	for _, row := range rows {
        		counts[row.State]++
        		why := ""
        		if len(row.Reasons) > 0 {
        			why = fmt.Sprintf("%v", row.Reasons)
        		}
        		if row.State != string(evidence.Missing) && !row.Passed {
        			why = "specs failed " + why
        		}
        		fmt.Fprintf(out, "  %-22s %-8s %s\n", fmt.Sprintf("%s@%d", row.ID, row.Version), row.State, why)
        	}
        	fmt.Fprintf(out, "\n  %d fresh, %d stale, %d unknown, %d missing\n", counts["fresh"], counts["stale"], counts["unknown"], counts["missing"])
        	fmt.Fprint(out, "\n")
        }
    - setFunction name runCheckEvidence, code exactly:
        func runCheckEvidence(out io.Writer, cmd *cobra.Command, r *repo) error {
        	rows, err := checkEvidence(r)
        	if err != nil {
        		return err
        	}
        	asJSON, _ := cmd.Flags().GetBool("json")
        	if asJSON {
        		enc := json.NewEncoder(out)
        		enc.SetIndent("", "  ")
        		if err := enc.Encode(map[string]any{"evidence": rows}); err != nil {
        			return err
        		}
        	} else {
        		printEvidence(out, rows)
        	}
        	bad := 0
        	for _, row := range rows {
        		if evidenceFailing(row) {
        			bad++
        		}
        	}
        	if bad > 0 {
        		return fmt.Errorf("%d records have stale or failing evidence", bad)
        	}
        	return nil
        }
