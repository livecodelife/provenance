    - setFunction name recordEvidence, code exactly:
        // /sedum:setFunction
        // sedum:setFunction {"tier":"owned","record":"prov-2026-dce50c89","gen":"sha256:b6d25ad8c4f9ce771570ea4cf6baa2ce4c798ca8b461a87c008566a5eba3f77c","pkg":"sha256:6589611adfb6618a7920e43f951a79901428192ea95c1084fde9f222aecd9537","kwargs":{"code":"func recordEvidence(r *repo, rec *record.Record, passed bool) ([]string, error) {\n\tbefore := evidenceFiles(r, rec.ID)\n\tcur := currentEvidence(r, rec, behindSet(r))\n\te := evidence.New(rec, cur, passed, time.Now().UTC().Format(time.RFC3339), \"provenance complete\")\n\tif err := (&evidence.Store{Root: r.Root, Dir: r.Config.Dir}).Append(e); err != nil {\n\t\treturn nil, err\n\t}\n\tvar added []string\n\tfor f := range evidenceFiles(r, rec.ID) {\n\t\tif !before[f] {\n\t\t\tadded = append(added, f)\n\t\t}\n\t}\n\treturn added, nil\n}","file":"cmd/provenance/evidence_run.go","name":"recordEvidence"}}
        func recordEvidence(r *repo, rec *record.Record, passed bool) ([]string, error) {
        	before := evidenceFiles(r, rec.ID)
        	cur := currentEvidence(r, rec, behindSet(r))
        	e := evidence.New(rec, cur, passed, time.Now().UTC().Format(time.RFC3339), "provenance complete")
        	if err := (&evidence.Store{Root: r.Root, Dir: r.Config.Dir}).Append(e); err != nil {
        		return nil, err
        	}
        	var added []string
        	for f := range evidenceFiles(r, rec.ID) {
        		if !before[f] {
        			added = append(added, f)
        		}
        	}
        	return added, nil
        }
    - setFunction name checkEvidence, code exactly:
        // /sedum:setFunction
        // sedum:setFunction {"tier":"owned","record":"prov-2026-dce50c89","gen":"sha256:b6d25ad8c4f9ce771570ea4cf6baa2ce4c798ca8b461a87c008566a5eba3f77c","pkg":"sha256:6589611adfb6618a7920e43f951a79901428192ea95c1084fde9f222aecd9537","kwargs":{"code":"func checkEvidence(r *repo) ([]evidenceRow, error) {\n\tids, err := r.Store.List()\n\tif err != nil {\n\t\treturn nil, err\n\t}\n\tbehind := behindSet(r)\n\tstore := &evidence.Store{Root: r.Root, Dir: r.Config.Dir}\n\trows := []evidenceRow{}\n\tfor _, id := range ids {\n\t\trec, _, err := r.Store.Load(id)\n\t\tif err != nil {\n\t\t\treturn nil, err\n\t\t}\n\t\tif rec.Status != record.StatusImplemented {\n\t\t\tcontinue\n\t\t}\n\t\tv, err := store.Status(rec, currentEvidence(r, rec, behind))\n\t\tif err != nil {\n\t\t\treturn nil, err\n\t\t}\n\t\trows = append(rows, evidenceRow{ID: rec.ID, Version: rec.Version, State: string(v.State), Passed: v.Passed, Reasons: v.Reasons})\n\t}\n\treturn rows, nil\n}","file":"cmd/provenance/evidence_run.go","name":"checkEvidence"}}
        func checkEvidence(r *repo) ([]evidenceRow, error) {
        	ids, err := r.Store.List()
        	if err != nil {
        		return nil, err
        	}
        	behind := behindSet(r)
        	store := &evidence.Store{Root: r.Root, Dir: r.Config.Dir}
        	rows := []evidenceRow{}
        	for _, id := range ids {
        		rec, _, err := r.Store.Load(id)
        		if err != nil {
        			return nil, err
        		}
        		if rec.Status != record.StatusImplemented {
        			continue
        		}
        		v, err := store.Status(rec, currentEvidence(r, rec, behind))
        		if err != nil {
        			return nil, err
        		}
        		rows = append(rows, evidenceRow{ID: rec.ID, Version: rec.Version, State: string(v.State), Passed: v.Passed, Reasons: v.Reasons})
        	}
        	return rows, nil
        }
    - setFunction name evidenceFailing, code exactly:
        // /sedum:setFunction
        // sedum:setFunction {"tier":"owned","record":"prov-2026-dce50c89","gen":"sha256:b6d25ad8c4f9ce771570ea4cf6baa2ce4c798ca8b461a87c008566a5eba3f77c","pkg":"sha256:6589611adfb6618a7920e43f951a79901428192ea95c1084fde9f222aecd9537","kwargs":{"code":"func evidenceFailing(row evidenceRow) bool {\n\treturn row.State == string(evidence.Stale) || (row.State != string(evidence.Missing) && !row.Passed)\n}","file":"cmd/provenance/evidence_run.go","name":"evidenceFailing"}}
        func evidenceFailing(row evidenceRow) bool {
        	return row.State == string(evidence.Stale) || (row.State != string(evidence.Missing) && !row.Passed)
        }
    - setFunction name printEvidence, code exactly:
        // /sedum:setFunction
        // sedum:setFunction {"tier":"owned","record":"prov-2026-dce50c89","gen":"sha256:b6d25ad8c4f9ce771570ea4cf6baa2ce4c798ca8b461a87c008566a5eba3f77c","pkg":"sha256:6589611adfb6618a7920e43f951a79901428192ea95c1084fde9f222aecd9537","kwargs":{"code":"func printEvidence(out io.Writer, rows []evidenceRow) {\n\tfmt.Fprint(out, \"\\nEVIDENCE\\n\\n\")\n\tcounts := map[string]int{}\n\tfor _, row := range rows {\n\t\tcounts[row.State]++\n\t\twhy := \"\"\n\t\tif len(row.Reasons) > 0 {\n\t\t\twhy = fmt.Sprintf(\"%v\", row.Reasons)\n\t\t}\n\t\tif row.State != string(evidence.Missing) && !row.Passed {\n\t\t\twhy = \"specs failed \" + why\n\t\t}\n\t\tfmt.Fprintf(out, \"  %-22s %-8s %s\\n\", fmt.Sprintf(\"%s@%d\", row.ID, row.Version), row.State, why)\n\t}\n\tfmt.Fprintf(out, \"\\n  %d fresh, %d stale, %d unknown, %d missing\\n\\n\", counts[\"fresh\"], counts[\"stale\"], counts[\"unknown\"], counts[\"missing\"])\n}","file":"cmd/provenance/evidence_run.go","name":"printEvidence"}}
        func printEvidence(out io.Writer, rows []evidenceRow) {
        	fmt.Fprint(out, "\nEVIDENCE\n\n")
        	counts := map[string]int{}
        	for _, row := range rows {
        		counts[row.State]++
        		why := ""
        		if len(row.Reasons) > 0 {
        			why = fmt.Sprintf("%v", row.Reasons)
        		}
        		if row.State != string(evidence.Missing) && !row.Passed {
        			why = "specs failed " + why
        		}
        		fmt.Fprintf(out, "  %-22s %-8s %s\n", fmt.Sprintf("%s@%d", row.ID, row.Version), row.State, why)
        	}
        	fmt.Fprintf(out, "\n  %d fresh, %d stale, %d unknown, %d missing\n\n", counts["fresh"], counts["stale"], counts["unknown"], counts["missing"])
        }
    - setFunction name runCheckEvidence, code exactly:
        // /sedum:setFunction
        // sedum:setFunction {"tier":"owned","record":"prov-2026-dce50c89","gen":"sha256:b6d25ad8c4f9ce771570ea4cf6baa2ce4c798ca8b461a87c008566a5eba3f77c","pkg":"sha256:6589611adfb6618a7920e43f951a79901428192ea95c1084fde9f222aecd9537","kwargs":{"code":"func runCheckEvidence(out io.Writer, cmd *cobra.Command, r *repo) error {\n\trows, err := checkEvidence(r)\n\tif err != nil {\n\t\treturn err\n\t}\n\tasJSON, _ := cmd.Flags().GetBool(\"json\")\n\tif asJSON {\n\t\tenc := json.NewEncoder(out)\n\t\tenc.SetIndent(\"\", \"  \")\n\t\tif err := enc.Encode(map[string]any{\"evidence\": rows}); err != nil {\n\t\t\treturn err\n\t\t}\n\t} else {\n\t\tprintEvidence(out, rows)\n\t}\n\tbad := 0\n\tfor _, row := range rows {\n\t\tif evidenceFailing(row) {\n\t\t\tbad++\n\t\t}\n\t}\n\tif bad > 0 {\n\t\treturn fmt.Errorf(\"%d records have stale or failing evidence\", bad)\n\t}\n\treturn nil\n}","file":"cmd/provenance/evidence_run.go","name":"runCheckEvidence"}}
        func runCheckEvidence(out io.Writer, cmd *cobra.Command, r *repo) error {
        	rows, err := checkEvidence(r)
        	if err != nil {
        		return err
        	}
        	asJSON, _ := cmd.Flags().GetBool("json")
        	if asJSON {
        		enc := json.NewEncoder(out)
        		enc.SetIndent("", "  ")
        		if err := enc.Encode(map[string]any{"evidence": rows}); err != nil {
        			return err
        		}
        	} else {
        		printEvidence(out, rows)
        	}
        	bad := 0
        	for _, row := range rows {
        		if evidenceFailing(row) {
        			bad++
        		}
        	}
        	if bad > 0 {
        		return fmt.Errorf("%d records have stale or failing evidence", bad)
        	}
        	return nil
        }
