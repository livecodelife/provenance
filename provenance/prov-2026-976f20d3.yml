intent: the openBrowser function starts the operating system's URL opener for a URL and reports whether it started.
constraints:
  - The function takes one string parameter, url, and returns a bool.
  - The operating system is read from runtime.GOOS, from the runtime package.
  - Commands are built with exec.Command from the os/exec package.
  - Environment variables are read with os.Getenv from the os package.
  - On darwin the function builds the command open with the URL as its only argument.
  - On windows the function builds the command rundll32 with the arguments url.dll,FileProtocolHandler and the URL.
  - On every other operating system the function returns false without starting anything when both the DISPLAY and WAYLAND_DISPLAY environment variables are empty.
  - On every other operating system with a display set, the function builds the command xdg-open with the URL as its only argument.
  - The function starts the command without waiting for it to finish.
  - The function returns true when the command started.
  - The function returns false when the command failed to start.
  - The function adds no imports.
