  - Field Store is of type Store, an interface type defined in package auth.
  - Field Client is a pointer to Client, a struct type defined in package auth.
  - Field LockPath is a string, the path of the lock file; an empty value means refreshes take no lock.
  - Field Now is a function with no parameters returning time.Time; when it is nil the real clock is used.
  - The fields carry no struct tags.
  - time.Time comes from the standard-library package time.
  - This unit declares only the type and defines no methods.
  - This unit does not change the file's imports.
