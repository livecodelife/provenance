title: auth.tokenErr
type: imprint
status: open
version: 1
reason: ""
created_at: "2026-10-21"
author: calebcowen@gmail.com
intent: tokenErr turns a 401 failure into ErrUnauthorized and passes any other error through.
constraints:
  - tokenErr is an unexported package-level function taking one parameter err (error) and returning an error.
  - If err is, or wraps, an OAuthError (found via errors.As; defined elsewhere in package auth, with fields Code string, Description string, Status int and RetryAfter time.Duration) whose Status is 401, it returns ErrUnauthorized.
  - Any other err is returned unchanged.
  - A nil err is returned as nil.
  - ErrUnauthorized is an error value defined elsewhere in package auth.
  - This function does not change the file's imports.
  - errors.As comes from package errors.
  - http.StatusUnauthorized comes from package net/http.
affected_scope:
  - auth/client.go
