author: calebcowen@gmail.com
intent: The Problem type describes one section of an edited document that cannot be applied, or that is in conflict.
constraints:
  - The type is exported from package document and needs no imports.
  - Problem has the field Kind, a string, holding the name of the rule that produced the problem.
  - Problem has the field ID, a string, holding the anchored record id or an empty string.
  - Problem has the field Line, an int, holding the heading's line number.
  - Problem has the fields AnchoredVersion and CurrentVersion, both ints.
  - Problem has the field Message, a string, holding a one-line description.
