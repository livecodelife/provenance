intent: |-
  The Go logic of record/canonical_int.go (go package, package record): how the canonical encoder writes an integer (docs/HASHING.md section 5). Imports, each its own addImport, exactly these, in this order: bytes, strconv.

  Declarations, in this order, each exactly one set* call whose code kwarg is the code below verbatim (gofmt-formatted, comments kept). Do not alter, reorder or add anything.

    - setFunction name writeInt, code exactly:
        // writeInt writes a signed integer as bare base-10 digits: no plus sign, no
        // leading zeros, negatives as -N (docs/HASHING.md section 5).
        func writeInt(b *bytes.Buffer, v int64) {
        	b.WriteString(strconv.FormatInt(v, 10))
        }
    - setFunction name writeUint, code exactly:
        // writeUint writes an unsigned integer as bare base-10 digits.
        func writeUint(b *bytes.Buffer, v uint64) {
        	b.WriteString(strconv.FormatUint(v, 10))
        }
