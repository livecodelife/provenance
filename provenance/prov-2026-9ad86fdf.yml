title: checkStaged
type: imprint
status: implemented
version: 3
reason: Split compound constraint, spell parameter types
created_at: "2026-10-21"
author: calebcowen@gmail.com
intent: the checkStaged function checks the staged change against the records for a commit message.
constraints:
  - The function receives a pointer to a repo and the commit message string, in that order
  - The function returns a slice of violation and an error
  - 'The function calls stagedPaths (parameter: a pointer to a repo; returns a slice of strings and an error)'
  - When stagedPaths fails, the function returns a nil slice and the error
  - 'The function calls stagedTree (parameter: a pointer to a repo; returns a path string, a cleanup function and an error)'
  - When stagedTree fails, the function returns a nil slice and the error
  - The function calls the cleanup function when it returns, whether or not later steps fail
  - The function returns checkChange's slice and error
  - The repo parameter is a pointer to the repo struct defined in common_run.go of package main
  - The function adds no imports
  - 'Before any other step the function calls pendingMergeParents (defined in merge_exempt_run.go of package main; parameter: a pointer to a repo; returns a slice of strings, the parent ids of the merge in progress, empty when none)'
  - When pendingMergeParents returns exactly two entries the function runs git write-tree through the repo git method (defined in common_run.go; variadic strings; returns trimmed standard output and an error) to get the staged tree id
  - When git write-tree fails the function continues with the remaining steps and does not fail
  - 'When write-tree succeeds the function calls mergeIsAutomatic (defined in merge_exempt_run.go of package main; parameters in order: a pointer to a repo, a tree id string, a slice of parent id strings; returns a bool) with the repo, the staged tree id and the parents'
  - When pendingMergeParents returns any other number of entries or mergeIsAutomatic returns false the function continues with the remaining steps
  - 'The function calls checkChange (parameters in order: a pointer to a repo, the base revision as a string, the staged tree path as a string, the staged paths as a slice of strings, the message as a string; returns a slice of violation and an error) with the repo, the base revision "HEAD", the staged tree path, the staged paths and the message'
  - When mergeIsAutomatic returns true the function returns a nil slice and a nil error
  - When mergeIsAutomatic returns true the function does not call stagedPaths, stagedTree or checkChange
