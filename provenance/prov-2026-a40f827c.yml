intent: PublishPlan lists what a publish would write.
constraints:
  - PublishPlan is an exported struct type with four exported fields, declared in the order Items, UpToDate, Problems, Skipped.
  - Field Items is a slice of PublishItem values, not pointers.
  - Field UpToDate is a slice of strings, the ids of the records the server already has in full.
  - Field Problems is a slice of PublishProblem values, the records that were skipped while the others are still planned.
  - Field Skipped is a slice of strings, one message for each record with nothing to publish yet.
  - The fields carry no struct tags.
  - This unit declares only the type; its methods are defined by other units.
  - PublishItem and PublishProblem are struct types defined elsewhere in package remote.
  - This unit adds no imports to the file.
