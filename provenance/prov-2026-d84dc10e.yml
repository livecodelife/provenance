intent: "The provenance compile command (part 4 of 42c95515), in two files: it rebuilds the version manifest (.provenance/versions.jsonl) from the latest snapshot of every record, the repair path PROV026 points at. Idempotent.\n\nWiring, cmd/provenance/compile_cmd.go (cobra package): a top-level command, use \"compile\", short \"Rebuild the version manifest from the record snapshots\", arity none, no flags.\n\nLogic, cmd/provenance/compile_run.go (go package, package main). Prints \"Version manifest is up to date (N records)\" when the file already equals the rebuilt bytes, otherwise rewrites it with r.writeManifest and prints \"Version manifest compiled (N records)\". \nImports, each its own addImport, exactly these: bytes, fmt, io, os, path/filepath, github.com/spf13/cobra, github.com/livecodelife/provenance/record.\n\nDeclarations, in this order, each exactly one set* call whose code kwarg is the code below verbatim (gofmt-formatted, comments kept). Do not alter, reorder or add anything.\n\n  - setFunction name runCompile, code exactly:\n      func runCompile(out io.Writer, cmd *cobra.Command, args []string) error {\n      \tr, err := openRepo(cmd)\n      \tif err != nil {\n      \t\treturn err\n      \t}\n      \tlines, err := record.BuildManifest(r.Store)\n      \tif err != nil {\n      \t\treturn err\n      \t}\n      \thave, _ := os.ReadFile(filepath.Join(r.Root, manifestPath))\n      \tif bytes.Equal(have, record.MarshalManifest(lines)) {\n      \t\tfmt.Fprintf(out, \"\\n✓ Version manifest is up to date (%d records)\\n\\n\", len(lines))\n      \t\treturn nil\n      \t}\n      \tif err := r.writeManifest(); err != nil {\n      \t\treturn err\n      \t}\n      \tfmt.Fprintf(out, \"\\n✓ Version manifest compiled (%d records)\\n\\n\", len(lines))\n      \treturn nil\n      }"
