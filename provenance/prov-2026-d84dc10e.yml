intent: "The provenance compile command (part 4 of 42c95515), in four files: it rebuilds the version manifest (.provenance/versions.jsonl) from the latest snapshot of every record, the repair path PROV026 points at. Idempotent.\n\nWiring, cmd/provenance/compile_cmd.go (cobra package): a top-level command, use \"compile\", short \"Rebuild the version manifest from the record snapshots\", arity none, one bool flag (addFlag:bool, flag \"check\", usage \"Fail, changing nothing, when the manifest is out of date\").\n\nLogic, cmd/provenance/compile_run.go (go package, package main). Prints \"Version manifest is up to date (N records)\" when the file already equals the rebuilt bytes, otherwise rewrites it with r.writeManifest and prints \"Version manifest compiled (N records)\". \nImports, each its own addImport, exactly these: bytes, errors, fmt, io, os, path/filepath, github.com/spf13/cobra, github.com/livecodelife/provenance/record.\n\nDeclarations, in this order, each exactly one set* call whose code kwarg is the code below verbatim (gofmt-formatted, comments kept). Do not alter, reorder or add anything.\n\n  - setFunction name runCompile, code exactly:\n      func runCompile(out io.Writer, cmd *cobra.Command, args []string) error {\n      \tr, err := openRepo(cmd)\n      \tif err != nil {\n      \t\treturn err\n      \t}\n      \tlines, err := record.BuildManifest(r.Store)\n      \tif err != nil {\n      \t\treturn err\n      \t}\n      \thave, _ := os.ReadFile(filepath.Join(r.Root, manifestPath))\n      \tif bytes.Equal(have, record.MarshalManifest(lines)) {\n      \t\tfmt.Fprintf(out, \"\\n✓ Version manifest is up to date (%d records)\\n\\n\", len(lines))\n      \t\treturn nil\n      \t}\n      \tif check, _ := cmd.Flags().GetBool(\"check\"); check {\n      \t\tfmt.Fprint(out, \"\\n✗ Version manifest is out of date. It is derived data; fix it with:\\n\\n  provenance compile\\n  git add .provenance/versions.jsonl\\n  git commit -m \\\"Recompile version manifest\\\"\\n\\n\")\n      \t\treturn errors.New(\"version manifest is out of date\")\n      \t}\n      \tif err := r.writeManifest(); err != nil {\n      \t\treturn err\n      \t}\n      \tfmt.Fprintf(out, \"\\n✓ Version manifest compiled (%d records)\\n\\n\", len(lines))\n      \treturn nil\n      }\n\nSecond command, merge-manifest, git's merge driver for the manifest (blueprint: a merge of two branches that both append to .provenance/versions.jsonl must not conflict). Two more files and one registration.\n\nWiring, cmd/provenance/merge_manifest_cmd.go (cobra package): a top-level command, use \"merge-manifest\", short \"Merge three versions of the version manifest (git merge driver: BASE OURS THEIRS)\", arity any (runMergeManifest checks for exactly three), no flags. Registered in cmd/provenance/main.go with registerCommand like compile.\n\nLogic, cmd/provenance/merge_manifest_run.go (go package, package main). Imports, each its own addImport, exactly these: errors, fmt, io, os, sort, github.com/spf13/cobra, github.com/livecodelife/provenance/record. Declarations, in this order, each exactly one setFunction call whose code kwarg is the code below verbatim (gofmt-formatted, comments kept). Do not alter, reorder or add anything.\n\n  - setFunction name describeManifestLine, code exactly:\n      // describeManifestLine words one side of a conflicting manifest entry.\n      func describeManifestLine(l record.ManifestLine, present bool) string {\n      \tif !present {\n      \t\treturn \"removed\"\n      \t}\n      \treturn fmt.Sprintf(\"version %d, %s\", l.Version, l.ContentHash)\n      }\n\n  - setFunction name mergeManifests, code exactly:\n      // mergeManifests merges two manifests that both descend from base, one line\n      // per record id. A record changed on one side takes that side's line; changed\n      // on both, the higher version wins, and the same version with different content\n      // (or a removal against a change) is a conflict.\n      func mergeManifests(base, ours, theirs []record.ManifestLine) ([]record.ManifestLine, error) {\n      \tindex := func(ls []record.ManifestLine) map[string]record.ManifestLine {\n      \t\tm := make(map[string]record.ManifestLine, len(ls))\n      \t\tfor _, l := range ls {\n      \t\t\tm[l.ID] = l\n      \t\t}\n      \t\treturn m\n      \t}\n      \tb, o, t := index(base), index(ours), index(theirs)\n      \tids := map[string]bool{}\n      \tfor _, m := range []map[string]record.ManifestLine{b, o, t} {\n      \t\tfor id := range m {\n      \t\t\tids[id] = true\n      \t\t}\n      \t}\n      \tvar out []record.ManifestLine\n      \tfor id := range ids {\n      \t\tbl, bok := b[id]\n      \t\tol, ook := o[id]\n      \t\ttl, tok := t[id]\n      \t\tvar pick record.ManifestLine\n      \t\tvar ok bool\n      \t\tswitch {\n      \t\tcase ook == tok && ol == tl:\n      \t\t\tpick, ok = ol, ook\n      \t\tcase ook == bok && ol == bl:\n      \t\t\tpick, ok = tl, tok\n      \t\tcase tok == bok && tl == bl:\n      \t\t\tpick, ok = ol, ook\n      \t\tcase ook && tok && ol.Version != tl.Version:\n      \t\t\tpick, ok = ol, true\n      \t\t\tif tl.Version > ol.Version {\n      \t\t\t\tpick = tl\n      \t\t\t}\n      \t\tdefault:\n      \t\t\treturn nil, fmt.Errorf(\"%s: both branches changed it (ours: %s; theirs: %s); resolve the record files, then run provenance compile\", id, describeManifestLine(ol, ook), describeManifestLine(tl, tok))\n      \t\t}\n      \t\tif ok {\n      \t\t\tout = append(out, pick)\n      \t\t}\n      \t}\n      \tsort.Slice(out, func(i, j int) bool { return out[i].ID < out[j].ID })\n      \treturn out, nil\n      }\n\n  - setFunction name runMergeManifest, code exactly:\n      // runMergeManifest is git's merge driver for the version manifest: args are\n      // the base, ours and theirs files, and the merged manifest replaces ours.\n      func runMergeManifest(out io.Writer, cmd *cobra.Command, args []string) error {\n      \tif len(args) != 3 {\n      \t\treturn errors.New(\"usage: provenance merge-manifest BASE OURS THEIRS\")\n      \t}\n      \tvar sets [3][]record.ManifestLine\n      \tfor i, p := range args {\n      \t\tdata, err := os.ReadFile(p)\n      \t\tif err != nil {\n      \t\t\treturn err\n      \t\t}\n      \t\tlines, err := record.ParseManifest(data)\n      \t\tif err != nil {\n      \t\t\treturn fmt.Errorf(\"%s: %w\", p, err)\n      \t\t}\n      \t\tsets[i] = lines\n      \t}\n      \tmerged, err := mergeManifests(sets[0], sets[1], sets[2])\n      \tif err != nil {\n      \t\treturn err\n      \t}\n      \treturn os.WriteFile(args[1], record.MarshalManifest(merged), 0o644)\n      }"
