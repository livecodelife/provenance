intent: The parseAnchor function reads the record id and version from an anchor line.
constraints:
  - The function is in package document and adds no imports; it uses strconv and strings from the imports of the file.
  - parseAnchor takes a line string and returns the id string, the version int and an ok bool.
  - parseAnchor reports ok only when the line, trimmed, has the form <!-- provenance:ID@VERSION --> with exactly one space after the opening and before the closing comment marker.
  - parseAnchor splits the ID from the VERSION at the last at-sign.
  - parseAnchor reports ok only when the ID is non-empty and has no whitespace.
  - parseAnchor reports ok only when the VERSION is one or more ASCII digits.
  - parseAnchor does not report ok when the VERSION has a leading zero.
  - parseAnchor does not report ok when the VERSION has a value of zero.
  - parseAnchor does not report ok when the VERSION does not fit in an int.
