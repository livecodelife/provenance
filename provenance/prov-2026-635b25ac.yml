reason: Describe the login command wiring as behaviour, one requirement per constraint
created_at: "2026-10-16"
author: calebcowen@gmail.com
intent: the login command is a cobra command that signs the user in by calling runLogin.
constraints:
  - The function newLoginCmd takes no arguments.
  - The function newLoginCmd returns a pointer to a cobra command.
  - The command use text is "login".
  - The command short text is "Sign in to Provisio with a device code".
  - The command accepts no positional arguments.
  - The command's run function calls runLogin with the command's output writer, the command and the arguments.
  - The command's run function returns the error from runLogin.
  - The command has a boolean flag no-browser, default false, with usage text "Only print the verification URL and code; do not open a browser".
  - The command has a boolean flag with-token, default false, with usage text "Read a personal token (pvt_...) from stdin and store it instead of signing in".
  - The command has a string flag server, default empty, with usage text "Auth service URL (default $PROVISIO_AUTH_URL, else https://auth.provisio.dev)".
  - 'The command has a string flag provider, default empty, with usage text "Sign-in hint: provisio or bluesky (default provisio)".'
  - The command defines no subcommands.
  - newLoginCmd is registered on the root command in main.go, by calling the root command's AddCommand with the result of newLoginCmd().
  - The file imports github.com/spf13/cobra as a value.
  - The file adds no other imports.
  - 'runLogin is defined in login_run.go in package main with parameters in order: an io.Writer, a pointer to a cobra command, and a slice of strings; it returns an error.'
