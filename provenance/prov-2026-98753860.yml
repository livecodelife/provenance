intent: runImport appends the versions made on Provisio to the local records, rewrites the version manifest and reports what to commit, refusing any record whose local history moved past the remote base.
constraints:
  - 'runImport is an unexported function with three parameters in order: out (an io.Writer), cmd (a pointer to cobra.Command) and args (a slice of strings), and it returns an error.'
  - 'Step 1: read the boolean flag all from the command''s flags with GetBool, ignoring any error.'
  - 'Step 2: call openRepo with the command, a function defined elsewhere in package main taking a pointer to cobra.Command and returning a pointer to the repo type and an error.'
  - If openRepo fails, runImport returns that error unchanged.
  - 'Step 3: call recordIDs with the repo, the arguments and the all flag.'
  - recordIDs is a function defined elsewhere in package main with parameters r (pointer to repo), args (slice of strings) and all (bool), returning a slice of strings and an error.
  - If recordIDs fails, runImport returns that error unchanged.
  - 'Step 4: call apiClient, a function defined elsewhere in package main with no parameters returning a pointer to remote.Client and an error.'
  - If apiClient fails, runImport returns that error unchanged.
  - 'Step 5: call remote.PlanImport with the command''s context from cmd.Context(), the repo''s Store field, the record ids and the client.'
  - remote.PlanImport takes a context.Context, a record store, a slice of strings and a pointer to remote.Client, and returns a pointer to remote.ImportPlan and an error.
  - If PlanImport fails, runImport returns that error unchanged.
  - remote.ImportPlan has the field Items, a slice of remote.ImportItem, and the field Refused, a slice of strings.
  - remote.ImportItem has the string field ID, the field Snaps, a slice of pointers to record.Snapshot, and the field Origins, a slice of strings parallel to Snaps.
  - record.Snapshot has the int field Version and the string fields Reason and Author.
  - The repo's Config field is a struct with the string field Dir, the records directory relative to the repository root.
  - 'Step 6: for each string in the plan''s Refused, call the repo''s fail method with the format Not imported: %s and that string.'
  - The repo's fail method is defined elsewhere in package main, takes a format string and any further arguments, and returns nothing.
  - 'Step 7a: when the plan has no Items and has Refused entries, return an error with the text of the number of refused records followed by record(s) refused.'
  - 'Step 7b: when the plan has no Items and no Refused entries, write a blank line and the line Nothing to import: every published version is already here. to out, then a further blank line, and return nil.'
  - In both of those cases no local record or manifest is changed.
  - 'Step 8: call remote.ApplyImport with the plan and the repo''s Store, which returns an error; return it unchanged on failure.'
  - 'Step 9: call the repo''s writeManifest method, which takes no parameters and returns an error; return it unchanged on failure.'
  - writeManifest is a method of the repo type defined elsewhere in package main.
  - 'Step 10: write to out a blank line, the line ✓ Imported: and a further blank line.'
  - 'Step 11: for each item, and for each of its snapshots in order, write a line of two spaces, the item''s ID, a space, the letter v and the snapshot''s Version converted with strconv.Itoa, two spaces, the snapshot''s Reason, two spaces, and in parentheses the snapshot''s Author, a comma, a space and the origin.'
  - The origin is the item's Origins entry at the snapshot's index; when it is the empty string the origin is the word git.
  - 'Step 12: write a blank line to out.'
  - Then write the line of two spaces, then Commit the changed record files, a comma and a space, the repo config's Dir followed by /.versions, a space, the word and, a space, the manifestPath constant followed by a full stop, then a newline.
  - 'For example, with Dir provenance the line is two spaces then: Commit the changed record files, provenance/.versions and .provenance/versions.jsonl.'
  - Then write one further blank line.
  - manifestPath is a string constant defined elsewhere in package main.
  - 'Step 13: when the plan has Refused entries, return an error with the text of the number of refused records followed by record(s) refused; otherwise return nil.'
  - Records that are not refused are imported even when others are refused.
  - runImport never merges a remote version into a record whose local history differs.
  - fmt.Errorf, fmt.Fprintln and fmt.Fprintf come from the standard-library package fmt.
  - io.Writer comes from the standard-library package io.
  - strconv.Itoa comes from the standard-library package strconv.
  - cobra.Command comes from the package github.com/spf13/cobra.
  - remote.PlanImport, remote.ApplyImport, remote.ImportPlan, remote.ImportItem and remote.Client come from the package github.com/livecodelife/provenance/remote.
  - record.Snapshot comes from the package github.com/livecodelife/provenance/record, used without importing the package by name.
  - The file imports, each as a value, the packages fmt, io, strconv, github.com/spf13/cobra and github.com/livecodelife/provenance/remote.
  - The file declares no other imports.
