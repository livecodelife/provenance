intent: the headHas function reports whether a path exists at a git revision.
constraints:
  - The function receives, in order, a pointer to a repo, a revision string base and a path string
  - The function returns a boolean
  - The function runs the repo's git method (variadic string arguments; returns trimmed standard output and an error) with cat-file, -e and the text base, a colon and the path
  - The function returns true when git reports no error and false otherwise
  - The repo parameter is a pointer to the repo struct defined in common_run.go of package main
  - The repo's git method takes a variadic list of string arguments, runs git in the repo root and returns the trimmed standard output as a string and an error
  - The function adds no imports
