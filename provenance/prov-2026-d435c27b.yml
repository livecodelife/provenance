id: prov-2026-d435c27b
title: provenance history command
status: draft
created_at: "2026-10-15"
author: calebcowen@gmail.com
intent: |
  The provenance history command: a top-level command, use "history [id]", short "List a record's versions with reasons and commits", arity max_one. Flags:
    - record (string): "Record to show (or give it as the argument)"
    - json (bool): "Print as JSON"
  No flag has a short form. No flag has a default value.

  Behaviour: Reads the snapshots: version, created_at, author, reason, fix, short content hash. Where git is present, each version lists the commits tagged [<id>@<n>]; commits tagged with the bare id or an alias are listed separately as untagged by version. A draft with no snapshot says so.
