id: prov-2026-1d62a0c9
title: stale judges parents in shared repos
type: blueprint
status: implemented
version: 1
reason: ""
created_at: "2026-10-16"
author: calebcowen@gmail.com
intent: 'provenance stale reports ''cannot be judged: parent is in shared repo X'' for every record whose implements_repo parent was synced, because stale.Find sees only the local store. Add stale.FindShared(store, shared map[string]*record.Record) that judges a shared parent like a local one: pinned below the shared parent''s version is Direct (and makes local descendants Transitive), unpinned is Unknown, and a parent absent from the cache stays Unknown with the existing ''parent is in shared repo X'' reason. stale.Find(store) keeps its signature and means FindShared(store, nil). The stale command passes the synced cache (loadShared) through the imprint prov-2026-f476b640''s staleFindings; graph, context and evidence keep calling Find.'
constraints:
  - Find(store) keeps its exact signature and results; FindShared(store, nil) equals it.
  - A shared parent in the cache is judged by the child's implements_version against the shared record's version; a parent not in the cache keeps the reason 'parent is in shared repo <name>'.
  - Local descendants of a child that is directly stale against a shared parent are Transitive, as for a local parent.
