intent: |-
  The provenance publish command (blueprint prov-2026-fe19dbf4, section 4), in three files.

  Wiring, cmd/provenance/publish_cmd.go (cobra package): a top-level command, use "publish [id...]", short "Publish records to Provisio (they become public on AT Proto)", arity any. Flags, none with a short form or default:
  - all (bool): "Publish every record"
  - yes (bool): "Confirm without asking (for scripts)"
  - plan (bool): "List what publishing would write, per record; writes nothing and asks nothing"
  - project (string): "AT URI of the Provisio project the records belong to"

  Behaviour is fixed by cmd/provenance/publish_test.go and cmd/provenance/m4_flow_test.go: it needs a session (exit status 3), shows exactly which versions become public and asks unless --yes (a non-terminal input without --yes refuses and writes nothing), a second run writes nothing. A published record the server has in full is still updated, head only and without a new version, when --project names another project than its head's, or its head's source has another repo or path (a new HEAD alone does not count); both are shown in the plan and the confirmation as "project → <uri>" and "source → <repo> <path>", and reported as "published  <id> head"; without --project the heads' project is left alone. --project is checked with checkProject before any request: it must be an AT URI the head lexicon's at-uri format accepts (the service answers 400 'Head does not match the lexicon' otherwise), and the error names --project and says why (placeholder such as <did>, space, query, fragment, trailing slash, non-ASCII, bad authority, bad collection, bad record key, too many segments, missing at://). Records the server has ahead, or whose shared version differs, are listed as skipped (with the way out) and the rest are still published; a skipped record makes the command exit non-zero after the summary. Every write carries the source (repo as the https URL of the origin remote, the record file's path, HEAD), or none with a note when there is no usable origin remote; a dirty tree is mentioned. --plan lists each record as unpublished, local ahead, up to date, server ahead or diverged with totals, and writes nothing; records whose id the service rejects (remote.ServerIDPattern, problem kind "invalid id") are listed first as "not publishable" with the reason, counted in their own "not publishable" total, not as diverged; publish skips them, publishes the rest and ends with the skipped-records error.

