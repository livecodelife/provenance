intent: |-
  The provenance publish command (blueprint prov-2026-fe19dbf4, section 4), in three files.

  Wiring, cmd/provenance/publish_cmd.go (cobra package): a top-level command, use "publish [id...]", short "Publish records to Provisio (they become public on AT Proto)", arity any. Flags, none with a short form or default:
  - all (bool): "Publish every record"
  - yes (bool): "Confirm without asking (for scripts)"
  - project (string): "AT URI of the Provisio project the records belong to"

  Behaviour is fixed by cmd/provenance/publish_test.go and cmd/provenance/m4_flow_test.go: it needs a session (exit status 3), shows exactly which versions become public and asks unless --yes (a non-terminal input without --yes refuses and writes nothing), a second run writes nothing.

  Logic, cmd/provenance/remote_run.go (shared helpers apiClient, confirm, recordIDs) and cmd/provenance/publish_run.go:

  File cmd/provenance/remote_run.go (go package, package main). Imports, each its own addImport, exactly these: bufio, context, fmt, io, os, strings, github.com/spf13/cobra, github.com/livecodelife/provenance/auth, github.com/livecodelife/provenance/remote.

