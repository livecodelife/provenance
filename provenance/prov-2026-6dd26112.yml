intent: The List method returns the ids of the caller's published records, sorted.
constraints:
  - List is an exported method with a pointer receiver of type Store.
  - List takes no parameters and returns a slice of strings and an error.
  - 'Step 1: call the ListRecords method of the receiver''s Client field with the result of the receiver''s ctx method, which returns a slice of Head and an error.'
  - ctx is a method of Store defined elsewhere in package remote, with no parameters, returning a context.Context.
  - If ListRecords fails, List returns a nil slice and that error unchanged.
  - 'Step 2: collect the ID field of each head.'
  - 'Step 3: sort the ids in ascending order with sort.Strings.'
  - 'Step 4: return the sorted ids and a nil error.'
  - When the server has no records the returned slice is empty and not nil.
  - Head has the string field ID and is defined elsewhere in package remote.
  - sort.Strings comes from the standard-library package sort.
  - This unit imports the package sort as a value.
  - This unit adds no other imports to the file.
