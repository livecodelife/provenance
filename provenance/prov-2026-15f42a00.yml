intent: "The provenance evidence refresh command (blueprint prov-2026-f90f5a04), in three files.\n\nWiring (cobra package):\n- cmd/provenance/evidence_cmd.go: a top-level group (createGroup), command evidence, use \"evidence\", short \"Work with a record's verification evidence\", arity none.\n- cmd/provenance/evidence_refresh_cmd.go: a subcommand of evidence (createSubcommand, parent evidence, command evidence-refresh), use \"refresh [id]\", short \"Append fresh evidence to an implemented record without a new version\", arity max_one. Flags, none with a short form or default:\n  - record (string): \"Record to refresh (or give it as the argument)\"\n  - reason (string): \"Why the evidence is refreshed (printed in the output)\"\n  - all (bool): \"Refresh every implemented record that is stale only because its code moved\"\n\nLogic, cmd/provenance/evidence_refresh_run.go (go package, package main). An implemented record with evidence whose content_hash and spec hashes still match is re-verified by running its associated specs; on success fresh evidence is appended (runner \"provenance evidence refresh\") with no version bump and the record file untouched; a moved content or spec hash is refused (revise or edit --refresh-specs is the path); a failing spec writes nothing. Evidence.Store.Append disambiguates files written in the same second itself. \nImports, each its own addImport, exactly these: fmt, io, os, path/filepath, strings, time, github.com/spf13/cobra, github.com/livecodelife/provenance/evidence, github.com/livecodelife/provenance/record.\n\nDeclarations, in this order, each exactly one set* call whose code kwarg is the code below verbatim (gofmt-formatted, comments kept). Do not alter, reorder or add anything.\n\n  - setFunction name codeOnlyStale, code exactly:\n      func codeOnlyStale(row evidenceRow) bool {\n      \tif row.State != string(evidence.Stale) {\n      \t\treturn false\n      \t}\n      \thasCode := false\n      \tfor _, reason := range row.Reasons {\n      \t\tswitch reason {\n      \t\tcase \"content\", \"specs\", \"parent\":\n      \t\t\treturn false\n      \t\tcase \"code\":\n      \t\t\thasCode = true\n      \t\t}\n      \t}\n      \treturn hasCode\n      }\n  - setFunction name refreshEvidence, code exactly:\n      func refreshEvidence(out io.Writer, r *repo, id, reason string) error {\n      \trec, _, err := r.Store.Load(id)\n      \tif err != nil {\n      \t\treturn err\n      \t}\n      \tif rec.Status != record.StatusImplemented {\n      \t\treturn fmt.Errorf(\"%s is %s: only an implemented record's evidence is refreshed (use provenance complete)\", id, rec.Status)\n      \t}\n      \tstore := &evidence.Store{Root: r.Root, Dir: r.Config.Dir}\n      \tlatest, err := store.Latest(rec.ID, rec.Version)\n      \tif err != nil {\n      \t\treturn err\n      \t}\n      \tif latest == nil {\n      \t\treturn fmt.Errorf(\"%s has no evidence for version %d to refresh: run provenance complete or revise it first\", id, rec.Version)\n      \t}\n      \tbehind := behindSet(r)\n      \tverdict := evidence.Check(latest, currentEvidence(r, rec, behind))\n      \tvar moved []string\n      \tfor _, why := range verdict.Reasons {\n      \t\tif why == \"content\" || why == \"specs\" {\n      \t\t\tmoved = append(moved, why)\n      \t\t}\n      \t}\n      \tif len(moved) > 0 {\n      \t\treturn fmt.Errorf(\"%s changed since its latest evidence (%s): use provenance revise or edit --refresh-specs, not a refresh\", id, strings.Join(moved, \", \"))\n      \t}\n      \tran, failed, _ := runRecordSpecs(out, r, rec, nil)\n      \tif !ran {\n      \t\treturn fmt.Errorf(\"%s has no runnable associated specs to refresh its evidence with\", id)\n      \t}\n      \tif failed {\n      \t\treturn fmt.Errorf(\"%s: associated specs failed; no evidence was written\", id)\n      \t}\n      \tbefore := evidenceFiles(r, rec.ID)\n      \tcur := currentEvidence(r, rec, behind)\n      \tfresh := evidence.New(rec, cur, true, time.Now().UTC().Format(time.RFC3339), \"provenance evidence refresh\")\n      \tif err := store.Append(fresh); err != nil {\n      \t\treturn err\n      \t}\n      \tvar added []string\n      \tfor f := range evidenceFiles(r, rec.ID) {\n      \t\tif !before[f] {\n      \t\t\tadded = append(added, f)\n      \t\t}\n      \t}\n      \tif r.Config.CommitOnStatusChange {\n      \t\tvar paths []string\n      \t\tfor _, f := range added {\n      \t\t\tif rel, err := filepath.Rel(r.Root, f); err == nil {\n      \t\t\t\tpaths = append(paths, rel)\n      \t\t\t}\n      \t\t}\n      \t\tif err := r.commit(\"Refresh evidence of \"+rec.ID+\" \"+tag(rec.ID, rec.Version), paths...); err != nil {\n      \t\t\tfor _, f := range added {\n      \t\t\t\tos.Remove(f)\n      \t\t\t}\n      \t\t\tr.unstage(paths...)\n      \t\t\treturn fmt.Errorf(\"%s: the auto-commit was rejected: %w\", id, err)\n      \t\t}\n      \t}\n      \tnow := evidence.Check(fresh, cur)\n      \tfmt.Fprintf(out, \"\\n✓ Refreshed evidence of %s@%d (%s)\\n\", rec.ID, rec.Version, now.State)\n      \tif reason != \"\" {\n      \t\tfmt.Fprintf(out, \"  Reason: %s\\n\", reason)\n      \t}\n      \tfmt.Fprint(out, \"  No new version was written; the record is unchanged.\\n\\n\")\n      \treturn nil\n      }\n  - setFunction name runEvidenceRefresh, code exactly:\n      func runEvidenceRefresh(out io.Writer, cmd *cobra.Command, args []string) error {\n      \tr, err := openRepo(cmd)\n      \tif err != nil {\n      \t\treturn err\n      \t}\n      \tall, _ := cmd.Flags().GetBool(\"all\")\n      \treason, _ := cmd.Flags().GetString(\"reason\")\n      \tvar ids []string\n      \tif all {\n      \t\trows, err := checkEvidence(r)\n      \t\tif err != nil {\n      \t\t\treturn err\n      \t\t}\n      \t\tfor _, row := range rows {\n      \t\t\tif codeOnlyStale(row) {\n      \t\t\t\tids = append(ids, row.ID)\n      \t\t\t}\n      \t\t}\n      \t\tif len(ids) == 0 {\n      \t\t\tfmt.Fprint(out, \"\\n✓ Nothing to refresh: no implemented record is stale only because its code moved\\n\\n\")\n      \t\t\treturn nil\n      \t\t}\n      \t} else {\n      \t\tid, err := recordArg(cmd, args)\n      \t\tif err != nil {\n      \t\t\treturn err\n      \t\t}\n      \t\trec, _, err := r.resolve(id)\n      \t\tif err != nil {\n      \t\t\treturn err\n      \t\t}\n      \t\tids = []string{rec.ID}\n      \t}\n      \tfailed := 0\n      \tfor _, id := range ids {\n      \t\tif err := refreshEvidence(out, r, id, reason); err != nil {\n      \t\t\tfailed++\n      \t\t\tfmt.Fprintf(out, \"\\n✗ %v\\n\\n\", err)\n      \t\t}\n      \t}\n      \tif failed > 0 {\n      \t\treturn fmt.Errorf(\"%d of %d records could not be refreshed\", failed, len(ids))\n      \t}\n      \treturn nil\n      }"
