intent: "The provenance govern command (blueprint d292748c, approved by provisio-mgr 01M51Y8RD8EA), in two files.\n\nWiring, cmd/provenance/govern_cmd.go (cobra package): a top-level command, use \"govern [files...]\", short \"List the active records that govern the given files\", arity any. Flags, none with a short form or default:\n- files (strings): \"Explicit file list (alternative to arguments)\"\n- format (string): \"Output format (human|json)\"\n- json (bool): \"Alias for --format json\"\n\nLogic, cmd/provenance/govern_run.go (go package, package main). Active records are those open or implemented; a record governs a file when it is in allowlist mode, its scope covers the file and forbidden_scope does not match (nextGoverns); exempt files (exclude_paths, CLI state, the provenance dir) are listed under exempt and never governed. The exit code is 0 whenever the lookup ran. next is the first action of adviseNext for exactly the given files, the same as `provenance next <files>`. The JSON shape (files, exempt, governing[].id/type/status/version/title/files, next) is documented in the README and must stay stable. Record text is data: the human output strips control characters and caps lengths. \nImports, each its own addImport, exactly these: encoding/json, fmt, io, sort, strings, github.com/spf13/cobra, github.com/livecodelife/provenance/record.\n\nDeclarations, in this order, each exactly one set* call whose code kwarg is the code below verbatim (gofmt-formatted, comments kept). Do not alter, reorder or add anything.\n\n  - setType name governRecord, code exactly:\n      type governRecord struct {\n      \tID      string   `json:\"id\"`\n      \tType    string   `json:\"type\"`\n      \tStatus  string   `json:\"status\"`\n      \tVersion int      `json:\"version\"`\n      \tTitle   string   `json:\"title\"`\n      \tFiles   []string `json:\"files\"`\n      }\n  - setType name governDoc, code exactly:\n      type governDoc struct {\n      \tFiles     []string       `json:\"files\"`\n      \tExempt    []string       `json:\"exempt\"`\n      \tGoverning []governRecord `json:\"governing\"`\n      \tNext      *nextAction    `json:\"next,omitempty\"`\n      }\n  - setFunction name buildGovern, code exactly:\n      func buildGovern(r *repo, files []string) (governDoc, error) {\n      \tdoc := governDoc{Files: files, Exempt: []string{}, Governing: []governRecord{}}\n      \tids, err := r.Store.List()\n      \tif err != nil {\n      \t\treturn doc, err\n      \t}\n      \tvar active []*record.Record\n      \tfor _, id := range ids {\n      \t\trec, _, err := r.Store.Load(id)\n      \t\tif err != nil {\n      \t\t\treturn doc, err\n      \t\t}\n      \t\tif rec.Status == record.StatusOpen || rec.Status == record.StatusImplemented {\n      \t\t\tactive = append(active, rec)\n      \t\t}\n      \t}\n      \tsort.Slice(active, func(i, j int) bool { return active[i].ID < active[j].ID })\n      \tcovers := map[string][]string{}\n      \tfor _, file := range files {\n      \t\tpath := strings.TrimPrefix(file, \"./\")\n      \t\tif !nextRelevant(r, path) {\n      \t\t\tdoc.Exempt = append(doc.Exempt, file)\n      \t\t\tcontinue\n      \t\t}\n      \t\tfor _, rec := range active {\n      \t\t\tif nextGoverns(rec, path) {\n      \t\t\t\tcovers[rec.ID] = append(covers[rec.ID], file)\n      \t\t\t}\n      \t\t}\n      \t}\n      \tfor _, rec := range active {\n      \t\tif got := covers[rec.ID]; len(got) > 0 {\n      \t\t\tdoc.Governing = append(doc.Governing, governRecord{ID: rec.ID, Type: string(rec.EffectiveType()), Status: string(rec.Status), Version: rec.Version, Title: rec.Title, Files: got})\n      \t\t}\n      \t}\n      \tst, err := gatherNext(r, files)\n      \tif err != nil {\n      \t\treturn doc, err\n      \t}\n      \tif actions := adviseNext(st); len(actions) > 0 {\n      \t\tdoc.Next = &actions[0]\n      \t}\n      \treturn doc, nil\n      }\n  - setFunction name printGovern, code exactly:\n      func printGovern(out io.Writer, doc governDoc) {\n      \tfmt.Fprintf(out, \"\\nGOVERN: %s\\n\", ctxClean(strings.Join(doc.Files, \", \"), 300))\n      \tif len(doc.Governing) == 0 {\n      \t\tfmt.Fprint(out, \"  no active record governs these files\\n\")\n      \t}\n      \tfor _, g := range doc.Governing {\n      \t\tfmt.Fprintf(out, \"  %s@%d  %s  %s  %s  (%s)\\n\", g.ID, g.Version, g.Status, g.Type, ctxClean(g.Title, 100), ctxClean(strings.Join(g.Files, \", \"), 200))\n      \t}\n      \tif len(doc.Exempt) > 0 {\n      \t\tfmt.Fprintf(out, \"  exempt: %s\\n\", ctxClean(strings.Join(doc.Exempt, \", \"), 300))\n      \t}\n      \tif doc.Next != nil {\n      \t\tfmt.Fprintf(out, \"  Next: %s: %s\\n\", doc.Next.Kind, ctxClean(doc.Next.Reason, 300))\n      \t\tif doc.Next.Command != \"\" {\n      \t\t\tfmt.Fprintf(out, \"    Run: %s\\n\", ctxClean(doc.Next.Command, 300))\n      \t\t}\n      \t}\n      \tfmt.Fprint(out, \"\\n\")\n      }\n  - setFunction name runGovern, code exactly:\n      func runGovern(out io.Writer, cmd *cobra.Command, args []string) error {\n      \tr, err := openRepo(cmd)\n      \tif err != nil {\n      \t\treturn err\n      \t}\n      \tfiles, _ := cmd.Flags().GetStringSlice(\"files\")\n      \tformat, _ := cmd.Flags().GetString(\"format\")\n      \tasJSON, _ := cmd.Flags().GetBool(\"json\")\n      \tif format != \"\" && format != \"human\" && format != \"json\" {\n      \t\treturn fmt.Errorf(\"unknown format %q (human|json)\", format)\n      \t}\n      \tgiven := nextDedupe(append(append([]string{}, args...), files...))\n      \tif len(given) == 0 {\n      \t\treturn fmt.Errorf(\"no files: give file paths as arguments or use --files\")\n      \t}\n      \tdoc, err := buildGovern(r, given)\n      \tif err != nil {\n      \t\treturn err\n      \t}\n      \tif asJSON || format == \"json\" {\n      \t\tenc := json.NewEncoder(out)\n      \t\tenc.SetIndent(\"\", \"  \")\n      \t\treturn enc.Encode(doc)\n      \t}\n      \tprintGovern(out, doc)\n      \treturn nil\n      }"
constraints:
