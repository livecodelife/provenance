id: prov-2026-d292748c
title: 'provenance CLI, part 5e: govern (which active records govern these files)'
type: blueprint
status: implemented
version: 3
reason: drop milestone numbering, ticket labels, port-of-linespec history and process constraints from the record text
created_at: "2026-10-16"
author: calebcowen@gmail.com
intent: |-
  `provenance govern`: the light-weight lookup of which active records currently govern a set of files, for agents and hooks that only need that and not the full `context`. It uses no embeddings and no network.

  Command: `govern [files...] [--files a,b] [--format human|json] [--json]` (arity any; --json is an alias for --format json; -c as everywhere). No file is an error. The exit code is 0 whenever the lookup ran: the answer is information, not a gate.

  Active records are those with status open or implemented (drafts have not started, deprecated records no longer govern). A record governs a file when it is in allowlist mode (a non-empty affected_scope), the scope covers the file and forbidden_scope does not match it (the same test `next` and `context` use). Files that are exempt (exclude_paths, CLI state, the provenance dir) are reported separately and never governed.

  Output. json: {"files":[...], "exempt":[...], "governing":[{"id","type","status","version","title","files":[the given files this record covers]}], "next": {"kind","command","reason",...}}; `governing` is sorted by id, `next` is the first action of `provenance next <files>` so the two never disagree, and the shape (notably `.governing[].id`, `.governing[].status` and `.next.reason`/`.next.command`) is documented in the README and stable, because the Claude Code plugin and other tools read it. human: one line per governing record (`id@version  status  type  title  (files)`), `no active record governs these files` when none, then the next action. Record text is data: control characters stripped and lengths capped in the human output, JSON-escaped in the JSON.

  Out of scope: ancestry, evidence and stale detail (that is `context`), shared-repo records, any change to the plugin hooks (they keep calling `next`).
constraints:
  - Exit code is 0 whenever the lookup ran; next is exactly the first action of provenance next for the same files.
  - The JSON shape (governing[].id/status, next.reason/command) is stable and documented in the README.
  - No embeddings, no network.
affected_scope:
  - cmd/provenance/**
forbidden_scope:
  - record/**
  - migrate/**
  - lint/**
  - scope/**
  - stale/**
  - evidence/**
