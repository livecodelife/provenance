intent: Token is a bearer token ready to use, with where it came from and whether it is a personal token.
constraints:
  - Token is an exported struct type with three exported fields, declared in the order Bearer, Source, Personal.
  - Field Bearer is a string.
  - Field Source is of type Source, a string type defined in package auth.
  - Field Personal is a bool, true for the token read from the environment and for a stored personal token, which are never refreshed.
  - The fields carry no struct tags.
  - This unit declares only the type and defines no methods.
  - This unit does not change the file's imports.
