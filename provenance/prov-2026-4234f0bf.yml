id: prov-2026-4234f0bf
title: Record-file specs hash as a constant marker (content_hash)
type: blueprint
status: open
version: 2
reason: 'scope: corpus generator tools'
created_at: "2026-10-16"
author: calebcowen@gmail.com
intent: A spec whose path is a provenance record file (base name prov-YYYY-<hex8>[-suffix].yml) contributes the constant marker record-file/v1 to content_hash instead of its file bytes, whether or not the file exists, so rewriting the record store (migrate, revise, complete) or a record that names itself as a spec never changes a hash. Non-record spec hashes are unchanged. Specified in HASHING.md section 4, implemented in Go (record) and TypeScript (ts), with corpus cases both resolvers pass.
constraints:
  - 'Marker is the literal string record-file/v1; it has no sha256: prefix so it cannot equal a real spec hash. The version suffix lets a later marker change be told apart.'
  - 'Detection is by path only: base name matches ^prov-[0-9]{4}-[0-9a-f]{8}(-[A-Za-z0-9._-]+)?\.yml$, in any directory; the file need not exist, and a record-file spec is never reported as missing.'
  - Specs whose base name does not match keep today's hash exactly (sha256 of the CRLF-folded bytes); no existing hash of a non-record spec changes.
  - 'List position is kept: a record-file spec occupies its slot in associated_specs with the marker, so reordering still changes the hash.'
  - 'Go (record) and TypeScript (ts) agree on the corpus; corpus_version bumps to 6 and adds cases: spec to another record, spec to itself, a similarly named non-record file, and a missing record file.'
  - Test fixtures cover both a spec naming another record and a record naming itself; migrate gets a fixture proving a migrated record with a record-file spec lints clean without a revise.
  - Tests that run git clear GIT_* and use isolated HOME per COMMON.md.
affected_scope:
  - docs/HASHING.md
  - record/hash.go
