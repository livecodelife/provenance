author: calebcowen@gmail.com
intent: withTimeout derives a context that ends after a time limit and a cancel function that needs no extra import at the call site.
constraints:
  - withTimeout is an unexported function with two parameters in order, ctx (a context.Context) and d (a time.Duration).
  - 'withTimeout returns two results in order: a context.Context and a function with no parameters and no results.'
  - withTimeout returns the context and the cancel function made by context.WithTimeout called with ctx and d.
  - context.WithTimeout and context.Context come from the standard-library package context.
  - time.Duration comes from the standard-library package time.
  - This unit does not change the file's imports.
