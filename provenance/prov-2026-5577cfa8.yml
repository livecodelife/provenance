  check --commit and --range: Logic, cmd/provenance/check_commits_run.go (go package, package main). A commit is checked like a staged change against the records in its own tree (git archive) and its first parent as base; for a merge commit only the paths differing from every parent count. Imports, each its own addImport, exactly these: bytes, fmt, io, os, os/exec, sort, strings.

