id: prov-2026-7752337c
title: 'Phase 3 library: stale children, repin, per-version verification evidence'
status: draft
created_at: "2026-10-15"
author: test@example.com
intent: |
  Phase 3 of DESIGN.md in the library (no CLI): know which children are
  behind their parents, let a person confirm a child against a newer parent
  without a new version, and keep verification evidence per version.

  Package stale:
  - Find(store) -> []Finding{ID, Parent, Pinned, ParentVersion, Kind, Cause}.
    direct: a child's implements_version is below its parent's version.
    transitive: the child's own pin is current but an ancestor is directly
    stale (Cause names the nearest such ancestor), per "When a parent
    changes": re-pinning a blueprint clears its imprints' transitive flag; a
    blueprint that gets a new version makes them directly stale.
    unknown: implements_version 0 (unpinned), an implements_repo parent, or
    an unresolvable parent; reported, never stale (migration report D2/D3).
    Deprecated children are skipped (terminal).
  - Repin(store, id, toVersion, reason, author, now): moves only
    implements_version (to the parent's current version when toVersion is 0;
    1 <= toVersion <= parent version). No version bump: implements_version is
    outside content_hash, so nothing regenerates. Refuses deprecated records.
    Because a repin writes no version, its reason goes to an append-only pin
    log, provenance/.versions/<id>/pins.jsonl ({at, parent, from, to, reason,
    author}), so history can show confirmations. (Proposed; not settled by
    DESIGN.)

  Package evidence:
  - Evidence{RecordID, Version, ContentHash, SpecHashes, CodeHash, Passed,
    At, Runner}: one verification run of one record version.
  - CodeHash(regions []Region{Gen, Pkg}) string: SHA-256 over the canonical
    encoding of the record's regions' gen and pkg values, sorted, so region
    order in files does not matter. Specified in docs/HASHING.md section 7
    with code_hash corpus cases (the library does not parse sedum markers;
    the caller passes the regions, e.g. from sedum).
  - A files store: provenance/.evidence/<id>/<version>-<unix-nanos>.json,
    append-only, newest run per version wins.
  - Check(evidence, current) -> Fresh, Stale{content, specs, code}, or
    Missing, where current is the record's present content_hash, spec hashes
    and code hash. So Provisio can show "v4 verified, v5 unverified".
constraints:
  - 'DESIGN Phase 3 done-check in a unit test: bumping a brief lists exactly its blueprints (direct) and their imprints (transitive), and their evidence shows as stale.'
  - 'Repin changes only the implements_version line of the file (byte-level check) and leaves content_hash and every snapshot untouched.'
  - 'code_hash cases in conformance/hashing/cases.json, generated by the independent Python reference, pass in Go.'
  - 'On migrate.Apply output (temp copies of the 4 repos), every direct finding has Pinned < ParentVersion, and every transitive finding has a directly stale ancestor.'
  - 'Depends only on record and the standard library. Evidence and pin logs are append-only.'
affected_scope:
  - stale/**
  - evidence/**
  - docs/HASHING.md
  - conformance/hashing/**
forbidden_scope: []
type: blueprint
supersedes: ""
superseded_by: ""
related: []
sealed_at_sha: ""
associated_specs:
  - path: stale/stale_test.go
    run_command: go test ./stale/ ./evidence/ -count=1
associated_traces: []
monitors: []
tags:
  - phase-3
