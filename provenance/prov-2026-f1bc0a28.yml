title: token create command wiring
type: imprint
status: open
version: 2
reason: The subcommand is registered on the token command, which lives in token_cmd.go
created_at: "2026-10-22"
author: calebcowen@gmail.com
intent: The token create command is a cobra command that creates a personal token by calling runTokenCreate.
constraints:
  - The function newTokenCreateCmd takes no arguments.
  - The function newTokenCreateCmd returns a pointer to a cobra command.
  - The command use text is "create".
  - The command short text is "Create a personal token (the secret is shown once)".
  - The command accepts no positional arguments.
  - The command defines no subcommands.
  - The command has a flag named name.
  - The flag name is a string flag.
  - The default of the flag name is the empty string.
  - The usage text of the flag name is "Token name (default ci-<repository>)".
  - The command has a flag named scope.
  - The flag scope is a string array flag.
  - The flag scope is repeatable.
  - The flag scope has no default values.
  - 'The usage text of the flag scope is "Scope: records:read or records:write (repeatable; default records:write)".'
  - The command has a flag named expires-in-days.
  - The flag expires-in-days is an integer flag.
  - The default of the flag expires-in-days is 0.
  - The usage text of the flag expires-in-days is "Days until the token expires, 1 to 365 (default 90)".
  - The command has a flag named json.
  - The flag json is a boolean flag.
  - The default of the flag json is false.
  - The usage text of the flag json is "Print as JSON".
  - The command has a flag named secret-only.
  - The flag secret-only is a boolean flag.
  - The default of the flag secret-only is false.
  - The usage text of the flag secret-only is "Print only the secret (for piping to gh secret set)".
  - None of the flags has a short form.
  - All the flags are local to the command.
  - newTokenCreateCmd is added as a subcommand by newTokenCmd, not registered in main.go.
  - The file imports github.com/spf13/cobra as a value.
  - The file adds no other imports.
  - runTokenCreate is defined elsewhere in package main.
  - 'runTokenCreate takes parameters in order: an io.Writer, a pointer to a cobra command, and a slice of strings.'
  - runTokenCreate returns an error.
  - The command's run function is the command's RunE field.
  - The command's run function returns the result of calling runTokenCreate with the writer returned by the command's OutOrStdout method, the command and the arguments.
