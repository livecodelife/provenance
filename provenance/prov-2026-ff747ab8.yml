reason: ""
created_at: "2026-10-22"
author: calebcowen@gmail.com
intent: handleSyntax is the pattern that says what a handle in an AT URI looks like.
constraints:
  - handleSyntax is an unexported package-level variable in package main.
  - handleSyntax is a pointer to regexp.Regexp.
  - handleSyntax is created with regexp.MustCompile.
  - handleSyntax must match the whole string.
  - handleSyntax accepts a host name of two or more labels separated by full stops, where each label is 1 to 63 ASCII letters, digits or hyphens that does not start or end with a hyphen, and the last label starts with a letter.
  - handleSyntax accepts calebcowen.bsky.social and rejects names with no full stop.
  - regexp.Regexp and regexp.MustCompile come from the standard-library package regexp, already imported by another unit.
  - This unit adds no imports to the file.
