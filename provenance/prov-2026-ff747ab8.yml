id: prov-2026-ff747ab8
title: handleSyntax
type: imprint
status: open
version: 1
reason: ""
created_at: "2026-10-22"
author: calebcowen@gmail.com
intent: handleSyntax is the pattern that says what a handle in an AT URI looks like.
constraints:
  - handleSyntax is an unexported package-level variable in package main.
  - handleSyntax is a pointer to regexp.Regexp.
  - handleSyntax is created with regexp.MustCompile.
  - handleSyntax must match the whole string.
  - handleSyntax accepts two or more labels separated by full stops.
  - Each label of handleSyntax is 1 to 63 characters long.
  - Every label of handleSyntax holds only ASCII letters, digits and hyphens.
  - No label of handleSyntax starts with a hyphen.
  - No label of handleSyntax ends with a hyphen.
  - The last label of handleSyntax starts with a letter.
  - The first and middle labels of handleSyntax may start with a digit.
  - handleSyntax puts no upper limit on the number of labels.
  - handleSyntax accepts calebcowen.bsky.social and 1.2.com.
  - handleSyntax rejects foo, a.1 (the last label starts with a digit), a.-b, a-.b and a label of 64 characters.
  - regexp.Regexp and regexp.MustCompile come from the standard-library package regexp, already imported by another unit.
  - This unit adds no imports to the file.
