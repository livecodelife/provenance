id: prov-2026-29d43aaf
title: 'M0: AT Proto lexicons for published provenance records'
type: blueprint
status: open
version: 7
reason: Register the project lexicon, its sample and its round-trip tests as specs
created_at: "2026-10-16"
author: calebcowen@gmail.com
intent: The published form of a provenance record. Lexicons dev.provisio.provenance.record (mutable head), .version (immutable, chained by contentHash and by strong reference) and .defs (shared content, spec hash). Field names are the record snake_case names in camelCase, decided once in docs/LEXICONS.md. record/published.go converts between a Snapshot and the lexicon JSON, so publish (M4) and the record server (M3) share one mapping. The hash conformance corpus gains a version_hash kind (corpus 7) so Go and TypeScript compute the same contentHash from a lexicon version record. Types for TypeScript (lex-cli) and Go (indigo lexgen, in its own module) are generated and round-trip a sample head and three versions. pins.jsonl is not published in v1. The blueprint also covers the project lexicon dev.provisio.project, the record a head points to with its project field.
constraints:
  - The lexicon field names are decided in docs/LEXICONS.md and nowhere else; the JSON, generated types and mapping follow it
  - 'record/published.go MUST convert a Snapshot to the published version and back with no loss: every snapshot of this repository round-trips byte-identically through MarshalSnapshot'
  - A published version MUST verify from content and specHashes alone; tampered content, a changed spec hash or a spec-count mismatch MUST be rejected
  - The empty string in specHashes means an unresolved spec and maps to the snapshot's nil
  - Go and TypeScript MUST agree on every version_hash case of the shared corpus, and the corpus MUST stay generated by case_defs.py and reference.py
  - The generated TypeScript and Go types MUST round-trip the sample head and three versions, the Go types also as CBOR
  - Generator versions are pinned and recorded in docs/LEXICONS.md; the generated Go lives in its own module so the provenance CLI does not depend on indigo
  - pins.jsonl is not published in v1
  - Renaming a project changes only its name field and never its record key
  - A project record has a required name field, a string with a maximum of 64 graphemes and a maximum length of 640
  - A project record has an optional description field, a string with a maximum of 300 graphemes and a maximum length of 3000
  - A project record has a required createdAt field, a string in the datetime format
  - lexicons/gen/check.sh still passes with the project lexicon, sample and generated files present
  - The lexicon dev.provisio.project is a record lexicon kept in lexicons/dev/provisio/project.json
  - The record key type of dev.provisio.project is any, so the key is a slug chosen by the creator
  - A project key may contain only lowercase letters, digits and hyphen
  - A project key must be 1 to 64 characters long
  - An absent description of a project means an empty description
  - lexicons/samples/project.json is a valid sample project record
  - Go and TypeScript types for dev.provisio.project are generated from the lexicon
  - The generated Go project record type has CBOR encoding like the provenance record types
  - Regenerating the types leaves the generated provenance types unchanged
  - docs/LEXICONS.md documents dev.provisio.project with a table of its fields
  - docs/LEXICONS.md documents the project key rule
  - docs/LEXICONS.md documents the maxGraphemes limits of the project fields in its Limits section
  - A project key does not start or end with a hyphen and has no two hyphens in a row
  - A project key outside the key rules is rejected
  - The backend and the CLI enforce the key rules
  - Only the owner of a project may create it
  - The lexicon does not enforce ownership
  - New round-trip tests for the project sample live in lexicons/gen/go/project_roundtrip_test.go and lexicons/gen/ts/test/project.roundtrip.test.ts
  - The new round-trip tests are the oracle for the project sample
  - docs/LEXICONS.md states that only the owner may create a project
  - docs/LEXICONS.md states that the backend enforces project ownership, not the lexicon
affected_scope:
