intent: Store is the interface through which the credential is kept between runs.
constraints:
  - Store is an exported interface type with three methods.
  - Method Load takes no arguments and returns a pointer to Credential, a Source and an error.
  - Method Save takes c, a pointer to Credential, and returns an error.
  - Method Delete takes no arguments and returns an error.
  - Load reports a missing credential with the ErrNoSession error value, defined elsewhere in package auth.
  - Credential and Source are types defined elsewhere in package auth.
  - This unit does not change the file's imports.
