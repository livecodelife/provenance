intent: PublishProblem describes a record that cannot be published until the user acts.
constraints:
  - PublishProblem is an exported struct type with three exported string fields, declared in the order ID, Kind, Reason.
  - Field ID is the record id.
  - Field Kind is one of the three strings server ahead, diverged and invalid id.
  - The Kind server ahead means the user should run import.
  - The Kind diverged means the user should import or revise.
  - The Kind invalid id means the service rejects the id, so the record cannot be published.
  - Field Reason is the message shown to the user.
  - The fields carry no struct tags.
  - This unit declares only the type and defines no methods.
  - This unit adds no imports to the file.
