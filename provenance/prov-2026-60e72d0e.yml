id: prov-2026-60e72d0e
title: 'provenance CLI, part 1: migrate, create, open, revise, edit, status, history, diff'
status: implemented
version: 3
reason: restore the compatibility contract constraint
created_at: "2026-10-15"
author: calebcowen@gmail.com
intent: |
  The `provenance` binary at cmd/provenance, with the commands that need
  neither scope matching nor lint: migrate, create, open, revise, edit,
  status, history and diff. They work on the record and migrate packages.

  Each command gets an imprint implementing this blueprint. Shared helpers
  (config, store access, id resolution, output) live in
  cmd/provenance/run_common.go.

  Config: .provenance.yml, with the same keys as v1's provenance block at
  top level. Falls back to the provenance block of .linespec.yml. The
  persistent -c/--config flag selects a file. Every id argument also
  resolves through aliases.

  Commands:
  - migrate [--plan] [--json] [--accept-suggestions] [--keep-separate id]...
    [--fold id]... [--workspace dir]: --plan prints migrate.Plan (version
    chains, keep-separate suggestions, kept deprecated bugs,
    StatusMappings, warnings) and writes nothing. Without --plan it refuses
    a dirty records dir, then runs migrate.Apply into the repo's FilesStore.
    It writes .provenance.yml from the .linespec.yml block and removes that
    block (deleting .linespec.yml if nothing is left), writes the version
    manifest and deletes .linespec/hash_manifest.json, then prints a summary. Hooks are
    not installed by migrate; its summary tells the user to run
    `provenance hooks install`.
  - create: flags --title, --intent, --type, --tag, --scope, --locked,
    --no-edit and --id-suffix (no --supersedes), plus --implements
    <id>, which pins implements_version to the parent's current version.
    Writes a schema 2 draft at version 1 and no snapshot.
  - open <id>: draft -> open writes the v1 snapshot through record.Commit.
    It auto-commits "Open provenance record [<id>@1]" when
    commit_on_status_change is set, rolling back on failure.
  - revise <id> --reason "..." [--fix]: edits the content fields in $EDITOR
    via a temp file. It saves a new version through record.Commit only if
    content_hash changed; the record reopens and the version bumps.
    Unchanged content writes nothing. A draft with no snapshot is edited in
    place without a version or reason. A deprecated record is refused.
  - edit <id> [--title] [--intent] [--add-constraint]... [--remove-constraint
    n]... [--add-scope]... [--remove-scope]... [--add-forbidden]...
    [--remove-forbidden]... --reason "..." [--fix]: the same versioning rule
    without an editor, for scripts and agents.
  - status [--status s] [--tag t] [--type t] [--json]: lists records, with
    each record shown as <id>@<version>.
  - history <id> [--json]: versions from the snapshots (version, created_at,
    author, reason, fix, short content hash), each with its commits. Commits
    are found by `git log` on [<id>@N], with bare [<id>] tags and aliases
    listed separately, and only when git is present.
  - diff <id> [<vA> <vB>]: a field-by-field diff of two snapshots' content
    (scalars old -> new, list items added/removed, specs). By default it
    compares the latest snapshot with the working record when they differ
    (an unbumped edit), else the latest snapshot with the one before it.
constraints:
  - cmd/provenance is in the root module, so github.com/spf13/cobra v1.10.2 joins go.mod. The library packages (record, migrate, lint) must not import it, and go mod tidy keeps it out of their dependency closure.
  - 'Proof: go test ./cmd/provenance/ covers each command on temp repos (create -> open -> revise -> edit -> history/diff/status, aliases, refusals). migrate --plan --json on a temp clone of this repo matches migrate.MakePlan. migrate on temp clones of the 4 real repos writes the same tree as migrate.Apply, with real repos untouched.'
  - Supersession wording is replaced by revise wording.
  - 'Version manifest: .provenance/versions.jsonl holds one {"id","version","content_hash"} line per v2 record, sorted by id and derived from the latest snapshot. migrate writes it and deletes .linespec/hash_manifest.json. open (v1) and revise/edit (bumps) rewrite it in the same step that appends the snapshot, so a bump shows in the git diff. Drafts without a snapshot are not listed.'
  - Behaviour carried from linespec keeps its messages and exit codes where the v2 model does not change them.
affected_scope:
