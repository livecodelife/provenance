author: calebcowen@gmail.com
intent: the migrationAgree function reports whether a staged file differs from its base only in the opening lines of its sedum regions, comparing the text outside regions and the identity, opening-line prefix, body and closing line of each region.
constraints:
  - The function receives the base content and the staged content, both strings, in that order
  - The function returns a boolean
  - 'The function splits each content with splitRegions (regen_run.go; parameter: a string; returns the outside text string, a slice of regionMarker and a boolean that is false when malformed)'
  - The function returns false when either content is malformed
  - The function returns false when the base content has no region
  - The function returns false when the outside texts differ in any byte
  - The function returns false when the two marker slices differ in length
  - The function returns false when any pair of markers at the same position differs in Prefix
  - The function returns false when any pair of markers at the same position differs in Close
  - Everything in an opening line after its Prefix, other than the tier, record, gen and pkg values, may differ
  - regionMarker is the struct declared in regen_run.go with the string fields Tier, Record, Gen, Pkg, Prefix, Body and Close
  - The function returns false when any pair of markers at the same position differs in Tier
  - The function returns false when any pair of markers at the same position differs in Record
  - The function returns false when any pair of markers at the same position differs in Gen
  - The function returns false when any pair of markers at the same position differs in Pkg
  - The function returns false when any pair of markers at the same position differs in Body
  - Otherwise the function returns true
  - The function adds no imports
