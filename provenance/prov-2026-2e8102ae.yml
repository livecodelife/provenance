author: calebcowen@gmail.com
intent: Error renders an OAuthError as a one-line message with its code, HTTP status and optional description.
constraints:
  - Error has a pointer receiver of type OAuthError, takes no parameters and returns a string, satisfying the error interface.
  - 'When Description is non-empty the result is the Code, then a space, then the text HTTP and the Status in parentheses, then a colon and a space, then the Description. For example: invalid_grant (HTTP 400): token revoked.'
  - 'When Description is empty the result is the Code, then a space, then the text HTTP and the Status in parentheses, with no trailing colon. For example: http_500 (HTTP 500).'
  - The status is formatted as a decimal integer.
  - This method does not change the file's imports.
  - fmt.Sprintf comes from package fmt.
