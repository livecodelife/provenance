id: prov-2026-f86ede24
title: regenerationOnly
type: imprint
status: open
version: 2
reason: Name the marker field that holds the record id
created_at: "2026-10-21"
author: calebcowen@gmail.com
intent: the regenerationOnly function reports whether a change is a pure re-render of sedum regions in governed files, with no change to record state.
constraints:
  - 'The function receives, in order: a pointer to a repo, the base revision string, the tree path string, a slice of all changed path strings and a pointer to the tagged record.Record'
  - The function returns a boolean
  - The tagged record parameter is not used.
  - 'The function returns false when any changed path is a record file (recordFileID, check_run.go; parameters: a pointer to a repo and a path string; returns a string, non-empty for a record file)'
  - 'The function returns false when stateExempt (check_run.go; parameters: a pointer to a repo and a path string; returns a boolean) is true for any changed path'
  - 'Changed paths for which scope.Excluded (parameters: a path string and the repo''s Config.ExcludePaths slice; returns a boolean) is true are ignored by the remaining steps'
  - The function returns false when no governed path remains
  - 'For each governed path the function returns false when headHas (check_run.go; parameters: a pointer to a repo, a revision string and a path string; returns a boolean) says it is absent from the base'
  - The staged file of a governed path is the tree path joined with the changed path converted to the operating system's separator
  - The function returns false when the staged file does not exist or cannot be read
  - The base content is read by running git cat-file blob with the base, a colon and the path
  - The git command runs with the repo's Root as working directory
  - The git command's environment is the result of the repo's gitEnv method
  - The base content is the raw output bytes, untrimmed
  - The function returns false when the base content cannot be read
  - 'The function returns false when regionsAgree (parameters: base content string and staged content string; returns a boolean) is false for any governed path'
  - The records to verify are the distinct record ids named by the regions of the staged content of the governed paths, in order of first appearance
  - 'The function returns false unless sedumCurrent (parameters: a pointer to a repo, the tree string and a record id string; returns a boolean) is true for each of those ids'
  - The function returns true when all steps pass
  - The repo parameter is a pointer to the repo struct defined in common_run.go of package main
  - The repo's Root field is a string holding the absolute repository root path
  - The repo's Config.ExcludePaths field is a slice of strings
  - The repo's gitEnv method takes no arguments and returns the environment for git commands as a slice of strings
  - The function adds no imports
  - 'The function reads those ids by splitting the staged content with splitRegions (parameter: a string; returns outside text, a slice of regionMarker values and a boolean) and taking the Record field of each marker; a regionMarker has only the fields Tier, Record and Gen'
