id: prov-2026-4c78e82d
title: 'provenance document: a behaviour document built from briefs and blueprints, round-trippable'
type: brief
status: open
version: 1
reason: ""
created_at: "2026-10-24"
author: calebcowen@gmail.com
intent: A person, or the Provisio UI, can read the behaviour of a project as one Markdown document made only from the current briefs and blueprints (their intent and constraints), edit that document, and apply the edit back so that only the records whose intent or constraints changed are revised, each as a normal revision with a reason. Imprints are not part of the document. Revising a blueprint makes its imprints stale through the existing stale machinery, and this feature adds nothing to that. The command line and the Provisio UI share one library implementation.
constraints:
  - The document contains only records of type brief or blueprint that are neither deprecated nor superseded.
  - Applying an edited document revises only the records whose intent or constraints changed.
  - Each revision made by applying a document carries a reason supplied by the caller.
  - Creating records from new headings is out of scope.
  - Editing imprints is out of scope.
  - Using the network is out of scope.
  - Editing record titles is out of scope.
  - Editing record scope is out of scope.
  - Editing record specs is out of scope.
  - Editing record links is out of scope.
  - Published projects are out of scope.
