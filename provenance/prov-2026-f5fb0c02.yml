created_at: "2026-10-24"
author: calebcowen@gmail.com
intent: The printDocumentPlan function prints a document plan as human-readable text, one line per change, conflict or problem sorted by record id, followed by one summary line.
constraints:
  - The plan printer writes a document plan as human-readable text to the writer it is given.
  - It prints one line per change, conflict or problem.
  - It sorts the lines by record id, with lines that have no id first.
  - For one id it prints changes before conflicts and conflicts before problems.
  - A change line names which of intent and constraints changed.
  - A conflict line shows the anchored version and the current version.
  - A problem line shows the problem's kind, its line number and its message.
  - Unchanged records are counted in the summary and not printed as lines.
  - The output ends with one summary line giving the counts of changes, conflicts, problems and unchanged records.
