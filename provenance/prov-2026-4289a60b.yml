title: auth.Wait
type: imprint
status: draft
version: 1
reason: ""
created_at: "2026-10-21"
author: calebcowen@gmail.com
intent: Wait sleeps for a duration, or until the context ends, whichever comes first.
constraints:
  - Wait is an exported package-level function taking ctx (context.Context) and d (time.Duration) and returning an error.
  - It returns nil after d has elapsed.
  - If ctx ends before d elapses it returns ctx.Err() immediately.
  - It releases its timer on return.
  - This function does not change the file's imports.
  - context.Context comes from package context.
  - time.NewTimer and time.Duration comes from package time.
