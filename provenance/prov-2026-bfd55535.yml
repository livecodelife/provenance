id: prov-2026-bfd55535
title: provenance diff command
status: draft
created_at: "2026-10-15"
author: calebcowen@gmail.com
intent: |
  The provenance diff command: a top-level command, use "diff [id] [vA vB]", short "Show what changed between two versions of a record", arity any. Flags:
    - record (string): "Record to diff (or give it as the first argument)"
  No flag has a short form. No flag has a default value.

  Behaviour: Arguments: [<id>] [<vA> <vB>] (id from --record or the first argument). Field-by-field: scalars old -> new, list items added/removed, specs by path. With no versions it compares the latest snapshot with the working record when its content differs (an unbumped edit), else the latest snapshot with the one before. Exits 0 either way; no change prints "no differences".
