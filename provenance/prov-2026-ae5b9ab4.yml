  - When errors.As finds a pointer to exitError anywhere in the chain of err, exitCode returns the code field of that exitError.
  - For any other error exitCode returns 1.
  - For a nil error exitCode returns 1.
  - errors.As comes from the standard-library package errors.
  - exitError is a struct type defined elsewhere in package main with the unexported field code of type int.
  - This unit does not change the file's imports.
