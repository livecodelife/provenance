title: 'provenance document, library part 1: Render and the shared document types'
type: blueprint
status: open
version: 1
reason: ""
created_at: "2026-10-24"
author: calebcowen@gmail.com
intent: 'The Render function and the shared exported types of the document package: Render turns the current briefs and blueprints of a record store into one deterministic Markdown document in which each record is an anchored section holding its intent and its constraints.'
constraints:
  - Render takes a record store and a RenderOptions value holding an optional list of scope paths and an ids switch.
  - Render returns the document as text and an error.
  - Render includes every record of type brief or blueprint whose status is neither deprecated nor superseded.
  - Render includes no imprint.
  - When scope paths are given, Render keeps only the records whose affected_scope covers at least one of them.
  - Render orders briefs by id.
  - Render follows each brief with the blueprints that implement it, by id.
  - Render puts blueprints whose brief is not in the document last, by id.
  - Render writes each record as a section with a heading made from its title.
  - Each section has an anchor comment that carries the record id and the version the text was rendered from.
  - Each section has the intent as written.
  - Each section has the constraints as a list in order.
  - Record ids appear only in the anchor comment, unless the ids switch is set.
  - When the ids switch is set, record ids also appear in the headings.
  - Intent text that looks like document structure is escaped so that parsing restores it exactly.
  - Rendering the same store with the same options twice gives byte-identical output.
  - Render never creates, edits or deletes a record.
  - Rendering a store, parsing the output and planning it against the same store gives a plan with no changes, no conflicts and no problems.
affected_scope:
  - document/render.go
  - document/*_test.go
