intent: recordIDs resolves the record arguments of a command to record ids, or every record id when all is set.
constraints:
  - 'recordIDs is an unexported function with three parameters in order: r (a pointer to repo), args (a slice of strings) and all (a bool), and it returns a slice of strings and an error.'
  - The repo type is defined elsewhere in package main with the Store field, a pointer to record.FilesStore whose List method takes no parameters and returns a slice of strings and an error, and the resolve method.
  - 'Step 1: when all is true, recordIDs returns the result of the List method of the repo''s Store field unchanged, and ignores args.'
  - 'Step 2: when all is false and args is empty, recordIDs returns a nil slice and a new error made with fmt.Errorf whose text is name the records, or pass --all.'
  - 'Step 3: for each argument in order, call the resolve method of the repo with the argument, which takes a string and returns a pointer to record.Record, a pointer to record.Document and an error.'
  - resolve accepts a record id or an alias of a record.
  - If resolve fails, recordIDs returns a nil slice and that error unchanged.
  - 'Step 4: the id collected for an argument is the ID field of the returned record, which is the real id and not the argument.'
  - 'Step 5: recordIDs returns the collected ids, in the order of the arguments with duplicates kept, and a nil error.'
  - fmt.Errorf comes from the standard-library package fmt, already imported by another unit.
  - record.FilesStore and record.Record come from the package github.com/livecodelife/provenance/record, used without importing the package by name in this unit.
  - This unit adds no imports to the file.
