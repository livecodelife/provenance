reason: The migration test now uses a versioned unknown tag
created_at: "2026-10-26"
author: calebcowen@gmail.com
intent: the exportBase function writes the tree of a base revision into a directory.
constraints:
  - The function receives a pointer to a repo, the base revision string and the destination directory string, in that order
  - The function returns a boolean that is true only when the whole tree was written
  - The git command runs with the repo's Root as working directory
  - The git command's environment is the result of the repo's gitEnv method, which takes no arguments and returns a slice of strings
  - The archive is the standard output of the git command, read in full
  - The git command's standard error is discarded
  - The git command is awaited before tar is started
  - The function then runs the command tar with the arguments -x, -C and the destination directory
  - The standard input of tar is the archive that git wrote to its standard output, supplied as a reader over that text
  - The tar command is awaited
  - The function returns false when either command fails to start
  - The function returns false when either command exits with a non-zero status
  - The function returns true otherwise
  - The destination directory is neither created nor removed by the function
  - The repo parameter is a pointer to the repo struct defined in common_run.go of package main, whose Root field is a string holding the absolute repository root path
  - The function uses os/exec and strings (to make the reader over the archive text), whose imports are owned by another record in the same file
  - The function adds no imports
  - The function runs git with the arguments archive, --format=tar and the tree name made of the base revision, a colon and ./
  - The archive is of the tree at the repo root directory
