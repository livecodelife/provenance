  - runTokenRevoke is defined elsewhere in package main.
  - 'runTokenRevoke takes parameters in order: an io.Writer, a pointer to a cobra command, and a slice of strings.'
  - runTokenRevoke returns an error.
  - The command's run function is the command's RunE field.
  - The command's run function returns the result of calling runTokenRevoke with the writer returned by the command's OutOrStdout method, the command and the arguments.
