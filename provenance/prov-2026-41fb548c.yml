  - complete leaves the record's version unchanged
  - complete leaves the manifest unchanged
  - If any step of complete fails, the record file is restored to its content before the command
  - If the auto-commit of complete is rejected, the evidence files recorded by the run are removed and the record file is unstaged
  - If any step of complete fails, the manifest and the version snapshots are unchanged
