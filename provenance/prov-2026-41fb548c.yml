id: prov-2026-41fb548c
title: provenance complete command
status: draft
created_at: "2026-10-15"
author: calebcowen@gmail.com
intent: |
  The provenance complete command: linespec's Complete on v2. Two files.

  Wiring, cmd/provenance/complete_cmd.go (cobra package): a top-level command,
  use "complete", short "Mark an open record as implemented (seals it at
  HEAD)", arity none. Flags, none with a short form or default:
  - record (string): "Record to mark as implemented"
  - force (bool): "Skip the spec existence check and spec runs"

  Logic, cmd/provenance/complete_run.go (go package, package main). Imports,
  each its own addImport, exactly these: errors, fmt, io, os, path/filepath,
  sort, strings, github.com/spf13/cobra,
  github.com/livecodelife/provenance/lint,
  github.com/livecodelife/provenance/record,
  github.com/livecodelife/provenance/scope. All output goes to out; errors
  are printed with r.fail. Declarations:
  - func commitsForRecord(r *repo, rec *record.Record) []string: for rec.ID
    and each of rec.Aliases, out, err := r.git("log", "--all", "-E",
    "--grep", `\[`+id+`(@[0-9]+)?\]`, "--format=%H") (skip on error); collect
    the non-empty lines without duplicates, in order.
  - func filesInCommits(r *repo, commits []string) []string: for each commit,
    r.git("show", "--name-only", "--format=", c); the union of the non-empty
    lines, sorted.
  - func overlappingSealed(self *record.Record, all []*record.Record, files
    []string) []*record.Record: the records in all, other than self, whose
    Status is record.StatusImplemented and SealedAtSHA is not empty, for
    which scope.InScope(rec, f) is true for at least one f in files (an
    InScope error counts as false). In the order of all.
  - func overlapMode(v string) string: "warn" and "off" are themselves;
    anything else (including "" and "block") is "block".
  - func recordList(recs []*record.Record) string: one "    · <id> — <title>\n"
    line per record.
  - func runComplete(out io.Writer, cmd *cobra.Command, args []string) error:
    1. r, err := openRepo(cmd); id from the record flag (empty:
       errors.New(`required flag(s) "record" not set`)); force flag. rec, doc,
       err := r.resolve(id); return err. Load every record of r.Store.List()
       into all (return errors).
    2. rec.Schema != 2: r.fail("Cannot complete %s: it is a v1 record; run
       'provenance migrate' first.", rec.ID), return an error.
    3. rec.Status == record.StatusImplemented: r.fail("Record %s is already
       implemented", rec.ID), return errors.New("already implemented").
    4. err := lint.CheckTransition(rec.Status, record.StatusImplemented,
       false): r.fail("Cannot complete %s: %v", rec.ID, err), return err.
    5. Unless force: the associated specs whose filepath.Join(r.Root, path)
       does not exist (os.Stat). Any: r.fail("Cannot mark %s as
       implemented\n\n  The following associated specs do not exist on
       disk:\n%s\n  Create the missing spec files or remove them from\n
       associated_specs before completing this record.", rec.ID, lines of
       "    · <path>  ✗ not found\n"), return errors.New("missing specs").
    6. head, err := r.git("rev-parse", "HEAD"): r.fail("Failed to get HEAD
       SHA: %v", err), return err.
    7. rel := r.recordPath(rec.ID); states := snapshotFiles(filepath.Join(r.Root,
       rel)); orig := rec.Status. rollback := func(unstage bool) {
       restoreFiles(states); if unstage { r.unstage(rel) } }. rolled :=
       fmt.Sprintf("  The transition was rolled back — %s is unchanged (still
       %s).", rec.ID, orig).
    8. rec.Status = record.StatusImplemented; rec.SealedAtSHA = head; if err
       := r.Store.Save(rec, doc); err != nil { rollback(false); r.fail("Failed
       to save record: %v", err); return err }.
    9. Lint gate: res, err := lintRepo(r, ""); on error rollback(false) and
       return it. rres := recordLint(res, rec.ID). If rres.ErrorCount > 0:
       rollback(false); r.fail("Cannot complete %s: sealing it would make it
       implemented, but it does not pass validation:\n\n%s\n%s\n  Fix the
       errors above and run 'provenance complete' again.", rec.ID, one
       "    · <message> (<field>)\n" line per error issue, rolled); return
       errors.New("record failed validation").
    10. Own specs: var outcomes []specOutcome. Unless force, when
        r.Config.RunAssociatedSpecsOnComplete and the record has associated
        specs: fmt.Fprintf(out, "\nRunning %d associated spec(s) for
        %s...\n\n", n, rec.ID); _, failed, outcomes = runRecordSpecs(out, r,
        rec, nil). failed: rollback(false); r.fail("Cannot complete %s: one
        or more of its own associated specs failed.\n\n%s\n  Fix the failing
        spec(s) above and run 'provenance complete' again.", rec.ID, rolled);
        return errors.New("associated spec failed").
    11. Overlap teeth: mode := overlapMode(r.Config.OverlapSpecsOnComplete).
        Unless mode is "off": touched := overlappingSealed(rec, all,
        filesInCommits(r, commitsForRecord(r, rec))). When touched is not
        empty: seen := map[string]bool{}; for each t in touched: when
        RunAssociatedSpecsOnComplete is false or t has no associated specs,
        t is unverified; otherwise fmt.Fprintf(out, "\nVerifying sealed
        record %s touched by this change (%s)...\n", t.ID, t.Title); ran,
        failed, _ := runRecordSpecs(out, r, t, seen); failed adds t to
        failedRecs; !ran adds t to unverified.
        a. failedRecs not empty and mode "block": rollback(false);
           r.fail("Cannot complete %s: it changes files governed by a sealed
           record whose specs now fail.\n\n%s\n  A sealed record's proven
           behavior appears broken by this change, so completion is
           blocked.\n%s\n  Fix the failing spec(s) above, or revise the
           affected record, then run 'provenance complete' again.\n  (To
           downgrade this gate, set overlap_specs_on_complete: warn|off in
           .provenance.yml.)", rec.ID, recordList(failedRecs), rolled);
           return errors.New("overlapping sealed record spec failed").
        b. failedRecs not empty (warn): fmt.Fprintf(out, "\nℹ Governance
           overlap (non-blocking, warn mode): specs of sealed record(s) you
           touched failed:\n\n%s\n  Completion proceeds because
           overlap_specs_on_complete is 'warn'. If the failure is real, fix
           it or revise the affected record.\n\n", recordList(failedRecs)).
        c. unverified not empty: fmt.Fprintf(out, "\nℹ Governance overlap
           (non-blocking): this change also touches files governed by sealed
           record(s):\n\n%s\n  No runnable specs were available to
           auto-verify them. If your change conflicts with their intent,
           revise them.\n\n", recordList(unverified)).
    12. When r.Config.CommitOnStatusChange: msg := "Complete provenance
        record " + tag(rec.ID, rec.Version); if err := r.commit(msg, rel);
        err != nil { rollback(true); r.fail("Cannot complete %s: the
        auto-commit was rejected:\n\n    %v\n\n%s Nothing was
        staged.\n  Resolve the issue above (e.g. a failing pre-commit hook)
        and run 'provenance complete' again.", rec.ID, err, rolled); return
        err }.
    13. fmt.Fprintf(out, "\n✓ %s marked as implemented\n\n", rec.ID). When
        outcomes is not nil: "  Associated specs verified:\n", then per
        outcome fmt.Fprintf(out, "    · %-50s %s\n", o.Path, s) with s "✓
        passed", "✗ failed" or "(skipped — no type or run_command)" by
        o.Status; then "\n". Return nil.

  Helpers that already exist in package main (call them; do not redefine
  them): func openRepo(cmd *cobra.Command) (*repo, error); type repo struct {
  Root string; Config config; Store *record.FilesStore; ... } where config has
  RunAssociatedSpecsOnComplete bool, OverlapSpecsOnComplete string,
  CommitOnStatusChange bool; func (r *repo) resolve(id string)
  (*record.Record, *record.Document, error), which prints its own message;
  func (r *repo) recordPath(id string) string (relative to r.Root); func (r
  *repo) git(args ...string) (string, error) (runs in r.Root, trims output);
  func (r *repo) commit(message string, paths ...string) error; func (r
  *repo) unstage(paths ...string); func (r *repo) fail(format string, args
  ...any); func snapshotFiles(paths ...string) []fileState; func
  restoreFiles(states []fileState); func tag(id string, version int) string;
  func lintRepo(r *repo, enforcement string) (*lint.Result, error); func
  recordLint(res *lint.Result, id string) *lint.Result (ErrorCount int;
  Issues []lint.Issue with Message, Field string, Severity lint.Severity);
  type specOutcome struct { Path, Status string }; func runRecordSpecs(out
  io.Writer, r *repo, rec *record.Record, seen map[string]bool) (ran bool,
  failed bool, outcomes []specOutcome). Libraries: record.StatusImplemented;
  record.Record fields ID, Title, Status, Version int, SealedAtSHA, Aliases
  []string, Schema int, AssociatedSpecs []record.AssociatedSpec{Path string};
  (*record.FilesStore).List() ([]string, error), .Load(id), .Save(r, doc)
  error; lint.CheckTransition(from, to record.Status, bump bool) error;
  lint.SeverityError; scope.InScope(r *record.Record, filePath string) (bool,
  error).
constraints:
  - 'Both files are grown by sedum-haiku (--only prov-2026-41fb548c): wiring with cobra, logic with go. Nothing in them is hand-written; a wrong result is fixed by revising this record and regrowing.'
