id: prov-2026-c896ac2d
title: init and migrate write .gitattributes for generated provenance files
type: blueprint
status: implemented
version: 3
reason: gitattributes test no longer sets the removed tool variable
created_at: "2026-10-16"
author: calebcowen@gmail.com
intent: |-
  Snapshots (provenance/.versions/**), evidence (provenance/.evidence/**) and the version manifest (.provenance/versions.jsonl) are machine-written. A migrated repo adds hundreds of them (linespec: 526 snapshot files, 26k lines in one PR), which buries the real change in review. Mark them generated so GitHub collapses them in PR diffs and `git diff` skips them.

  `provenance init` and `provenance migrate` write these three lines to the repo root .gitattributes (the records dir is config `dir`, "provenance" by default; the lines follow it):

    provenance/.versions/** linguist-generated=true -diff
    provenance/.evidence/** linguist-generated=true -diff
    .provenance/versions.jsonl linguist-generated=true -diff

  Rules: append-only (existing lines are never edited, reordered or removed); idempotent (a line already present, compared after trimming, is not added again, so a second run changes nothing and says "unchanged"); the file is created when missing; a final newline is added to the existing file only when needed before appending. The commands say what they did ("created"/"updated"/"unchanged  .gitattributes", listing the added lines). `migrate --plan` writes nothing. `migrate` writes it with the other migrated files so it lands in the one migration commit. A write failure fails the command.

  Decision on the manifest: it is marked -diff too. Each line is only id, version and content_hash; there is nothing a reviewer reads there that the record's own diff does not show. `git diff` skips it, `git diff --text` and `git show --text` still show it, and `provenance diff/history` are the human views. Same for evidence (JSON of hashes and results) and snapshots (the exact bytes of a sealed version, readable with `provenance diff`).

  Code: one new helper file cmd/provenance/gitattributes_run.go (ensureGitattributes(root, dir) returning the status and added lines), called from runInit and runMigrate. The .gitattributes file is not a governed path (exclude_paths).
constraints:
  - 'Append-only and idempotent: never edit, reorder or remove existing lines; a second run changes nothing.'
  - migrate --plan and any failed run write no .gitattributes.
  - Tests use a temp dir; no git beyond the isolation in common_test.go.
