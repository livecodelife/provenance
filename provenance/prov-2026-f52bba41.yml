intent: APIError is an error answer from the record server.
constraints:
  - APIError is an exported struct type.
  - APIError has four exported fields, declared in the order Status, Code, Message, RequestID.
  - Field Status is an int, the HTTP status of the answer.
  - Field Code is a string, the error code of the answer.
  - Field Message is a string, the error message of the answer.
  - Field RequestID is a string, the request id the server attached to the answer, empty when none was accepted.
  - The fields carry no struct tags.
  - APIError has no field that holds a request body or a token.
  - This unit declares only the type; its Error method is defined by another unit.
  - This unit adds no imports to the file.
