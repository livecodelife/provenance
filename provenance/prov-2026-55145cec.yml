intent: the mergeIsAutomatic function reports whether a merge commit's tree equals git's automatic merge of its two parents.
constraints:
  - The function receives a pointer to a repo, a tree id string and a slice of parent commit id strings, in that order
  - The function returns a single bool
  - The repo parameter is a pointer to the repo struct defined in common_run.go of package main
  - The function returns false when the parents slice does not have exactly two entries
  - 'The function calls autoMergeTree (defined in the same file; parameters in order: a pointer to a repo, the first revision string, the second revision string; returns the tree id string, the conflicted paths as a slice of strings, and an error) with the repo, the first parent and the second parent'
  - The function returns false when autoMergeTree returns an error
  - 'The function runs git through the repo git method (defined in common_run.go; parameter: variadic strings; returns trimmed standard output as a string and an error) with the arguments diff-tree, -r, --name-only, --no-renames, the automatic tree id, the given tree id, in that order'
  - The function returns false when that git command fails
  - The function reads the differing paths as the non-empty lines of that command's output
  - The function returns true when no path differs between the automatic tree and the given tree
  - The function returns true only when every differing path is equal to manifestPath, the string constant of package main naming the version manifest file, and is also one of the conflicted paths returned by autoMergeTree
  - The function returns false when any differing path is not manifestPath
  - The function returns false when manifestPath differs but was not among the conflicted paths
  - The function adds no imports and uses strings, whose import is owned by another declaration in the same file
affected_scope:
  - cmd/provenance/merge_exempt_run.go
