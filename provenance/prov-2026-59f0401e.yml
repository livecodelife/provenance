intent: |-
  Clone and import (blueprint prov-2026-fe19dbf4, sections 5 and 6), remote/clone.go and remote/import.go. Behaviour is fixed by remote/clone_import_test.go. CloneRecords writes every version of the caller's records (or the named ids) into a record.FilesStore through Append, which verifies each content hash, then saves the current record from the head (status, version and the newest version's reason). PlanImport compares each local record with the server's versions: a shared version number whose contentHash differs refuses the record with a message that says to revise locally; remote versions beyond the local latest are the plan (their origin is reported); a record the server does not know is ignored. ApplyImport appends the snapshots and rewrites the current record from the newest one, keeping each spec's local run_command by path, keeping the local status except that implemented returns to open, and clearing nothing else.

