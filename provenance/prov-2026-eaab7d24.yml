id: prov-2026-eaab7d24
title: auth.Manager.fresh
type: imprint
status: open
version: 3
reason: Split compound constraints and tighten collaborator wording
created_at: "2026-10-22"
author: calebcowen@gmail.com
intent: The fresh method says whether a credential's access token can still be used without refreshing.
constraints:
  - fresh is an unexported method with a pointer receiver of type Manager.
  - fresh takes one parameter, c, a pointer to Credential, and returns a bool.
  - now is a method of Manager defined elsewhere in package auth, with no parameters, returning time.Time.
  - refreshMargin is a time.Duration constant defined elsewhere in package auth.
  - Credential is a struct type defined elsewhere in package auth, with the string field AccessToken and the time.Time field AccessExpiresAt.
  - time.Time methods Add and Before come from the standard-library package time.
  - This unit does not change the file's imports.
  - fresh returns true when the access token of c is not empty and now() plus refreshMargin is strictly before the access expiry of c, and returns false otherwise.
  - fresh reads no field of the Manager directly; it only calls the method now.
  - The Manager has no lowercase fields; its fields are the exported Store, Client, LockPath and Now.
affected_scope:
  - auth/session.go
forbidden_scope:
  - auth/credential.go
  - auth/store.go
  - auth/keyring_system.go
  - auth/client.go
