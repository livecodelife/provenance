id: prov-2026-409e803e
title: 'provenance CLI, part 2: lint, complete, deprecate, run-specs, check --staged, hooks'
status: open
version: 14
reason: Drop the ownership note
created_at: "2026-10-15"
author: calebcowen@gmail.com
intent: The commands the git hooks and the completion flow need (lint, complete, deprecate, run-specs, check --staged, hooks install), so the provenance repo can work through provenance. One imprint per command; each states its own flags, output and edge cases. The manifest is written by one shared definition, so writer and lint agree.
constraints:
  - Tests touching git follow cmd/provenance TestMain isolation (temp HOME and config, explicit GIT_DIR/-C, refuse dirs outside the temp root).
  - With a configuration file below the git top level, check --staged matches staged paths against scope and exemptions relative to the configuration's directory.
  - With a configuration file below the git top level, check --staged does not govern staged files outside the configuration's directory.
  - In a temp clone of the provenance repo with the hooks installed by provenance hooks install, a commit tagged with a record whose scope covers all its files passes check
  - In a temp clone of the provenance repo with the hooks installed, an untagged commit is refused
  - In a temp clone of the provenance repo with the hooks installed, a tagged commit with a file outside the tagged record's scope is refused
  - In a temp clone of the provenance repo with the hooks installed, after a record is revised, a commit tagged with that record's id and version 2 passes
  - In a temp clone of the provenance repo with the hooks installed, complete runs the record's specs and auto-commits
  - In a temp clone of the provenance repo with the hooks installed, a staged edit of an existing snapshot file is refused
  - In a temp clone of the provenance repo with the hooks installed, lint reports 0 errors
  - No edits to record, migrate, lint, scope, stale or evidence.
affected_scope:
  - cmd/provenance/**
forbidden_scope:
  - record/**
  - migrate/**
  - lint/**
  - scope/**
  - stale/**
  - evidence/**
type: blueprint
related:
  - prov-2026-60e72d0e
  - prov-2026-575d0238
sealed_at_sha: ""
associated_specs:
  - path: cmd/provenance/common_test.go
    run_command: go test ./cmd/provenance/ -count=1
  - path: cmd/provenance/testdata/e2e.sh
    run_command: sh {{path}}
  - path: cmd/provenance/check_migration_test.go
    run_command: go test ./cmd/provenance/ -count=1 -run TestCheckPassesTheMigrationCommit\|TestCheckStillRejectsTransitions
associated_traces: []
monitors: []
tags:
  - cli
  - dogfood
