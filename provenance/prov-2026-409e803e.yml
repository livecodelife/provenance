id: prov-2026-409e803e
title: 'provenance CLI, part 2: lint, complete, deprecate, run-specs, check --staged, hooks'
status: open
version: 12
reason: The sedum-specific rules leave provenance; the intent keeps only the shape of part 2
created_at: "2026-10-15"
author: calebcowen@gmail.com
intent: |-
  The commands the git hooks and the completion flow need, so the provenance repo can work through `provenance` (part 2, after part 1, prov-2026-60e72d0e). One imprint per command; each states its own flags, output and edge cases.
  - lint: report the problems in the records, for all of them or one, and fail when there are errors unless enforcement says warn.
  - complete: seal an open record as implemented once its specs, and the specs of the sealed records its files overlap, pass; any failure leaves everything as it was.
  - deprecate: retire a record, with a reason.
  - run-specs: the pre-commit hook's entry point; runs a record's specs.
  - check --staged: refuse a commit whose staged files are not covered by a tagged record, whose tag names an implemented record or a wrong version, or that rewrites history; staged content is read from the index, not the working tree.
  - hooks install: install the pre-commit and commit-msg hooks, keeping any hook it replaces as <hook>.bak.
  The manifest is written by one shared definition, so writer and lint agree.
constraints:
  - Tests touching git follow cmd/provenance TestMain isolation (temp HOME and config, explicit GIT_DIR/-C, refuse dirs outside the temp root).
  - 'Done when, on a temp clone of provenance migrated by `provenance migrate`, with `provenance hooks install`: a tagged in-scope commit passes, an untagged or out-of-scope one is refused, revise -> commit [id@2] passes, complete runs specs and auto-commits, a staged edit of an existing snapshot is refused, and lint reports 0 errors.'
  - No edits to record, migrate, lint, scope, stale or evidence (prov-lib owns them).
  - With a configuration file below the git top level, check --staged matches staged paths against scope and exemptions relative to the configuration's directory.
  - With a configuration file below the git top level, check --staged does not govern staged files outside the configuration's directory.
affected_scope:
  - cmd/provenance/**
forbidden_scope:
  - record/**
  - migrate/**
  - lint/**
  - scope/**
  - stale/**
  - evidence/**
type: blueprint
related:
