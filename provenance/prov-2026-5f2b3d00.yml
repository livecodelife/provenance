intent: the blobOf function resolves a git object specification to its object id.
constraints:
  - The function receives a pointer to a repo and a specification string, in that order
  - The function returns a string
  - The function runs the repo's git method (variadic string arguments; returns trimmed standard output and an error) with rev-parse, -q, --verify and the specification
  - The function returns the empty string when git fails
  - Otherwise the function returns the trimmed output
  - The repo parameter is a pointer to the repo struct defined in common_run.go of package main
  - The repo's git method takes a variadic list of string arguments, runs git in the repo root and returns the trimmed standard output as a string and an error
  - The function adds no imports
