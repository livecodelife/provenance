intent: the pendingMergeParents function lists the parents of the merge commit that is being prepared, if any.
constraints:
  - The function receives a pointer to a repo
  - The function returns a slice of strings and no error
  - The repo parameter is a pointer to the repo struct defined in common_run.go of package main
  - A path returned by git that is relative is resolved against the repo root directory held in the Root field of the repo
  - The function returns a nil slice when the merge-head file does not exist or cannot be read
  - The first element of the result is the full commit id of HEAD
  - The following elements are the commit ids listed in the merge-head file, in file order, one per line
  - Blank lines in the merge-head file are skipped and surrounding whitespace on a line is removed
  - A merge-head file with several ids, as in an octopus merge, gives a result with more than two elements
  - The function owns the imports of os and path/filepath, each as a value import of the standard library
  - The function adds no import for strings and uses it from the import owned by another declaration in the same file
  - The function finds the merge-head file path by running git through the repo git method (defined in common_run.go; variadic string parameters; returns trimmed standard output and an error) with the arguments rev-parse, --git-path, MERGE_HEAD
  - The function returns a nil slice when the git rev-parse --git-path call fails
  - The function gets the id of the current commit by running git rev-parse HEAD through the repo git method
  - The function returns a nil slice when the git rev-parse HEAD call fails
