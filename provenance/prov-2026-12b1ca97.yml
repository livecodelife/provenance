id: prov-2026-12b1ca97
title: provenance status command
status: draft
created_at: "2026-10-15"
author: calebcowen@gmail.com
intent: |
  The provenance status command: a top-level command, use "status", short "Show record status", arity none. Flags:
    - record (string): "Show detailed status for a record"
    - filter (string): "Filter by status (draft|open|implemented|deprecated) or tag:name"
    - format (string): "Output format (human|json)"
  No flag has a short form. No flag has a default value.

  Behaviour: Ports linespec's status table and --record detail view, with the ID column showing <id>@<version> and the detail view adding Version, Reason (with fix), Aliases and Implements <id>@<pinned version>. Supersedes lines are gone. JSON keeps linespec's {"records": [...]} / {"record": ...} shape with v2 field names. auto_affected_scope and --save-scope are not ported (they need scope observation from part 2).
constraints:
  - 'Wiring is grown by sedum-haiku with the cobra package (--only prov-2026-12b1ca97); logic is grown where an action can express it, otherwise hand-written in status_run.go as a listed bridge file of prov-2026-60e72d0e.'
