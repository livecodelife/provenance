intent: Logout asks the auth service to revoke the refresh token family.
constraints:
  - Logout is an exported method with a pointer receiver of type Client, taking ctx (context.Context) and refreshToken (string), and returning an error.
  - 'It sends POST /auth/logout through do (parameters in order: ctx context.Context, method string, path string, bearer string, in any, out any; returns error).'
  - The bearer passed to do is empty.
  - The request body is a JSON object with the single key refresh_token set to refreshToken.
  - The out argument passed to do is nil, so no response is decoded.
  - It returns the error from do unchanged.
  - It returns nil on success.
  - This method does not change the file's imports.
  - context.Context comes from package context.
  - http.MethodPost comes from package net/http.
