intent: DefaultFilePath returns where the credential file lives by default, under the home directory.
constraints:
  - DefaultFilePath is an exported package-level function taking no arguments and returning a string and an error.
  - It finds the home directory with os.UserHomeDir, which takes no arguments and returns a string and an error.
  - 'If os.UserHomeDir fails it returns an empty string and an error whose message is "cannot find the home directory: " followed by the underlying error message.'
  - That error wraps the underlying error so that errors.Is and errors.Unwrap can reach it.
  - On success it returns the path made of the home directory, then a directory named ".provisio", then a file named "credentials", and a nil error.
  - The function does not create, read or stat any file or directory.
  - os.UserHomeDir comes from package os.
  - fmt.Errorf comes from package fmt.
  - filepath.Join comes from package path/filepath.
  - This unit does not change the file's imports.
