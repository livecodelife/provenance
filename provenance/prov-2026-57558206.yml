intent: The planError function turns a document plan into the error that makes the command exit non-zero when the plan has conflicts or problems.
constraints:
  - The function is in package main and uses fmt from the imports of the file.
  - planError takes a pointer to a document Plan and returns an error.
  - planError returns nil when the plan has no conflicts and no problems.
  - Otherwise planError returns an error whose message is document plan has N conflicts and M problems, with N the number of conflicts and M the number of problems in decimal digits.
