intent: |
  The provenance lint command, in two files.

  Wiring, cmd/provenance/lint_cmd.go (cobra package): a top-level command,
  use "lint", short "Validate provenance records", arity none. Flags, none
  with a short form or default:
  - record (string): "Lint a single record"
  - enforcement (string): "Override enforcement (none|warn|strict)"
  - format (string): "Output format (human|json)"
  - warn (bool): "Show only warnings in output"
  - info (bool): "Show only informational hints in output"
  - all (bool): "Show all output (errors, warnings, and hints)"

  Logic, cmd/provenance/lint_run.go (go package, package main). Imports,
  each its own addImport, exactly these: encoding/json, errors, fmt, io,
  github.com/spf13/cobra, github.com/livecodelife/provenance/lint. All
  output goes to out. Declarations:
  - type lintIssueJSON struct { RecordID string `json:"record_id"`; Field
    string `json:"field"`; Message string `json:"message"`; Severity string
    `json:"severity"`; Rule string `json:"rule"` }
  - type lintJSON struct { Enforcement string `json:"enforcement"`; Total
    int `json:"total"`; Passed int `json:"passed"`; Warnings int
    `json:"warnings"`; Errors int `json:"errors"`; Issues []lintIssueJSON
    `json:"issues"` }
  - func lintRepo(r *repo, enforcement string) (*lint.Result, error):
    enforcement falls back to r.Config.Enforcement, then "none". Names are
    the Name of each r.Config.SharedRepos entry. Returns lint.Lint(r.Store,
    lint.Options{Root: r.Root, Enforcement: enforcement, ExcludePaths:
    r.Config.ExcludePaths, SharedRepos: names, ManifestPath: manifestPath}).
    Other commands (complete, the pre-commit hook) call it too.
  - func recordLint(res *lint.Result, id string) *lint.Result: a new Result
    with only the issues whose RecordID is id, Records 1, Enforcement
    copied, ErrorCount, WarningCount and HintCount counted from those issues
    by Severity (lint.SeverityError, lint.SeverityWarning,
    lint.SeverityHint), and PassedCount 1 when there are no errors and no
    warnings, else 0.
  - func runLint(out io.Writer, cmd *cobra.Command, args []string) error:
    1. r, err := openRepo(cmd); read every flag. format other than "",
       "human" or "json" is fmt.Errorf("unknown format %q (human|json)", format).
    2. res, err := lintRepo(r, enforcement flag); return err.
    3. When --record is set: rec, _, err := r.resolve(record); return err;
       res = recordLint(res, rec.ID).
    4. total := res.PassedCount + res.WarningCount + res.ErrorCount.
    5. JSON: encode lintJSON{res.Enforcement, total, PassedCount,
       WarningCount, ErrorCount, issues (an empty list, not null)} with
       json.NewEncoder(out) and SetIndent("", "  ").
    6. Human (linespec's format): "\n✓ Linting %d provenance records
       (enforcement: %s)\n\n" (total, res.Enforcement). Then each issue in
       order that the filter shows: by default errors only; --warn warnings
       only; --info hints only; --all everything. Each as
       fmt.Fprintf(out, "  %s %-15s %s %s\n", symbol, issue.RecordID,
       issue.Message, field) with symbol ✗ for errors, ⚠ for warnings, →
       for hints, and field "(<Field>)" or "" when Field is empty. Then
       "\n✓ %d passed  ⚠ %d warnings  ✗ %d errors\n" (passed, warnings,
       errors). When there are errors and enforcement is strict, add
       "\n  Hint: Associate LineSpec files with open records or set status
       to\n       'implemented' if proof already exists outside of
       LineSpec.\n". End with "\n".
    7. Return errors.New("lint failed") when res.ErrorCount > 0, else nil.

  Helpers that already exist in package main (call them; do not redefine
  them): func openRepo(cmd *cobra.Command) (*repo, error); type repo struct
  { Root string; Config config; Store *record.FilesStore; ... } where config
  has Enforcement string, ExcludePaths []string and SharedRepos
  []sharedRepo (sharedRepo has Name string); func (r *repo) resolve(id
  string) (*record.Record, *record.Document, error), which prints its own
  message; const manifestPath. Lint library: lint.Lint(store record.Store,
  opts lint.Options) (*lint.Result, error); lint.Options{Root, Enforcement
  string; ExcludePaths []string; SharedRepos []string; ManifestPath
  string}; lint.Result{Issues []lint.Issue; Records, PassedCount,
  ErrorCount, WarningCount, HintCount int; Enforcement string};
  lint.Issue{Rule, RecordID, Field, Message string; Severity lint.Severity};
  lint.SeverityError, lint.SeverityWarning, lint.SeverityHint.
