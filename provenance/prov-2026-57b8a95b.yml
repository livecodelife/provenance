intent: |-
  The provenance edit command: field-level changes without an editor, for
  scripts and agents. Two files.

  Wiring, cmd/provenance/edit_cmd.go (cobra package): a top-level command,
  use "edit [id]", short "Change a record's content fields without an editor
  and save a new version", arity max_one. Flags, none with a short form or
  default:
  - record (string): "Record to edit (or give it as the argument)"
  - title (string): "New title"
  - intent (string): "New intent"
  - add-constraint (strings): "Append a constraint (repeatable)"
  - remove-constraint (strings): "Remove constraint number n, counting from 1 (repeatable)"
  - add-scope (strings): "Append an affected_scope entry (repeatable)"
  - remove-scope (strings): "Remove an affected_scope entry by value (repeatable)"
  - add-forbidden (strings): "Append a forbidden_scope entry (repeatable)"
  - remove-forbidden (strings): "Remove a forbidden_scope entry by value (repeatable)"
  - reason (string): "Why this version exists (required for a new version)"
  - fix (bool): "Mark this version as a fix (reason_kind: fix)"
  - add-spec (strings): "Add an associated spec: <path> or <path>:<run_command> (repeatable; the file must exist)"
  - remove-spec (strings): "Remove an associated spec by path (repeatable)"
  - set-spec (strings): "Change an associated spec: <old>=<new> or <old>=<new>:<run_command> (repeatable)"
  - refresh-specs (bool): "Record that the associated specs' content changed on disk (a new version; needs --reason)"

  Logic, cmd/provenance/edit_run.go (go package, package main). --add-spec and --remove-spec change the associated specs of a draft (saved in place) or of an open or implemented record (a new version, --reason required): removals are applied first, then additions; an addition refuses an empty path, a path that is already an associated spec and a file that does not exist; a removal refuses a path that is not an associated spec; everything is validated before anything is written (applySpecChanges). Imports, each its own addImport, exactly these: errors, fmt, os, path/filepath, sort, strconv, github.com/spf13/cobra, io, strings, github.com/livecodelife/provenance/record.

  Declarations, in this order, each exactly one set* call whose code kwarg is the code below verbatim (gofmt-formatted, comments kept). Do not alter, reorder or add anything.

    - setFunction name removeValues, code exactly:
        func removeValues(list, values []string, field string) ([]string, error) {
        	out := append([]string{}, list...)
        	for _, value := range values {
        		idx := -1
        		for i, item := range out {
        			if item == value {
        				idx = i
        				break
        			}
        		}
        		if idx < 0 {
        			return nil, fmt.Errorf("%s has no entry %q", field, value)
        		}
        		out = append(out[:idx], out[idx+1:]...)
        	}
        	return out, nil
        }
    - setFunction name removeIndexes, code exactly:
        func removeIndexes(list []string, indexes []string) ([]string, error) {
        	seen := map[int]bool{}
        	var positions []int
        	for _, raw := range indexes {
        		n, err := strconv.Atoi(raw)
        		if err != nil || n < 1 || n > len(list) {
        			return nil, fmt.Errorf("--remove-constraint %s: no constraint number %s (there are %d)", raw, raw, len(list))
        		}
        		if !seen[n] {
        			seen[n] = true
        			positions = append(positions, n)
        		}
        	}
        	sort.Sort(sort.Reverse(sort.IntSlice(positions)))
        	out := append([]string{}, list...)
        	for _, n := range positions {
        		out = append(out[:n-1], out[n:]...)
        	}
        	return out, nil
        }
    - setFunction name applySpecChanges, code exactly:
        func applySpecChanges(r *repo, specs []record.AssociatedSpec, adds, removes []string) ([]record.AssociatedSpec, error) {
        	out := append([]record.AssociatedSpec(nil), specs...)
        	for _, rm := range removes {
        		at := -1
        		for i := range out {
        			if out[i].Path == rm {
        				at = i
        				break
        			}
        		}
        		if at < 0 {
        			var have []string
        			for _, s := range out {
        				have = append(have, s.Path)
        			}
        			return nil, fmt.Errorf("--remove-spec: no associated spec %q (has: %s)", rm, strings.Join(have, ", "))
        		}
        		out = append(out[:at], out[at+1:]...)
        	}
        	for _, add := range adds {
        		path, runCmd, hasCmd := strings.Cut(add, ":")
        		if path == "" {
        			return nil, fmt.Errorf("--add-spec %q: want path or path:run_command", add)
        		}
        		for _, s := range out {
        			if s.Path == path {
        				return nil, fmt.Errorf("--add-spec: %q is already an associated spec", path)
        			}
        		}
        		if _, err := os.Stat(filepath.Join(r.Root, path)); err != nil {
        			return nil, fmt.Errorf("--add-spec: %q does not exist: create the proof file first", path)
        		}
        		spec := record.AssociatedSpec{Path: path}
        		if hasCmd {
        			spec.RunCommand = runCmd
        		}
        		out = append(out, spec)
        	}
        	return out, nil
        }
    - setFunction name runEdit, code exactly:
        func runEdit(out io.Writer, cmd *cobra.Command, args []string) error {
        	r, err := openRepo(cmd)
        	if err != nil {
        		return err
        	}
        	id, err := recordArg(cmd, args)
        	if err != nil {
        		return err
        	}
        	rec, doc, err := r.resolve(id)
        	if err != nil {
        		return err
        	}
        	if err := versionable(r, rec); err != nil {
        		return err
        	}
        	flags := cmd.Flags()
        	if !flags.Changed("title") && !flags.Changed("intent") && !flags.Changed("add-constraint") && !flags.Changed("remove-constraint") && !flags.Changed("add-scope") && !flags.Changed("remove-scope") && !flags.Changed("add-forbidden") && !flags.Changed("remove-forbidden") && !flags.Changed("refresh-specs") && !flags.Changed("set-spec") && !flags.Changed("add-spec") && !flags.Changed("remove-spec") {
        		return errors.New("nothing to edit: pass a field flag such as --intent or --add-constraint")
        	}
        	if flags.Changed("title") {
        		title, _ := flags.GetString("title")
        		rec.Title = title
        	}
        	if flags.Changed("intent") {
        		intent, _ := flags.GetString("intent")
        		rec.Intent = intent
        	}
        	removeC, _ := flags.GetStringArray("remove-constraint")
        	addC, _ := flags.GetStringArray("add-constraint")
        	constraints, err := removeIndexes(rec.Constraints, removeC)
        	if err != nil {
        		return err
        	}
        	rec.Constraints = append(constraints, addC...)
        	removeS, _ := flags.GetStringArray("remove-scope")
        	addS, _ := flags.GetStringArray("add-scope")
        	scope, err := removeValues(rec.AffectedScope, removeS, "affected_scope")
        	if err != nil {
        		return err
        	}
        	rec.AffectedScope = append(scope, addS...)
        	removeF, _ := flags.GetStringArray("remove-forbidden")
        	addF, _ := flags.GetStringArray("add-forbidden")
        	forbidden, err := removeValues(rec.ForbiddenScope, removeF, "forbidden_scope")
        	if err != nil {
        		return err
        	}
        	rec.ForbiddenScope = append(forbidden, addF...)
        	setSpecs, _ := flags.GetStringArray("set-spec")
        	specs, err := applySpecEdits(rec.AssociatedSpecs, setSpecs)
        	if err != nil {
        		return err
        	}
        	addSpecs, _ := flags.GetStringArray("add-spec")
        	removeSpecs, _ := flags.GetStringArray("remove-spec")
        	specs, err = applySpecChanges(r, specs, addSpecs, removeSpecs)
        	if err != nil {
        		return err
        	}
        	rec.AssociatedSpecs = specs
        	reason, _ := flags.GetString("reason")
        	fix, _ := flags.GetBool("fix")
        	return saveVersion(out, r, rec, doc, reason, fix)
        }
    - setFunction name applySpecEdits, code exactly:
        func applySpecEdits(specs []record.AssociatedSpec, edits []string) ([]record.AssociatedSpec, error) {
        	out := append([]record.AssociatedSpec(nil), specs...)
        	for _, e := range edits {
        		old, rest, ok := strings.Cut(e, "=")
        		if !ok || old == "" || rest == "" {
        			return nil, fmt.Errorf("--set-spec %q: want <old>=<new> or <old>=<new>:<run_command>", e)
        		}
        		newPath, runCmd, hasCmd := strings.Cut(rest, ":")
        		at := -1
        		for i := range out {
        			if out[i].Path == old {
        				at = i
        				break
        			}
        		}
        		if at < 0 {
        			var have []string
        			for _, s := range out {
        				have = append(have, s.Path)
        			}
        			return nil, fmt.Errorf("--set-spec: no associated spec %q (has: %s)", old, strings.Join(have, ", "))
        		}
        		out[at].Path = newPath
        		if hasCmd {
        			out[at].RunCommand = runCmd
        		}
        	}
        	return out, nil
        }
