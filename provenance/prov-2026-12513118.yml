id: prov-2026-12513118
title: auth.Client.Refresh
type: imprint
status: open
version: 2
reason: State that errors.As targets a pointer to OAuthError
created_at: "2026-10-21"
author: calebcowen@gmail.com
intent: Refresh trades a refresh token for a new access and refresh token pair.
constraints:
  - Refresh is an exported method with a pointer receiver of type Client, taking ctx (context.Context) and refreshToken (string), and returning a pointer to TokenResponse and an error.
  - 'It sends POST /auth/refresh through do (parameters in order: ctx context.Context, method string, path string, bearer string, in any, out any; returns error) with an empty bearer.'
  - The request body is a JSON object with the single key refresh_token set to refreshToken.
  - The response is decoded into a TokenResponse.
  - If do returns an OAuthError (defined elsewhere in package auth, with fields Code string, Description string, Status int and RetryAfter time.Duration) whose Code is invalid_grant, it returns nil and ErrSessionExpired.
  - If do returns an OAuthError whose Status is 401, it returns nil and ErrSessionExpired.
  - Any other error from do is returned with a nil result, unchanged.
  - On success it returns a pointer to the TokenResponse and nil.
  - Returned errors never contain the refresh token.
  - ErrSessionExpired is an error value defined elsewhere in package auth.
  - This method does not change the file's imports.
  - context.Context comes from package context.
  - errors.As comes from package errors.
  - http.MethodPost and http.StatusUnauthorized comes from package net/http.
  - The error that do returns for a non-success status is a pointer to OAuthError, so to inspect it the function declares a variable of type pointer-to-OAuthError and passes the address of that variable (a pointer to a pointer) to errors.As, never a variable of the plain OAuthError type.
affected_scope:
  - auth/client.go
