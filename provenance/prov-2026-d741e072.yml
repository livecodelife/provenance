id: prov-2026-d741e072
title: commitTree
type: imprint
status: open
version: 2
reason: 'Nested config: git reads and paths are relative to the config''s directory, so a config below the git top level governs only files under its directory'
created_at: "2026-10-22"
author: calebcowen@gmail.com
intent: the commitTree function extracts a commit's files into a fresh temporary directory.
constraints:
  - The function receives a pointer to a repo and a commit revision string, in that order
  - The function returns the directory path as a string, a cleanup function with no parameters and no result, and an error, in that order
  - The repo parameter is a pointer to the repo struct defined in common_run.go of package main
  - The function creates a new directory with os.MkdirTemp in the default temporary directory with the name prefix provenance-commit-
  - When the directory cannot be created the function returns an empty string, a nil cleanup function and that error
  - The repo root, the revision and the directory are passed to the shell script as positional arguments and not spliced into the script text
  - The command environment is the slice returned by the repo gitEnv method (defined in common_run.go; no parameters; returns a slice of strings)
  - The command's standard error is captured in a bytes.Buffer
  - When the command fails the function removes the new directory and all its content
  - When the command fails the function returns an empty string, a nil cleanup function and a non-nil error
  - The error text on failure is the text git archive followed by a space, then the revision, then a colon and a space, then the command's own error text, then a newline, then the captured standard error
  - The error on failure wraps the command's own error
  - On success the function returns the directory, a cleanup function that removes the directory and all its content, and a nil error
  - The function owns the imports of bytes, fmt, os and os/exec, each as a value import of the standard library
  - The function runs a shell through os/exec with the arguments sh and -c followed by a script
  - The script pipes the output of git -C with the repo root and archive with the revision into tar extracting into the new directory
  - 'The shell is given three extra arguments in this order: the repo root (the repo''s Root field) first, then the revision, then the new directory'
  - Because git archive runs in the repo root, the extracted directory holds only the files under that directory, at paths relative to it.
