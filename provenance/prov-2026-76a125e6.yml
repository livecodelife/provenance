intent: |
  The provenance binary's root command and its migrate command, which
  converts a repository's v1 records to v2.

  Root (bin provenance): use "provenance", short "Versioned provenance
  records". One persistent string flag, config, whose short form is c, usage
  "Config file (default .provenance.yml, else the provenance block of
  .linespec.yml)". No other flag in this record has a short form or a
  default value.

  migrate: a top-level command, use "migrate", short "Convert v1 records to
  versioned v2 records", taking no arguments. Flags:
  - plan (bool): "Print the migration plan and write nothing"
  - json (bool): "Print the plan as JSON (with --plan)"
  - accept-suggestions (bool): "Keep every suggested record separate"
  - keep-separate (strings): "Keep this absorbed record separate (repeatable)"
  - fold (strings): "Fold this record even when suggested to keep it separate (repeatable)"
  - workspace (string): "Directory holding local checkouts of shared repos (default: the repo's parent)"

  runMigrate and the helpers every command shares (config loading, store
  access, alias-aware id resolution, output) come from generator actions
  where any can express them (the `go` package); the rest is hand-written in
  migrate_run.go and common_run.go, each posted with the reason.
constraints:
  - Wiring is grown by sedum with the cobra package (sedum-haiku grow --only prov-2026-76a125e6); logic is grown where an action can express it and hand-written only in *_run.go files outside owned regions.
  - migrate --plan never writes. migrate refuses a dirty records directory and otherwise writes only through migrate.Apply into the FilesStore, plus the config move and hash-manifest removal described in prov-2026-60e72d0e.
  - The real-repo parity test skips a repository that already has .provenance.yml (it is on v2 and has nothing to migrate).
