intent: |-
  Session helpers for commands that need a Provisio session (blueprint prov-2026-ee401a6a, section 4), cmd/provenance/session_run.go. Local commands never call them and never read the credential store or the network (cmd/provenance/auth_offline_test.go). exitError carries a process exit status; exitCode(err) is 3 for it when code is 3 and 1 for any other error; sessionError maps auth.ErrNoSession, ErrSessionExpired and ErrTokenRejected to exit status 3 with the exact messages in the constants; sessionManager reads the server from PROVISIO_AUTH_URL, else from the stored credential, else the default; withSession(ctx, fn) is what publish, clone and import (M4) call. Also main.go: main() exits with os.Exit(exitCode(err)) instead of os.Exit(1) (a one-line hand edit in the bridge part of main.go, outside every generated region).

  File cmd/provenance/session_run.go (go package, package main). Imports, each its own addImport, exactly these: context, errors, os, path/filepath, time, github.com/livecodelife/provenance/auth.

  Declarations, in this order, each exactly one set* call (file kwarg cmd/provenance/session_run.go) whose code kwarg is the code below verbatim (gofmt-formatted, comments kept). Do not alter, reorder or add anything. A const or var group is one setConst or setVar named after its first name; setMethod takes receiver and name separately.

    - setType name exitError, code exactly:
        // exitError carries a process exit status for main to use.
        type exitError struct {
        	code int
        	err  error
        }
    - setMethod receiver exitError name Error, code exactly:
        func (e *exitError) Error() string { return e.err.Error() }
    - setMethod receiver exitError name Unwrap, code exactly:
        func (e *exitError) Unwrap() error { return e.err }
    - setFunction name exitCode, code exactly:
        // exitCode is the process exit status for err: 3 when a Provisio session is
        // needed or has expired, 1 for anything else.
        func exitCode(err error) int {
        	var ee *exitError
        	if errors.As(err, &ee) {
        		return ee.code
        	}
        	return 1
        }
    - setConst name msgNeedSession, code exactly:
        const (
        	msgNeedSession   = "This command needs a Provisio session. Run provenance login (or set PROVISIO_TOKEN in CI)."
        	msgSessionExpire = "Your Provisio session has expired. Run provenance login."
        	msgTokenRejected = "The personal token was rejected (revoked or expired). Replace PROVISIO_TOKEN, or run provenance login."
        )
    - setFunction name sessionError, code exactly:
        // sessionError turns an auth failure into the user-facing message with exit
        // status 3; other errors pass through unchanged.
        func sessionError(err error) error {
        	switch {
        	case err == nil:
        		return nil
        	case errors.Is(err, auth.ErrNoSession):
        		return &exitError{3, errors.New(msgNeedSession)}
        	case errors.Is(err, auth.ErrSessionExpired):
        		return &exitError{3, errors.New(msgSessionExpire)}
        	case errors.Is(err, auth.ErrTokenRejected):
        		return &exitError{3, errors.New(msgTokenRejected)}
        	}
        	return err
        }
    - setFunction name serverURL, code exactly:
        // serverURL is the auth service for a new sign-in: PROVISIO_AUTH_URL, else the
        // default. Commands that use a stored sign-in prefer the server it was made on.
        func serverURL() string {
        	if s := os.Getenv(auth.EnvServer); s != "" {
        		return s
        	}
        	return auth.DefaultServer
        }
    - setFunction name sessionManager, code exactly:
        // sessionManager builds the token manager over the default credential store.
        func sessionManager() (*auth.Manager, error) {
        	store, err := auth.DefaultStore()
        	if err != nil {
        		return nil, err
        	}
        	path, err := auth.DefaultFilePath()
        	if err != nil {
        		return nil, err
        	}
        	server := serverURL()
        	if os.Getenv(auth.EnvServer) == "" && os.Getenv(auth.EnvToken) == "" {
        		if cred, _, err := store.Load(); err == nil && cred.Server != "" {
        			server = cred.Server
        		}
        	}
        	return &auth.Manager{
        		Store:    store,
        		Client:   &auth.Client{Server: server},
        		LockPath: filepath.Join(filepath.Dir(path), "credentials.lock"),
        	}, nil
        }
    - setFunction name withTimeout, code exactly:
        // withTimeout is context.WithTimeout with a cancel func that needs no import
        // at the call site.
        func withTimeout(ctx context.Context, d time.Duration) (context.Context, func()) {
        	return context.WithTimeout(ctx, d)
        }
    - setFunction name withSession, code exactly:
        // withSession runs fn with a bearer token, refreshing once on a 401. Commands
        // that need a Provisio session (publish, clone, import) go through it; local
        // commands never call it.
        func withSession(ctx context.Context, fn func(bearer string) error) error {
        	m, err := sessionManager()
        	if err != nil {
        		return err
        	}
        	return sessionError(m.Do(ctx, fn))
        }
