intent: ServerIDPattern is the single place that says which record ids the record service accepts.
constraints:
  - ServerIDPattern is an exported package-level constant.
  - ServerIDPattern is an untyped string constant holding a regular expression that must match the whole id.
  - The expression accepts the text prov-, then exactly four decimal digits, then a hyphen, then either exactly eight lowercase hexadecimal digits or exactly three decimal digits, and nothing after that.
  - The ids prov-2026-1a2b3c4d and prov-2026-001 are accepted.
  - The ids prov-2026-0001, prov-2026-01, prov-2026-1A2B3C4D, prov-2026-1a2b3c4, prov-2026-1a2b3c4d5, prov-26-1a2b3c4d, prov-2026-1a2b3c4d-x and the empty string are rejected.
  - This unit adds no imports to the file.
