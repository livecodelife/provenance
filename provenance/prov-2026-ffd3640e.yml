id: prov-2026-ffd3640e
title: 'Apply: how each folded version''s content, reason and pins are built'
status: implemented
version: 1
created_at: "2026-10-15"
author: calebcowen@gmail.com
intent: |
  Apply walks each surviving record's members in Plan's version order and
  builds one snapshot per member:
  - Version 1 is the first member's own content, reason "".
  - A bug member (rules 3, 4, C3) unions its affected_scope (order kept,
    new entries appended), appends constraints the version lacks (equality
    by record.Normalize), unions associated_specs by path; intent and the
    other fields carry over. reason = the bug's intent, reason_kind fix. If
    nothing changes it is a reason-only version.
  - A non-bug member (rules 1, 2) replaces the content with its own fields.
    reason = "Supersedes <previous id>: <its title>" (not settled by the
    report; flagged in #provisio).
  - Snapshot author is the member's author; created_at is its git first-add
    time, else its v1 created_at at 00:00:00Z.
  The record file keeps the survivor's path and formatting (spliced by the
  codec) and holds the last version's content, so its content_hash equals the
  head snapshot's. Its status and sealed_at_sha are the newest member's,
  aliases are every absorbed id, type is written explicitly, and the
  v1-only fields are dropped.

  Pins: every implements t is rewritten to survivor(t) with
  implements_version = t's position in that survivor's order (1 when it has
  one version), so children of a parent that gained versions show as stale.
  A shared-repo target keeps its id, gets implements_repo = the shared_repos
  name and version 0 (unknown). A dangling target keeps its id with version 0.

  Kept-separate bugs (deprecated, or an accepted suggestion) and bugs with
  no local target become imprints shaped by KeptImprint: reason = intent,
  reason_kind fix. A kept rule-2 edge adds the older id to the newer
  record's related. Absorbed files are removed through record.Store.Remove.
  Apply returns the version manifest {id, version, content_hash}; the caller
  chooses where to write it.
constraints:
  - Every record Apply writes is schema 2 and passes Validate; every snapshot verifies; each head snapshot's content_hash equals its record file's.
  - Running MakePlan on Apply's output yields no entries.
  - Tested only on temp copies of the repositories.
affected_scope:
  - migrate/apply.go
  - migrate/apply_test.go
  - record/store.go
  - record/snapshot.go
  - record/store_test.go
