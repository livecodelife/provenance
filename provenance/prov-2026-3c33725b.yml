intent: the recordFileID function returns the record id when a path is a record file directly inside the records directory.
constraints:
  - The function receives a pointer to a repo and a path string, in that order
  - The function returns a string
  - The function returns the empty string when the path does not start with the repo's Config.Dir followed by a slash
  - The function returns the empty string when the path does not end in ".yml"
  - The id is the text between the directory prefix and the ".yml" suffix
  - The function returns the empty string when that text is empty
  - The function returns the empty string when that text contains a slash
  - Otherwise the function returns the text as the record id
  - The repo parameter is a pointer to the repo struct defined in common_run.go of package main
  - The repo's Config.Dir field is a string holding the records directory relative to the repo root, without a trailing slash
  - The function adds no imports
