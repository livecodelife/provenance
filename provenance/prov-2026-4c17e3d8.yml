id: prov-2026-4c17e3d8
title: 'Codec: splice changed top-level keys by node byte range instead of v1 line patching'
status: implemented
version: 1
created_at: "2026-10-15"
author: calebcowen@gmail.com
intent: |
  linespec's SaveRecord patches three scalar fields (status, sealed_at_sha,
  superseded_by) line by line, guessing multiline-scalar boundaries from
  indentation. v2 must also rewrite content fields (revise/edit change intent,
  constraints and scopes), plus version, reason and implements_version, which
  line patching cannot do safely.

  Decision: parse the file with yaml.v3 into a Node tree, find each top-level
  key's byte span (from its key line to the line before the next top-level
  key, keeping trailing comments/blank lines with the following key), and for
  each field whose value changed, replace only that span with a freshly
  encoded "key: value" block. Unchanged keys, comments, key order and quoting
  stay byte-identical. A new key is appended at the end of the mapping (or
  after a named anchor key, e.g. version after status). A removed key's span
  is deleted. New files are encoded in canonical v2 key order.

  What carries over from v1: preserving "" vs null style for an emptied
  scalar, and the guarantee that a save which changes nothing writes the
  original bytes back.
constraints:
  - A save that changes no field returns the input bytes unchanged.
  - Unknown top-level keys and comments outside changed spans survive byte-for-byte.
  - Round-trip test over every record in the four repos (decode, save unchanged, compare bytes).
