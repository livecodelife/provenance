intent: the headRecord function loads the record stored in a record file at a git revision.
constraints:
  - The function receives, in order, a pointer to a repo, a revision string base and a path string
  - The function returns a pointer to a record.Record and a boolean that is true when the record was loaded
  - The record type comes from the record package (github.com/livecodelife/provenance/record)
  - When git fails, the function returns a nil record and false
  - The text read is converted to bytes with one newline character appended, because the git method trims trailing whitespace
  - The function parses the bytes with record.Parse (takes a byte slice; returns a document pointer and an error)
  - When parsing fails, the function returns a nil record and false
  - On success the function returns the document's Record method result and true
  - The repo parameter is a pointer to the repo struct defined in common_run.go of package main
  - The repo's git method takes a variadic list of string arguments, runs git in the repo root and returns the trimmed standard output as a string and an error
  - The function reads the file with the repo's git method (variadic string arguments; returns trimmed standard output and an error) using show and the text base, a colon, ./ and the path.
  - The ./ before the path makes git resolve the path relative to the directory git runs in, the repo root, rather than the git top level.
  - The function owns the import of github.com/livecodelife/provenance/record as a value import of a package of this module
