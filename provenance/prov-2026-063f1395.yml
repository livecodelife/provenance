intent: "The provenance check command (--staged, the commit-msg hook; --commit and --range for history; --evidence for proof freshness), in two\nfiles. A port of linespec's CheckStaged onto v2: tags resolve through\nlint.ResolveTag, every check reads the index (not the working tree)\nthrough a temp checkout, snapshots are append-only, status changes follow\nlint.CheckTransition, and lint runs on the staged tree.\n\nWiring, cmd/provenance/check_cmd.go (cobra package): a top-level command,\nuse \"check\", short \"Check staged changes against provenance records (the\ncommit-msg hook)\", arity none. Flags, none with a short form or default:\n- staged (bool): \"Check the staged changes\"\n- message-file (string): \"Commit message file (as the commit-msg hook passes it)\"\n- commit (string): \"Check one commit\"\n- range (string): \"Check every commit in a..b\"\n- evidence (bool): \"Report whether each implemented record's evidence is fresh\"\n- json (bool): \"Print --evidence as JSON\"\n- format (string): \"Output format for violations and evidence (human|sarif)\"\n\nLogic, cmd/provenance/check_run.go (go package, package main). When MERGE_HEAD exists, --staged checks only the paths whose staged content differs from BOTH parents. The CLI's own state paths (.provenance/, <dir>/.versions/**, <dir>/.evidence/**, including pins.jsonl) are always exempt from scope checks, built in. A change to a record's own file that only moves implements_version (a repin: same status, same version) is exempt from the implemented-record check. The lint run inside the change check passes the shared repos' cached records (loadShared) and names, so references to shared parents resolve. With --format sarif (after the mode check) runCheck returns checkSarif(out, cmd, r), defined in check_sarif_run.go; an unknown format is an error. A deletion is not a scope violation when the tagged record's previous version (the snapshot at version-1 of the checked tree) covered the path and the record's current forbidden_scope does not match it: the path exists in the base tree, is gone in the checked tree and is outside the current scope (deletedFromPreviousScope). Modifying such a path, or deleting a path no version covered, is still a violation, in --staged, --commit and --range alike. Imports, each its own addImport, exactly these: errors, fmt, io, os, path/filepath, strings, github.com/spf13/cobra, github.com/livecodelife/provenance/lint, github.com/livecodelife/provenance/record, github.com/livecodelife/provenance/scope.\n\nDeclarations, in this order, each exactly one set* call whose code kwarg is the code below verbatim (gofmt-formatted, comments kept). Do not alter, reorder or add anything.\n\n  - setType name violation, code exactly:\n      type violation struct {\n      \tRecordID string\n      \tFile     string\n      \tMessage  string\n      }\n  - setFunction name stagedTree, code exactly:\n      func stagedTree(r *repo) (string, func(), error) {\n      \tdir, err := os.MkdirTemp(\"\", \"provenance-staged-\")\n      \tif err != nil {\n      \t\treturn \"\", nil, err\n      \t}\n      \tif _, err := r.git(\"checkout-index\", \"-a\", \"--prefix=\"+dir+\"/\"); err != nil {\n      \t\tos.RemoveAll(dir)\n      \t\treturn \"\", nil, err\n      \t}\n      \treturn dir, func() { os.RemoveAll(dir) }, nil\n      }\n  - setFunction name stagedPaths, code exactly:\n      func stagedPaths(r *repo) ([]string, error) {\n      \tout, err := r.git(\"diff\", \"--cached\", \"--name-only\", \"--no-renames\")\n      \tif err != nil {\n      \t\treturn nil, err\n      \t}\n      \tvar files []string\n      \tfor _, line := range strings.Split(out, \"\\n\") {\n      \t\tif line != \"\" {\n      \t\t\tfiles = append(files, line)\n      \t\t}\n      \t}\n      \treturn mergeFiltered(r, files), nil\n      }\n  - setFunction name headRecord, code exactly:\n      func headRecord(r *repo, base, path string) (*record.Record, bool) {\n      \tdata, err := r.git(\"show\", base+\":\"+path)\n      \tif err != nil {\n      \t\treturn nil, false\n      \t}\n      \tdoc, err := record.Parse([]byte(data + \"\\n\"))\n      \tif err != nil {\n      \t\treturn nil, false\n      \t}\n      \treturn doc.Record(), true\n      }\n  - setFunction name headHas, code exactly:\n      func headHas(r *repo, base, path string) bool {\n      \t_, err := r.git(\"cat-file\", \"-e\", base+\":\"+path)\n      \treturn err == nil\n      }\n  - setFunction name snapshotOwner, code exactly:\n      func snapshotOwner(r *repo, path string) string {\n      \tprefix := filepath.ToSlash(r.Config.Dir) + \"/.versions/\"\n      \tif !strings.HasPrefix(path, prefix) {\n      \t\treturn \"\"\n      \t}\n      \trest := strings.TrimPrefix(path, prefix)\n      \tif i := strings.Index(rest, \"/\"); i >= 0 {\n      \t\treturn rest[:i]\n      \t}\n      \treturn \"\"\n      }\n  - setFunction name recordFileID, code exactly:\n      func recordFileID(r *repo, path string) string {\n      \tprefix := r.Config.Dir + \"/\"\n      \tif !strings.HasPrefix(path, prefix) || !strings.HasSuffix(path, \".yml\") {\n      \t\treturn \"\"\n      \t}\n      \tname := strings.TrimSuffix(strings.TrimPrefix(path, prefix), \".yml\")\n      \tif name == \"\" || strings.Contains(name, \"/\") {\n      \t\treturn \"\"\n      \t}\n      \treturn name\n      }\n  - setFunction name checkStaged, code exactly:\n      func checkStaged(r *repo, message string) ([]violation, error) {\n      \tfiles, err := stagedPaths(r)\n      \tif err != nil {\n      \t\treturn nil, err\n      \t}\n      \ttree, cleanup, err := stagedTree(r)\n      \tif err != nil {\n      \t\treturn nil, err\n      \t}\n      \tdefer cleanup()\n      \treturn checkChange(r, \"HEAD\", tree, files, message)\n      }\n  - setFunction name printViolations, code exactly:\n      func printViolations(out io.Writer, vs []violation) {\n      \tif len(vs) == 0 {\n      \t\tfmt.Fprint(out, \"\\n✓ No forbidden scope violations in staged\\n\\n\")\n      \t\treturn\n      \t}\n      \tfmt.Fprint(out, \"\\n✗ Forbidden scope violation in staged\\n\\n\")\n      \tvar order []string\n      \tgroups := map[string][]violation{}\n      \tfor _, v := range vs {\n      \t\tif v.RecordID == \"\" {\n      \t\t\tfmt.Fprintf(out, \"  %s\\n\", v.Message)\n      \t\t\tcontinue\n      \t\t}\n      \t\tif _, ok := groups[v.RecordID]; !ok {\n      \t\t\torder = append(order, v.RecordID)\n      \t\t}\n      \t\tgroups[v.RecordID] = append(groups[v.RecordID], v)\n      \t}\n      \tfor _, id := range order {\n      \t\tfmt.Fprintf(out, \"  %s forbids changes to:\\n\", id)\n      \t\tfor _, v := range groups[id] {\n      \t\t\tif v.File != \"\" {\n      \t\t\t\tfmt.Fprintf(out, \"    · %s\\n\", v.File)\n      \t\t\t} else {\n      \t\t\t\tfmt.Fprintf(out, \"    %s\\n\", v.Message)\n      \t\t\t}\n      \t\t}\n      \t\tfmt.Fprintln(out)\n      \t}\n      \tfmt.Fprint(out, \"  Hint: If this change is intentional, revise the record to widen its scope (provenance edit --add-scope) or create a record that covers it.\\n\\n\")\n      }\n  - setFunction name runCheck, code exactly:\n      func runCheck(out io.Writer, cmd *cobra.Command, args []string) error {\n      \tr, err := openRepo(cmd)\n      \tif err != nil {\n      \t\treturn err\n      \t}\n      \tstaged, _ := cmd.Flags().GetBool(\"staged\")\n      \tcommit, _ := cmd.Flags().GetString(\"commit\")\n      \trng, _ := cmd.Flags().GetString(\"range\")\n      \tev, _ := cmd.Flags().GetBool(\"evidence\")\n      \tif !staged && commit == \"\" && rng == \"\" && !ev {\n      \t\treturn errors.New(\"pass --staged, --commit <sha>, --range <a..b> or --evidence\")\n      \t}\n      \tformat, _ := cmd.Flags().GetString(\"format\")\n      \tif format != \"\" && format != \"human\" && format != \"sarif\" {\n      \t\treturn fmt.Errorf(\"unknown format %q (human|sarif)\", format)\n      \t}\n      \tif format == \"sarif\" {\n      \t\treturn checkSarif(out, cmd, r)\n      \t}\n      \tif commit != \"\" || rng != \"\" {\n      \t\treturn runCheckCommits(out, r, commit, rng)\n      \t}\n      \tif ev {\n      \t\treturn runCheckEvidence(out, cmd, r)\n      \t}\n      \tmsgFile, _ := cmd.Flags().GetString(\"message-file\")\n      \tvar message string\n      \tif msgFile != \"\" {\n      \t\tdata, err := os.ReadFile(msgFile)\n      \t\tif err != nil {\n      \t\t\treturn err\n      \t\t}\n      \t\tmessage = strings.TrimSpace(string(data))\n      \t} else {\n      \t\tmessage, err = r.git(\"log\", \"-1\", \"--format=%B\")\n      \t\tif err != nil {\n      \t\t\treturn err\n      \t\t}\n      \t}\n      \tvs, err := checkStaged(r, message)\n      \tif err != nil {\n      \t\tfmt.Fprintf(out, \"\\n✗ Check failed: %v\\n\\n\", err)\n      \t\treturn err\n      \t}\n      \tprintViolations(out, vs)\n      \tif len(vs) > 0 {\n      \t\treturn errors.New(\"forbidden scope violations found\")\n      \t}\n      \treturn nil\n      }\n  - setFunction name blobOf, code exactly:\n      func blobOf(r *repo, spec string) string {\n      \tout, err := r.git(\"rev-parse\", \"-q\", \"--verify\", spec)\n      \tif err != nil {\n      \t\treturn \"\"\n      \t}\n      \treturn out\n      }\n  - setFunction name mergeFiltered, code exactly:\n      func mergeFiltered(r *repo, files []string) []string {\n      \tif _, err := r.git(\"rev-parse\", \"-q\", \"--verify\", \"MERGE_HEAD\"); err != nil {\n      \t\treturn files\n      \t}\n      \tvar out []string\n      \tfor _, f := range files {\n      \t\tidx := blobOf(r, \":\"+f)\n      \t\tif idx != blobOf(r, \"HEAD:\"+f) && idx != blobOf(r, \"MERGE_HEAD:\"+f) {\n      \t\t\tout = append(out, f)\n      \t\t}\n      \t}\n      \treturn out\n      }\n  - setFunction name deletedFromPreviousScope, code exactly:\n      func deletedFromPreviousScope(r *repo, staged *record.FilesStore, base, tree string, rec *record.Record, f string) bool {\n      \tif rec.Version < 2 {\n      \t\treturn false\n      \t}\n      \tif _, err := os.Stat(filepath.Join(tree, filepath.FromSlash(f))); !os.IsNotExist(err) {\n      \t\treturn false\n      \t}\n      \tif !headHas(r, base, f) {\n      \t\treturn false\n      \t}\n      \tsnap, err := staged.Snapshot(rec.ID, rec.Version-1)\n      \tif err != nil || snap.Content == nil {\n      \t\treturn false\n      \t}\n      \tfor _, pat := range rec.ForbiddenScope {\n      \t\tif ok, err := scope.Match(f, pat); err == nil && ok {\n      \t\t\treturn false\n      \t\t}\n      \t}\n      \tfor _, pat := range snap.Content.AffectedScope {\n      \t\tif ok, err := scope.Match(f, pat); err == nil && ok {\n      \t\t\treturn true\n      \t\t}\n      \t}\n      \treturn false\n      }\n  - setFunction name checkChange, code exactly:\n      func checkChange(r *repo, base, tree string, files []string, message string) ([]violation, error) {\n      \tstaged := &record.FilesStore{Root: tree, Dir: r.Config.Dir, SpecRoot: tree}\n      \tvar vs []violation\n      \n      \tfor _, f := range files {\n      \t\tif owner := snapshotOwner(r, f); owner != \"\" && headHas(r, base, f) {\n      \t\t\tvs = append(vs, violation{RecordID: owner, Message: \"snapshot files are append-only: \" + f + \" already exists in \" + base})\n      \t\t}\n      \t}\n      \n      \tfor _, f := range files {\n      \t\tid := recordFileID(r, f)\n      \t\tif id == \"\" {\n      \t\t\tcontinue\n      \t\t}\n      \t\tif _, err := os.Stat(filepath.Join(tree, f)); err != nil {\n      \t\t\tcontinue\n      \t\t}\n      \t\tnow, _, err := staged.Load(id)\n      \t\tif err != nil {\n      \t\t\tcontinue\n      \t\t}\n      \t\tif prev, ok := headRecord(r, base, f); ok && prev.Status != now.Status {\n      \t\t\tif err := lint.CheckTransition(prev.Status, now.Status, now.Version > prev.Version); err != nil {\n      \t\t\t\tvs = append(vs, violation{RecordID: id, Message: fmt.Sprintf(\"%s: %v\", id, err)})\n      \t\t\t}\n      \t\t}\n      \t}\n      \n      \tenforcement := r.Config.Enforcement\n      \tif enforcement == \"\" {\n      \t\tenforcement = \"none\"\n      \t}\n      \tshared, _ := loadShared(r)\n      \tres, err := lint.Lint(staged, lint.Options{Root: tree, Enforcement: enforcement, ExcludePaths: r.Config.ExcludePaths, ManifestPath: manifestPath, Shared: shared, SharedRepos: sharedNames(r)})\n      \tif err != nil {\n      \t\treturn nil, err\n      \t}\n      \ttags := lint.ParseCommitTags(message)\n      \trelevant := map[string]bool{}\n      \tfor _, t := range tags {\n      \t\trelevant[t.ID] = true\n      \t}\n      \tfor _, f := range files {\n      \t\tif id := recordFileID(r, f); id != \"\" {\n      \t\t\trelevant[id] = true\n      \t\t}\n      \t}\n      \tfor _, is := range res.Issues {\n      \t\tif is.Severity == lint.SeverityError && (is.RecordID == \"\" || relevant[is.RecordID]) {\n      \t\t\tvs = append(vs, violation{RecordID: is.RecordID, Message: \"lint \" + is.Rule + \": \" + is.Message})\n      \t\t}\n      \t}\n      \n      \tvar nonExcluded []string\n      \tfor _, f := range files {\n      \t\tif !scope.Excluded(f, r.Config.ExcludePaths) && !stateExempt(r, f) {\n      \t\t\tnonExcluded = append(nonExcluded, f)\n      \t\t}\n      \t}\n      \n      \tif len(tags) == 0 {\n      \t\tif r.Config.CommitTagRequired && len(nonExcluded) > 0 {\n      \t\t\tvs = append(vs, violation{Message: \"Commit tag required but no provenance ID found in message\"})\n      \t\t}\n      \t\treturn vs, nil\n      \t}\n      \tif len(nonExcluded) == 0 {\n      \t\treturn vs, nil\n      \t}\n      \n      \tfor _, tag := range tags {\n      \t\tresolved, err := lint.ResolveTag(staged, tag)\n      \t\tif err != nil {\n      \t\t\tif tag.Version == 0 {\n      \t\t\t\tcontinue\n      \t\t\t}\n      \t\t\tvs = append(vs, violation{RecordID: tag.ID, Message: err.Error()})\n      \t\t\tcontinue\n      \t\t}\n      \t\trec, _, err := staged.Load(resolved.ID)\n      \t\tif err != nil {\n      \t\t\tcontinue\n      \t\t}\n      \t\tif tag.Version != 0 && tag.Version != rec.Version {\n      \t\t\tvs = append(vs, violation{RecordID: rec.ID, Message: fmt.Sprintf(\"%s is at version %d in this commit: tag it [%s@%d], not %s\", rec.ID, rec.Version, rec.ID, rec.Version, tag.String())})\n      \t\t\tcontinue\n      \t\t}\n      \t\town := r.Config.Dir + \"/\" + rec.ID + \".yml\"\n      \t\tvar enforce []string\n      \t\tfor _, f := range nonExcluded {\n      \t\t\tif f == manifestPath || snapshotOwner(r, f) == rec.ID {\n      \t\t\t\tcontinue\n      \t\t\t}\n      \t\t\tif f == own {\n      \t\t\t\tif prev, ok := headRecord(r, base, own); ok && prev.Status == rec.Status && prev.Version == rec.Version && prev.ImplementsVersion != rec.ImplementsVersion {\n      \t\t\t\t\tcontinue\n      \t\t\t\t}\n      \t\t\t}\n      \t\t\tif id := recordFileID(r, f); id != \"\" {\n      \t\t\t\tif other, _, err := staged.Load(id); err == nil && other.Implements == rec.ID {\n      \t\t\t\t\tcontinue\n      \t\t\t\t}\n      \t\t\t}\n      \t\t\tenforce = append(enforce, f)\n      \t\t}\n      \t\tif len(enforce) == 0 {\n      \t\t\tcontinue\n      \t\t}\n      \t\tif rec.Status == record.StatusImplemented {\n      \t\t\townStaged := false\n      \t\t\tfor _, f := range files {\n      \t\t\t\tif f == own {\n      \t\t\t\t\townStaged = true\n      \t\t\t\t}\n      \t\t\t}\n      \t\t\tcompletion := false\n      \t\t\tif ownStaged {\n      \t\t\t\tif prev, ok := headRecord(r, base, own); ok && prev.Status != record.StatusImplemented {\n      \t\t\t\t\tcompletion = true\n      \t\t\t\t}\n      \t\t\t}\n      \t\t\tif !completion {\n      \t\t\t\tvs = append(vs, violation{RecordID: rec.ID, Message: rec.ID + \" is implemented: run 'provenance revise \" + rec.ID + \"' to start a new version, then tag the commit with it.\"})\n      \t\t\t\tcontinue\n      \t\t\t}\n      \t\t}\n      \t\tfor _, f := range enforce {\n      \t\t\tif f == own {\n      \t\t\t\tfor _, pat := range rec.ForbiddenScope {\n      \t\t\t\t\tm, err := scope.Match(f, pat)\n      \t\t\t\t\tif err != nil {\n      \t\t\t\t\t\treturn nil, err\n      \t\t\t\t\t}\n      \t\t\t\t\tif m {\n      \t\t\t\t\t\tvs = append(vs, violation{RecordID: rec.ID, File: f, Message: rec.ID + \" forbids changes to \" + f})\n      \t\t\t\t\t\tbreak\n      \t\t\t\t\t}\n      \t\t\t\t}\n      \t\t\t\tcontinue\n      \t\t\t}\n      \t\t\tok, err := scope.InScope(rec, f)\n      \t\t\tif err != nil {\n      \t\t\t\treturn nil, err\n      \t\t\t}\n      \t\t\tif !ok && deletedFromPreviousScope(r, staged, base, tree, rec, f) {\n      \t\t\t\tcontinue\n      \t\t\t}\n      \t\t\tif !ok {\n      \t\t\t\tvs = append(vs, violation{RecordID: rec.ID, File: f, Message: rec.ID + \" forbids changes to \" + f})\n      \t\t\t}\n      \t\t}\n      \t}\n      \treturn vs, nil\n      }\n  - setFunction name stateExempt, code exactly:\n      func stateExempt(r *repo, path string) bool {\n      \tdir := filepath.ToSlash(r.Config.Dir)\n      \treturn strings.HasPrefix(path, \".provenance/\") || strings.HasPrefix(path, dir+\"/.versions/\") || strings.HasPrefix(path, dir+\"/.evidence/\")\n      }"
constraints:
  - 'Both files are grown by sedum-haiku (--only prov-2026-063f1395): wiring with cobra, logic with go. Nothing in them is hand-written; a wrong result is fixed by revising this record and regrowing.'
  - 'cmd/provenance/check_test.go is the hand-written gate, including a partial-staging case (index and working tree differ) and the two spec cases provisio-mgr set: an unchanged record with a spec stays clean, and a staged spec edit without a bump is PROV024.'
  - 'TestCheckStatePathsAreExempt: staged .provenance/, <dir>/.versions/** and <dir>/.evidence/** files need no governing record or tag.'
  - 'TestCheckRepinCommitOnImplementedRecord: a commit that only repins an implemented record (implements_version) passes check.'
  - 'TestCheckAllowsDeletingAFileThePreviousVersionCovered and TestCheckStillRefusesOtherChangesToPathsOutsideTheScope: a move is one version; modifying a file that left the scope, or deleting a never-covered file, still fails; --staged, --commit and --range agree.'
