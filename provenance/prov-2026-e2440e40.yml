title: auth.Client.ListTokens
type: imprint
status: implemented
version: 1
reason: ""
created_at: "2026-10-21"
author: calebcowen@gmail.com
intent: ListTokens lists the caller's personal tokens as metadata without secrets.
constraints:
  - ListTokens is an exported method with a pointer receiver of type Client, taking ctx (context.Context) and bearer (string), and returning a slice of TokenView and an error.
  - 'It sends GET /tokens through do (parameters in order: ctx context.Context, method string, path string, bearer string, in any, out any; returns error).'
  - The bearer passed to do is the given bearer.
  - The in argument passed to do is nil, so there is no request body.
  - The response is a JSON object whose tokens key holds an array of token objects.
  - The array is decoded into TokenView values.
  - On success it returns that slice and nil.
  - On error it returns nil and the error passed through tokenErr (parameter err error, returns error).
  - A 401 error therefore becomes ErrUnauthorized.
  - A non-401 failure, such as 403 with code forbidden for a personal token, is returned as the OAuthError.
  - This method does not change the file's imports.
  - context.Context comes from package context.
  - http.MethodGet comes from package net/http.
affected_scope:
  - auth/client.go
