id: prov-2026-1949381f
title: 'evidence.Store.Append: same-second runs no longer collide'
type: blueprint
status: open
version: 1
reason: ""
created_at: "2026-10-16"
author: calebcowen@gmail.com
intent: |-
  evidence.Store.Append no longer fails when two runs of one record version carry the same At second (repro, prov-cli msg 59386: `provenance complete` then `provenance evidence refresh <id>` within one second gives "file exists"). Evidence files are named <version>-<unix-nanos> from At, which has second resolution, so the names collide.

  Append now creates the file with O_EXCL as before; when the name exists it retries with the nanos incremented by one until a name is free (bounded, then an error). So the first run keeps exactly <version>-<nanos>.json, the on-disk names stay backward compatible (List parses the same name format and sorts by it, so append order is preserved and a later append always sorts after an earlier one), no existing file is read, renamed or overwritten, and no evidence JSON field changes. Any other open error (permissions, missing dir) is returned at once.

  The exclusive-create loop is a small helper grown with sedum (evidence/exclusive.go, createExclusive); the one-line call in Append (evidence/evidence.go) is the only handwritten change. With this, prov-cli can drop its CLI workaround (truncate to the second, strictly later than the latest) as a follow-up in its own tree; nothing here edits the cli.
constraints:
  - 'On-disk names stay <version>-<unix-nanos>.json: the first run of a second keeps exactly that name, List needs no change, and no existing evidence file is renamed, rewritten or reordered.'
  - 'Append never overwrites (O_EXCL); a name clash retries with nanos+1 up to a fixed bound, then errors; any other open error returns at once.'
  - 'The bound is a named constant maxAppendRetries (in exclusive.go). TestAppendSameSecondDoesNotCollide (also asserts List order follows append order), TestAppendKeepsExistingFiles and TestAppendGivesUpAtRetryBound (new file, written first, failing on the old code with "file exists") pass; the existing evidence and stale tests still pass; the loop is grown with sedum and a second grow makes no model call. evidence.go gets only the one-line call; the reason is posted in #provisio.'
affected_scope:
  - evidence/evidence.go
  - evidence/exclusive.go
  - evidence/append_collision_test.go
forbidden_scope: []
