id: prov-2026-5f69977b
title: provenance revise command
status: draft
created_at: "2026-10-15"
author: calebcowen@gmail.com
intent: |
  The provenance revise command: a top-level command, use "revise [id]", short "Edit a record's content in $EDITOR and save it as a new version", arity max_one. Flags:
    - record (string): "Record to revise (or give it as the argument)"
    - reason (string): "Why this version exists (required for a new version)"
    - fix (bool): "Mark this version as a fix (reason_kind: fix)"
  No flag has a short form. No flag has a default value.

  Behaviour: The id comes from the argument or --record (both: must agree; aliases resolve). Content fields go to a temp YAML file opened in $EDITOR. If content_hash changed, record.Commit saves the next version with --reason (required), the record reopens if it was implemented, and the manifest is rewritten; unchanged content writes nothing and says so. A draft with no snapshot is edited in place without a version or reason. A deprecated record is refused. Prints the commit tag to use, [<id>@<n>]. The version-bump helper here is shared with edit.
constraints:
