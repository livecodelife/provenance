# Tests, then the repository's own provenance checks, on every pull request and
# every push to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test, check and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: go build -o "$RUNNER_TEMP/bin/provenance" ./cmd/provenance
      - run: echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # The commit check runs through `sedum check`, which adds sedum's waivers for
      # regeneration and marker migration commits; it runs the provenance built above.
      # Pinned to the v0.11.0 commit.
      - name: Install sedum
        run: go install github.com/livecodelife/sedum/cmd/sedum@00ae003d624f89c611b3387a33a828a9c86d0c4a

      - run: go vet ./...
      - run: go test ./...

      - name: sedum check --range
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
          fi
          sedum check --range "$base..HEAD"

      - run: provenance lint
