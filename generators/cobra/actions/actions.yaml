actions:
  # A command lives in its own file, cmd/<bin>/<command>_cmd.go, holding
  # new<Command>Cmd. A command is named by its path joined with hyphens:
  # `hooks install` is hooks-install, so subcommands never share a file or a
  # function with a top-level command of the same leaf name. Every region is a
  # statement, so gofmt has nothing to align across regions.
  createCommand:
    description: "Add a top-level command that does something: describe it, register it on the root command, and run run<Command> when invoked."
    composes: [describeCommand, registerCommand, setRun]

  createGroup:
    description: "Add a top-level command that only holds subcommands; invoking it alone prints its help."
    composes: [describeCommand, registerCommand]

  createSubcommand:
    description: "Add a command nested under another command: describe it, register it on its parent, and run run<Command> when invoked."
    composes: [describeCommand, registerSubcommand, setRun]

  describeCommand:
    kwargs:
      bin: { type: string, required: true, description: "The binary's directory name under cmd/, e.g. provenance." }
      command: { type: string, required: true, description: "The command's path joined with hyphens: run-specs for `run-specs`, hooks-install for `hooks install`." }
      use: { type: string, required: true, description: "Cobra's Use line: the command's own word followed by its argument placeholders, e.g. 'install [dir]' for hooks-install. No double quotes or backslashes." }
      short: { type: string, required: true, description: "One-line help text. No double quotes or backslashes." }
    identity: [bin, command]
    injects_into: "cmd/{{bin}}/{{command|snake}}_cmd.go"
    anchor: command
    exposed: false

  setRun:
    kwargs:
      bin: { type: string, required: true }
      command: { type: string, required: true }
    identity: [bin, command]
    injects_into: "cmd/{{bin}}/{{command|snake}}_cmd.go"
    anchor: command
    exposed: false

  registerCommand:
    kwargs:
      bin: { type: string, required: true }
      command: { type: string, required: true }
    identity: [bin, command]
    injects_into: "cmd/{{bin}}/main.go"
    anchor: commands
    exposed: false

  registerSubcommand:
    kwargs:
      bin: { type: string, required: true }
      parent: { type: string, required: true, description: "The parent command's path joined with hyphens, e.g. hooks." }
      command: { type: string, required: true }
    identity: [bin, parent, command]
    injects_into: "cmd/{{bin}}/{{parent|snake}}_cmd.go"
    anchor: subcommands
    exposed: false

  setArgs:
    description: "Declare how many positional arguments a command accepts."
    kwargs:
      bin: { type: string, required: true }
      command: { type: string, required: true, description: "The command's path joined with hyphens." }
      arity: { type: string, required: true, description: "none, one, max_one (zero or one), min_one (one or more), or any." }
    discriminator: arity
    variants: [none, one, max_one, min_one, any]
    identity: [bin, command]
    injects_into: "cmd/{{bin}}/{{command|snake}}_cmd.go"
    anchor: command

  # Flags carry no optional kwargs: a short form or a default is its own
  # action, so a model can only add one by choosing it.
  addFlag:
    description: "Add a flag to one command, with no short form. The command reads it with cmd.Flags().Get<Type>."
    kwargs:
      bin: { type: string, required: true }
      command: { type: string, required: true, description: "The command's path joined with hyphens." }
      flag: { type: string, required: true, description: "The flag's long name without dashes, e.g. message-file." }
      type: { type: string, required: true, description: "string, bool, int, or strings (repeatable; values may contain commas)." }
      usage: { type: string, required: true, description: "One-line help text. No double quotes or backslashes." }
    discriminator: type
    variants: [string, bool, int, strings]
    identity: [bin, command, flag]
    injects_into: "cmd/{{bin}}/{{command|snake}}_cmd.go"
    anchor: flags

  addShortFlag:
    description: "Add a flag with a one-letter short form to one command."
    kwargs:
      bin: { type: string, required: true }
      command: { type: string, required: true, description: "The command's path joined with hyphens." }
      flag: { type: string, required: true, description: "The flag's long name without dashes, e.g. message-file." }
      type: { type: string, required: true, description: "string, bool, int, or strings (repeatable; values may contain commas)." }
      usage: { type: string, required: true, description: "One-line help text. No double quotes or backslashes." }
      shorthand: { type: string, required: true, description: "The one-letter short form, e.g. c for -c." }
    discriminator: type
    variants: [string, bool, int, strings]
    identity: [bin, command, flag]
    injects_into: "cmd/{{bin}}/{{command|snake}}_cmd.go"
    anchor: flags

  addDefaultFlag:
    description: "Add a string flag with a default value to one command."
    kwargs:
      bin: { type: string, required: true }
      command: { type: string, required: true, description: "The command's path joined with hyphens." }
      flag: { type: string, required: true, description: "The flag's long name without dashes, e.g. message-file." }
      usage: { type: string, required: true, description: "One-line help text. No double quotes or backslashes." }
      default: { type: string, required: true, description: "The default value. No double quotes or backslashes." }
    identity: [bin, command, flag]
    injects_into: "cmd/{{bin}}/{{command|snake}}_cmd.go"
    anchor: flags

  addPersistentFlag:
    description: "Add a flag on the root command that every command inherits, with no short form."
    kwargs:
      bin: { type: string, required: true }
      flag: { type: string, required: true, description: "The flag's long name without dashes, e.g. message-file." }
      type: { type: string, required: true, description: "string, bool, int, or strings (repeatable; values may contain commas)." }
      usage: { type: string, required: true, description: "One-line help text. No double quotes or backslashes." }
    discriminator: type
    variants: [string, bool, int, strings]
    identity: [bin, flag]
    injects_into: "cmd/{{bin}}/main.go"
    anchor: persistent_flags

  addShortPersistentFlag:
    description: "Add a flag with a one-letter short form on the root command that every command inherits."
    kwargs:
      bin: { type: string, required: true }
      flag: { type: string, required: true, description: "The flag's long name without dashes, e.g. message-file." }
      type: { type: string, required: true, description: "string, bool, int, or strings (repeatable; values may contain commas)." }
      usage: { type: string, required: true, description: "One-line help text. No double quotes or backslashes." }
      shorthand: { type: string, required: true, description: "The one-letter short form, e.g. c for -c." }
    discriminator: type
    variants: [string, bool, int, strings]
    identity: [bin, flag]
    injects_into: "cmd/{{bin}}/main.go"
    anchor: persistent_flags

  describeRoot:
    description: "Set the root command's name and one-line help."
    kwargs:
      bin: { type: string, required: true }
      use: { type: string, required: true, description: "The binary's name, e.g. provenance." }
      short: { type: string, required: true, description: "One-line help text. No double quotes or backslashes." }
    identity: [bin]
    injects_into: "cmd/{{bin}}/main.go"
    anchor: root
