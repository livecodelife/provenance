name: cobra
extensions: [".go"]
comment_prefix: "//"

# Generated files are cmd/<bin>/<command>_cmd.go and main.go. A command's
# logic goes in <command>_run.go beside it, which a general package (such as
# go) can grow, since unmanaged binds every package. Tests are written by hand.
unmanaged:
  - "cmd/*/*_test.go"

test_paths:
  - "**/*_test.go"

op_exceptions:
  pascal:
    id: ID
    url: URL
    json: JSON

# Most commands have no subcommands, many have no flags, and a root needs no
# persistent flag; completeness never asks about these (prov-2026-73d32e29).
optional_anchors: [subcommands, flags, persistent_flags]
