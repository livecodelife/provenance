name: cobra
extensions: [".go"]
comment_prefix: "//"

# Generated files only wire commands together. A command's behaviour is
# hand-written in run_<name>.go beside it, and tests beside that; sedum never
# creates or injects into either.
unmanaged:
  - "cmd/*/run_*.go"
  - "cmd/*/*_test.go"

test_paths:
  - "**/*_test.go"
